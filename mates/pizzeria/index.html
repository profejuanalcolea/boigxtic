<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzeria Tres Quarts · Com s'escriuen les fraccions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#000000; --muted:#545454; --line:#d4d4d4; --slot:#efefef;
  --accent:#ff6a00; --accent-soft:#ffe3cc; --on-accent:#000000;
  --ok:#11803c; --ok-bg:#e2f6e8; --bad:#c42e1a; --bad-bg:#fde6e1;
  --cheese:#ffc94a; --crust:#b8651f; --tomato:#d7392b; --basil:#2e9d4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#151515; --ink:#ffffff; --muted:#b5b5b5; --line:#3a3a3a; --slot:#2a2a2a;
    --accent-soft:#3d1f08; --ok:#52d98a; --ok-bg:#0f2a1a; --bad:#ff8a73; --bad-bg:#3a140d;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#151515; --ink:#ffffff; --muted:#b5b5b5; --line:#3a3a3a; --slot:#2a2a2a;
  --accent-soft:#3d1f08; --ok:#52d98a; --ok-bg:#0f2a1a; --bad:#ff8a73; --bad-bg:#3a140d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-size:20px;line-height:1.5;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque','Arial Black',Impact,system-ui,sans-serif;font-weight:800;line-height:1.02;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)}

/* ---------- tendal ---------- */
.awning{height:30px;background:repeating-linear-gradient(90deg,var(--accent) 0 30px,#fff 30px 60px);
  -webkit-mask:radial-gradient(15px at 15px 100%,#0000 98%,#000) 0 0/30px 100%;mask:radial-gradient(15px at 15px 100%,#0000 98%,#000) 0 0/30px 100%;border-top:3px solid #000}
.tape{height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 11px,#000 11px 22px);
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 110px,transparent 110px 126px);mask-image:repeating-linear-gradient(90deg,#000 0 110px,transparent 110px 126px)}
.tape-x{position:absolute;left:-25%;right:-25%;top:40%;transform:rotate(-12deg);z-index:3;pointer-events:none}
.tape-x.b{transform:rotate(9deg);top:58%}

/* ---------- capçalera ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:.6rem;justify-content:space-between;padding:.5rem 1rem;flex-wrap:wrap}
.brand{font-family:'Bricolage Grotesque','Arial Black',sans-serif;font-weight:800;font-size:1.2rem;background:none;border:0;padding:0;cursor:pointer}
.stats{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.chip{border:2px solid var(--ink);border-radius:999px;padding:.1rem .65rem;font-size:.95rem;background:var(--surface);white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
button.chip{cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:1.2rem 1rem 4rem}

/* ---------- fraccions ---------- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em .04em}
.fr>span:last-child{padding:.04em .18em 0}

/* ---------- botons ---------- */
.btn{border:3px solid var(--ink);background:var(--surface);color:var(--ink);padding:.65rem 1.15rem;border-radius:12px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-weight:700;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.big{font-size:1.2rem;padding:.85rem 1.5rem}
.btn.small{font-size:.9rem;padding:.35rem .8rem;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:1.2rem}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--muted);font-size:1rem}

/* ---------- robot pizzaiolo ---------- */
.bot{display:flex;gap:.8rem;align-items:flex-end;margin:1rem 0}
.bot-av{flex:none;line-height:0}
.bot .say{position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:.65rem 1rem;margin-bottom:.4rem}
.bot .say b.who{display:block;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.bot.small .say{font-size:1rem;padding:.45rem .8rem}
.robot{overflow:visible}
.robot .rb-head{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.robot .rb-screen{fill:#000}
.robot .rb-eye{fill:var(--accent)}
.robot .rb-l{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.robot .rb-hat{fill:#fff;stroke:#000;stroke-width:4;stroke-linejoin:round}
.robot .rb-shirt{fill:#fff;stroke:var(--ink);stroke-width:4}
.robot .rb-stripe{stroke:#000;stroke-width:4}
.robot .rb-scarf{fill:var(--accent);stroke:#000;stroke-width:3;stroke-linejoin:round}
.robot .rb-mus{fill:var(--accent)}
.robot .rb-arm{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.robot .rb-hand{fill:var(--accent);stroke:var(--ink);stroke-width:3}
.robot .rb-all{animation:rbFloat 3.2s ease-in-out infinite}
@keyframes rbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.robot .rb-eyes{transform-box:fill-box;transform-origin:center;animation:rbBlink 4.2s infinite}
@keyframes rbBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.robot.talking .rb-mouth{transform-box:fill-box;transform-origin:center;animation:rbTalk .16s ease-in-out infinite alternate}
@keyframes rbTalk{from{transform:scale(1,1)}to{transform:scale(.8,.25)}}
.robot .rb-armR{transform-box:view-box;transform-origin:72px 88px}
.robot.mood-wave .rb-armR{animation:rbWave .45s ease-in-out 6 alternate}
@keyframes rbWave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.robot.mood-happy .rb-all,.robot.mood-wow .rb-all{animation:rbHop .5s ease-out 2,rbFloat 3.2s ease-in-out 1s infinite}
@keyframes rbHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.robot.mood-happy .rb-armL,.robot.mood-wow .rb-armL{transform-box:view-box;transform-origin:28px 88px;animation:rbArmUp .5s ease-out 2 alternate}
.robot.mood-happy .rb-armR,.robot.mood-wow .rb-armR{animation:rbArmUpR .5s ease-out 2 alternate}
@keyframes rbArmUp{to{transform:rotate(60deg)}}
@keyframes rbArmUpR{to{transform:rotate(-60deg)}}
.robot .rb-spark{transform-box:fill-box;transform-origin:center;animation:rbSpark .9s ease-out 2 both}
.robot .rb-spark.s2{animation-delay:.2s}.robot .rb-spark.s3{animation-delay:.4s}
@keyframes rbSpark{0%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(.5) rotate(90deg);opacity:0}}
.robot.mood-oops .rb-headg{transform-box:view-box;transform-origin:50px 60px;animation:rbShake .45s ease-in-out 2}
@keyframes rbShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.robot .rb-sweat{animation:rbSweat 1.3s ease-in 2 both}
@keyframes rbSweat{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.robot.mood-think .rb-eyes{animation:rbLook 2.4s ease-in-out infinite}
@keyframes rbLook{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.robot .rb-dot{animation:rbDots 1.2s infinite}.robot .rb-dot.d2{animation-delay:.2s}.robot .rb-dot.d3{animation-delay:.4s}
@keyframes rbDots{0%,100%{opacity:.2}50%{opacity:1}}

/* ---------- portada ---------- */
.cover{border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:8px 8px 0 var(--ink)}
.cover-in{padding:1.2rem 1.4rem 1.4rem}
.facade{display:block;width:100%;height:auto;border-bottom:4px solid var(--ink)}
.cover h1{font-size:clamp(2.4rem,8.5vw,4.6rem);margin:.4rem 0 .4rem}
.cover h1 small{display:block;font-size:.4em;letter-spacing:0;color:var(--muted);margin-top:.35rem;font-weight:500}
.field{display:block;font-weight:700;margin:1.1rem 0 .3rem}
.field input{display:block;width:100%;max-width:420px;margin-top:.35rem;padding:.7rem .9rem;border:3px solid var(--ink);border-radius:12px;background:var(--surface);font-size:1.15rem}
.pin{letter-spacing:.4em;max-width:180px!important;text-align:center;font-weight:700}
.rules{margin-top:1.4rem;border:3px solid var(--ink);border-radius:14px;padding:1rem 1.2rem;background:var(--accent-soft)}
.rules h3{margin:.1rem 0 .4rem;font-size:1.3rem}
.rules ul{margin:.2rem 0;padding-left:1.2rem}
.sign{margin-top:1.4rem;border-top:3px solid var(--ink);padding-top:.9rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.sign .school{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem}
.sign .ai{border:2px solid var(--ink);border-radius:999px;padding:.1rem .7rem;font-size:.9rem;font-weight:700}

/* ---------- mapa ---------- */
.level{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:18px;background:var(--surface);margin-top:1.2rem;box-shadow:5px 5px 0 var(--ink)}
.level .awning{height:22px;border-top:0}
.level-in{padding:.9rem 1.1rem 1.1rem}
.level-h{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.level-h h3{margin:0;font-size:1.5rem}
.level-h .rng{color:var(--muted);font-weight:700}
.lstars{font-size:1.4rem;letter-spacing:.1rem}
.level.locked{box-shadow:none;background:var(--slot)}
.level.locked .level-in{opacity:.5}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.6rem;margin-top:.8rem}
.step{border:3px solid var(--ink);border-radius:14px;background:var(--surface);padding:.55rem .6rem;text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;gap:.1rem;min-height:92px}
.step .s-ic{font-size:1.5rem;line-height:1}
.step .s-n{font-weight:700;font-size:.95rem;line-height:1.15}
.step .s-st{font-size:.85rem;color:var(--muted);margin-top:auto}
.step.done{background:var(--accent-soft)}
.step.current{background:var(--accent);color:#000;box-shadow:3px 3px 0 var(--ink)}
.step.current .s-st{color:#000}
.step:disabled{cursor:not-allowed;opacity:.5;box-shadow:none}
.diploma-card{grid-column:1/-1}

/* ---------- torn ---------- */
.rhead{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.rtitle{font-weight:700;color:var(--muted)}
.room h2{font-size:clamp(1.8rem,5.5vw,2.6rem);margin:.7rem 0 .3rem}
.progress{display:flex;gap:1rem;align-items:center;margin:.7rem 0;font-weight:700;flex-wrap:wrap}
.orders{display:inline-flex;gap:.2rem;font-size:1.3rem}
.orders i{font-style:normal;opacity:.25}.orders i.on{opacity:1}
.angry{display:inline-flex;gap:.15rem;font-size:1.3rem}
.angry i{font-style:normal;opacity:.2;filter:grayscale(1)}.angry i.on{opacity:1;filter:none}
details.carta{border:2px solid var(--ink);border-radius:12px;background:var(--surface);margin-bottom:1rem}
details.carta summary{cursor:pointer;padding:.55rem .9rem;font-weight:700}
.carta-in{border-top:2px solid var(--ink);padding:.8rem 1rem;background:#1b1b1b;color:#f4f4f4;border-radius:0 0 10px 10px;font-family:'Bricolage Grotesque',sans-serif}
.carta-in h4{margin:.2rem 0 .5rem;color:var(--accent);font-size:1.2rem;letter-spacing:.05em}
.carta-in p{margin:.3rem 0 .6rem;font-family:'Atkinson Hyperlegible',sans-serif;font-size:1rem}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.25rem .8rem}
.menu div{display:flex;align-items:center;gap:.5rem;border-bottom:1px dashed #666;padding:.15rem 0;font-size:1.05rem}
.menu .fr{color:var(--accent);font-size:1.05rem}

.qcard{position:relative;border:3px solid var(--ink);border-radius:18px;background:var(--surface);padding:1.1rem 1.2rem 1.4rem;box-shadow:6px 6px 0 var(--accent)}
.qnum{font-weight:700;color:var(--muted);font-size:.95rem}
.prompt{font-size:1.35rem;line-height:1.45;margin:.4rem 0 1rem}
.prompt .fr{font-size:1.2em}
.visual{margin:1rem 0;text-align:center}
.fig{display:block;margin:0 auto;max-width:100%;height:auto}
.plate{fill:var(--slot);stroke:var(--ink);stroke-width:3}
.sl{fill:var(--slot);stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4}
.sl.on{fill:var(--cheese);stroke:var(--crust);stroke-width:3;stroke-dasharray:none}
.pep{fill:var(--tomato);stroke:#8f1f16;stroke-width:1.5}
.bas{fill:var(--basil)}
.interactive .sl{cursor:pointer}
.interactive .sl:hover{fill:var(--accent-soft)}
.interactive .sl.on:hover{fill:var(--cheese)}
.ticket{display:inline-block;background:#fffdf5;color:#000;border:3px solid #000;border-radius:6px;padding:.8rem 1.3rem;font-size:2.4rem;box-shadow:4px 4px 0 #000;position:relative;
  -webkit-mask:radial-gradient(7px at 50% 0,#0000 98%,#000) 0 0/18px 51% repeat-x,radial-gradient(7px at 50% 100%,#0000 98%,#000) 0 100%/18px 51% repeat-x}
.ticket.words{font-size:1.6rem;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;padding:1rem 1.5rem}
.counter{text-align:center;font-weight:700;font-size:1.15rem;margin:.3rem 0 .6rem;min-height:1.6em}

.opts{display:grid;grid-template-columns:1fr;gap:.7rem}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:3px solid var(--ink);background:#fffdf5;color:#000;border-radius:10px;padding:.8rem 1rem;font-size:1.25rem;cursor:pointer;text-align:center;box-shadow:3px 3px 0 var(--ink);min-height:62px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt.right{background:var(--ok-bg);color:var(--ink);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.opt.wrong{background:var(--bad-bg);color:var(--ink);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.opt:disabled{cursor:default}

.ansrow{display:flex;gap:1.2rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:.35rem}
.fracin input{width:5.4rem;text-align:center;font-size:1.8rem;font-weight:700;padding:.3rem;border:3px solid var(--ink);border-radius:10px;background:var(--bg)}
.fbar{display:block;width:6rem;height:5px;background:var(--ink);border-radius:3px}
.wordin{width:min(100%,520px);font-size:1.5rem;padding:.5rem .8rem;border:3px solid var(--ink);border-radius:12px;background:var(--bg)}
.keys{display:flex;gap:.4rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap}
.key{border:2px solid var(--ink);background:var(--surface);border-radius:8px;min-width:2.6rem;padding:.2rem .5rem;font-size:1.2rem;font-weight:700;cursor:pointer}

.phone{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1rem;border:3px dashed var(--ink);border-radius:16px;background:var(--accent-soft)}
.phone .ring{font-size:3rem;line-height:1}
.phone.ringing .ring{animation:ring .5s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.written{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.3rem}

.pairs{display:grid;grid-template-columns:1fr 1.6fr;gap:.8rem 1.2rem;align-items:start}
.pcol{display:flex;flex-direction:column;gap:.6rem}
.pc{border:3px solid var(--ink);border-radius:12px;background:var(--surface);min-height:66px;padding:.4rem .6rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:.5rem}
.pc.frc{font-size:1.7rem}
.pc.nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.1rem;background:#fffdf5;color:#000}
.pc.sel{background:var(--accent);color:#000;transform:translateY(-3px)}
.pc.matched{background:var(--ok-bg);border-color:var(--ok);box-shadow:none;color:var(--ink);cursor:default;opacity:.75}
.pc.shake{animation:shake .45s}
.pc:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.timer{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:.4rem 0 .2rem;background:var(--slot)}
.timer>i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .25s linear}

.fb{margin-top:1rem;border:3px solid var(--ink);border-left-width:12px;border-radius:12px;padding:.4rem 1rem .9rem}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.warn{border-color:var(--accent);background:var(--accent-soft);padding:.6rem 1rem}
.fb .bot{margin:.4rem 0 .2rem}
.pts{display:inline-block;background:#000;color:var(--accent);border-radius:8px;padding:0 .45rem;font-size:.95rem;margin-left:.3rem}
.exp{margin:.4rem 0 .9rem;line-height:1.7}
.exp b.nm{font-family:'Bricolage Grotesque',sans-serif}
.tools{margin-top:1.1rem;display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}

.reveal{text-align:center;padding-top:.6rem}
.reveal h2{font-size:clamp(2rem,7vw,3.2rem);margin:.4rem 0}
.bigstars{font-size:3rem;letter-spacing:.2rem}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin:1.2rem 0;text-align:left}
.statgrid div{border:3px solid var(--ink);border-radius:12px;padding:.6rem .8rem;background:var(--surface)}
.statgrid b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:2rem}
.codebox{display:inline-block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.1rem,4.6vw,1.9rem);letter-spacing:.08em;background:#000;color:var(--accent);padding:.4rem 1rem;border-radius:14px;margin:.4rem 0}
.codepanel{margin-top:1rem;border:3px solid var(--ink);border-radius:14px;padding:1rem 1.2rem;background:var(--accent-soft);text-align:center}
.diploma{border:6px double var(--ink);border-radius:18px;padding:1.4rem;background:#fffdf5;color:#000;max-width:640px;margin:1rem auto}
.diploma h3{font-size:2rem;margin:.2rem 0}

/* ---------- tauler ---------- */
.tform{display:grid;grid-template-columns:1fr 1fr auto;gap:.7rem;align-items:end;margin:1rem 0}
@media (max-width:640px){.tform{grid-template-columns:1fr}}
.tform label{font-weight:700;font-size:.95rem}
.tform input{display:block;width:100%;margin-top:.3rem;padding:.6rem .8rem;border:3px solid var(--ink);border-radius:12px;background:var(--surface);font-size:1.1rem}
.twrap{overflow-x:auto;border:3px solid var(--ink);border-radius:14px;background:var(--surface);margin-top:1rem}
table.res{width:100%;border-collapse:collapse;font-size:1rem;min-width:760px}
table.res th,table.res td{padding:.5rem .6rem;text-align:left;border-bottom:2px solid var(--line);white-space:nowrap}
table.res th{background:#000;color:#fff}
table.res tfoot td{background:var(--accent-soft);font-weight:700;border-top:3px solid var(--ink)}
.heat{display:inline-grid;place-items:center;width:1.9rem;height:1.6rem;border-radius:6px;font-size:.85rem;font-weight:700;border:1.5px solid var(--line)}
.heat.h0{color:var(--muted)}.heat.h1{background:var(--accent-soft)}.heat.h2{background:#ffb27a;color:#000}.heat.h3{background:var(--accent);color:#000}
.rm{background:none;border:0;cursor:pointer;font-size:1.1rem;color:var(--bad)}
.legend{font-size:.9rem;color:var(--muted);margin:.5rem 0}
details.box{border:2px solid var(--ink);border-radius:12px;background:var(--surface);margin:.8rem 0}
details.box summary{cursor:pointer;padding:.55rem .9rem;font-weight:700}

<body>
<header class="top"><div class="top-in"><button class="brand" data-act="home">🍕 Pizzeria Tres Quarts</button><div class="stats" id="stats"></div></div><div class="awning" aria-hidden="true"></div></header>
<main id="app"></main>
<canvas id="confetti"></canvas>
<script>
/* =========================================================
   UTILITATS
   ========================================================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const normTeam=t=>strip(t).toLowerCase().replace(/[^a-z0-9]/g,'');
function h32(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h>>>0;}

/* =========================================================
   NOMS DE LES FRACCIONS EN CATALÀ
   Font: GIEC 17.2.5 (fraccionaris en -è: vint-i-dosè, trenta-dosè, centè)
   i dossier pàg. 3. Per al 100 fem servir «centèsim» (també és correcte «centè»).
   ========================================================= */
const UNI=['','un','dos','tres','quatre','cinc','sis','set','vuit','nou'];
const TEEN=['deu','onze','dotze','tretze','catorze','quinze','setze','disset','divuit','dinou'];
const TENS=['','','vint','trenta','quaranta','cinquanta','seixanta','setanta','vuitanta','noranta'];
function card(n){if(n<10)return UNI[n];if(n<20)return TEEN[n-10];if(n===100)return 'cent';const t=Math.floor(n/10),u=n%10;if(!u)return TENS[t];return t===2?`vint-i-${UNI[u]}`:`${TENS[t]}-${UNI[u]}`;}
const PSPEC={2:'mig',3:'terç',4:'quart',5:'cinquè',6:'sisè',7:'setè',8:'vuitè',9:'novè',10:'desè',11:'onzè',12:'dotzè',13:'tretzè',14:'catorzè',15:'quinzè',16:'setzè',17:'dissetè',18:'divuitè',19:'dinovè',20:'vintè'};
const UORD=['','unè','dosè','tresè','quatrè','cinquè','sisè','setè','vuitè','novè'];
const TORD=['','','vintè','trentè','quarantè','cinquantè','seixantè','setantè','vuitantè','norantè'];
function part(d){if(PSPEC[d])return PSPEC[d];if(d===100)return 'centèsim';const t=Math.floor(d/10),u=d%10;if(!u)return TORD[t];return t===2?`vint-i-${UORD[u]}`:`${TENS[t]}-${UORD[u]}`;}
function partPl(d){if(d===2)return 'mitjos';if(d===3)return 'terços';if(d===4)return 'quarts';if(d===100)return 'centèsims';return part(d).replace(/è$/,'ens');}
const nameF=(n,d)=>n===1?`un ${part(d)}`:`${card(n)} ${partPl(d)}`;
function variants(n,d){const v=[nameF(n,d)];
  if(n===1){v.push('u '+part(d));if(d===2)v.push('la meitat','meitat','mig');if(d===100)v.push('un centè','u centè');}
  if(n>20&&n%10===1){const c=card(n).replace(/un$/,'u');v.push(`${c} ${partPl(d)}`);}
  if(d===100&&n>1){const base=v.slice();base.forEach(x=>v.push(x.replace(/centèsims$/,'centens')));}
  return v;}
const tight=s=>String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,;:!?«»"]/g,' ').replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').trim();
const loose=s=>strip(tight(s)).replace(/-/g,' ').replace(/\s+/g,' ');
const CAST={2:'medios',3:'tercios',4:'cuartos',5:'quintos',6:'sextos',7:'séptimos',8:'octavos',9:'novenos',10:'décimos',100:'centésimos'};
function castName(n,d){if(CAST[d]){const w=CAST[d];return `${card(n)} ${n===1?w.replace(/s$/,''):w}`;}return `${card(n)} ${card(d)}avo${n===1?'':'s'}`;}
function checkWords(n,d,input){const t=tight(input),V=variants(n,d);
  if(V.map(tight).includes(t))return {ok:true};
  if(V.map(loose).includes(loose(input)))return {ok:true,msg:`Correcte! Però fixa't en com s'escriu exactament: <b class="nm">«${nameF(n,d)}»</b>${/-/.test(nameF(n,d))?', amb els guionets':''}${/[èçà]/.test(nameF(n,d))?' i els accents':''}.`};
  const sv=loose(input);let m='';
  if(/cuart|terci|quint|sext|septim|octav|noven|decim|medio|avos?\b|centesimos|onceav|doceav/.test(sv))m='Això és castellà! 😉 En català no es diu així.';
  else if(/\bdues\b/.test(sv))m='El numerador va en masculí: «dos», no «dues».';
  else if(n>1&&sv===loose(`${card(n)} ${part(d)}`))m='Quan el numerador és més gran que 1, el denominador va en <b>plural</b>.';
  else if(n===1&&sv===loose(`un ${partPl(d)}`))m='Quan el numerador és 1, el denominador va en <b>singular</b>.';
  else if(sv===loose(`${card(n)} ${card(d)}`))m='El denominador no es diu com un nombre normal: té un nom especial de fracció.';
  return {ok:false,msg:(m?m+'<br>':'')+`La teva resposta: «${esc(input)}»`};}
function wrongNames(n,d,L){const c=nameF(n,d),s=new Set();
  const cand=[castName(n,d),n===2?`dues ${partPl(d)}`:(n>20&&n%10===2?`${card(n).replace(/dos$/,'dues')} ${partPl(d)}`:null),
    n>1?`${card(n)} ${part(d)}`:`un ${partPl(d)}`,`${card(n)} ${card(d)}`,`${card(n)} de ${card(d)}`,
    inLevel(L,d+1)?nameF(n,d+1):null,inLevel(L,d-1)&&d>2?nameF(n,d-1):null,(n>=2&&n<=100&&d<=99&&n!==d)?nameF(d,n):null];
  for(const x of shuffle(cand))if(x&&x!==c&&!s.has(x))s.add(x);return [...s].slice(0,3);}
function explainName(n,d){let r;
  if(d<=10)r=`El ${d} com a denominador es diu <b class="nm">«${part(d)}»</b>${d>=3?`, en plural <b class="nm">«${partPl(d)}»</b>`:', en plural <b class="nm">«mitjos»</b>'}.`;
  else if(d<=20)r=`A partir d'11, el denominador és el nombre + <b>«-è»</b>: ${card(d)} → <b class="nm">«${part(d)}»</b>, en plural <b class="nm">«${partPl(d)}»</b>.`;
  else if(d===100)r=`El 100 es diu <b class="nm">«centèsim»</b>, en plural <b class="nm">«centèsims»</b>. (També és correcte «centè».)`;
  else if(d%10===0)r=`Les desenes: ${card(d)} → <b class="nm">«${part(d)}»</b>, en plural <b class="nm">«${partPl(d)}»</b>.`;
  else r=`Nombres compostos: s'escriuen <b>amb guionets</b> i la darrera part fa «-è»: ${card(d)} → <b class="nm">«${part(d)}»</b>, en plural <b class="nm">«${partPl(d)}»</b>.`;
  let nn=n===1?' Com que el numerador és 1, el denominador va en <b>singular</b>.':' El numerador és més gran que 1, per tant el denominador va en <b>plural</b>.';
  if(n%10===2&&n!==12)nn+=' El numerador va en masculí: «dos», no «dues».';
  return `${F(n,d)} → <b class="nm">«${nameF(n,d)}»</b><br>${r}${nn}`;}

/* =========================================================
   NIVELLS I TORNS
   ========================================================= */
const D3=[21,22,23,24,25,26,28,30,32,35,40,45,48,50,60,64,70,75,80,90,100,100,100];
const LEVELS=[
  {icon:'🏠',name:'La pizzeria del barri',rng:'Denominadors del 2 al 10',min:2,max:10},
  {icon:'🍝',name:'La trattoria',rng:'Denominadors de l\'11 al 20',min:11,max:20},
  {icon:'🎪',name:'El gran festival de la pizza',rng:'Denominadors fins al 100',min:21,max:100}];
const inLevel=(L,d)=>L===2?D3.includes(d):(d>=LEVELS[L].min&&d<=LEVELS[L].max);
function genFrac(L,{proper=false}={}){let d,n;
  if(L===0){d=rnd(2,10);n=proper||Math.random()<.75?rnd(1,d-1):rnd(1,10);}
  else if(L===1){d=rnd(11,20);n=proper||Math.random()<.8?rnd(1,d-1):rnd(1,20);}
  else{d=pick(D3);n=rnd(1,Math.min(99,d-1));}
  return [n,d];}
const STAGES=[
  {icon:'🎫',name:'Els tiquets',desc:'Uneix cada fracció amb el seu tiquet',count:3},
  {icon:'🙋',name:'Què demana el client?',desc:'Tria el tiquet correcte',count:5},
  {icon:'☎️',name:'Comanda per telèfon',desc:'Escolta i escriu la fracció',count:5},
  {icon:'👨‍🍳',name:'Prepara la comanda',desc:'Llegeix el tiquet i fes la fracció',count:5},
  {icon:'✍️',name:'Escriu el tiquet',desc:'Escriu el nom en lletres',count:5},
  {icon:'⏱️',name:"L'hora punta",desc:'Comandes barrejades, ràpid!',count:8}];
const NS=LEVELS.length*STAGES.length;
const TIPS=[
  ['Tres quarts, dos terços, cinc sisens... El numerador va primer!','Si el numerador és 1: singular (un quart). Si és més gran: plural (tres quarts).','Recorda: el 2 és «mig», el 3 és «terç» i el 4 és «quart».'],
  ['A partir d\'11: onzens, dotzens, tretzens... fins a vintens!','Compte: nou → novè, i dinou → dinovè.','Disset → dissetens, divuit → divuitens.'],
  ['Compostos amb guionet: vint-i-cinquens, trenta-dosens.','Les desenes: trentens, quarantens, cinquantens...','El 100 és especial: centèsims.']];

/* =========================================================
   FIGURES: PIZZES
   ========================================================= */
function pizzaOne(d,k,cx,cy,r,inter,u){let s=`<circle cx="${cx}" cy="${cy}" r="${r+7}" class="plate"/>`;
  for(let i=0;i<d;i++){const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d,on=i<k;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const path=d===1?`<circle cx="${cx}" cy="${cy}" r="${r}" class="sl ${on?'on':''}" ${inter?`data-i="${u*d}"`:''}/>`:`<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" class="sl ${on?'on':''}" ${inter?`data-i="${u*d+i}"`:''}/>`;
    s+=path;
    if(on&&!inter){const am=(a0+a1)/2,pr=Math.max(3,Math.min(7,r*1.6/d+2));const px=cx+r*.6*Math.cos(am),py=cy+r*.6*Math.sin(am);
      s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${pr.toFixed(1)}" class="pep"/>`;
      if(d<=8){const bx=cx+r*.33*Math.cos(am+.15),by=cy+r*.33*Math.sin(am+.15);s+=`<ellipse cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" rx="4" ry="2.4" class="bas" transform="rotate(${(am*57).toFixed(0)} ${bx.toFixed(1)} ${by.toFixed(1)})"/>`;}}}
  return s;}
function pizzaSVG(d,n,inter=false,units){units=units||Math.max(1,Math.ceil(n/d));const r=64,g=26,w=units*2*(r+7)+(units-1)*g+8,h=2*(r+7)+8;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="fig ${inter?'interactive':''}" style="width:min(100%,${units*190}px)" role="img" aria-label="pizza tallada en ${d} trossos">`;
  for(let u=0;u<units;u++){const k=inter?0:Math.max(0,Math.min(d,n-u*d));s+=pizzaOne(d,k,4+r+7+u*(2*(r+7)+g),4+r+7,r,inter,u);}
  return s+'</svg>';}
const TRAY={11:[11,1],12:[4,3],13:[13,1],14:[7,2],15:[5,3],16:[4,4],17:[17,1],18:[6,3],19:[19,1],20:[5,4],24:[6,4],25:[5,5],30:[6,5],32:[8,4],40:[8,5],48:[8,6],50:[10,5],60:[10,6],64:[8,8],100:[10,10]};
function traySVG(d,n,inter=false){const [c,r]=TRAY[d],W=360,H=r===1?70:Math.min(240,Math.round(W*r/c)),cw=W/c,ch=H/r;
  let s=`<svg viewBox="0 0 ${W+14} ${H+14}" class="fig ${inter?'interactive':''}" style="width:min(100%,480px)" role="img" aria-label="safata de pizza tallada en ${d} trossos"><rect x="2" y="2" width="${W+10}" height="${H+10}" rx="8" class="plate"/>`;
  for(let i=0;i<d;i++){const cx=i%c,cy=Math.floor(i/c),x=7+cx*cw,y=7+cy*ch,on=!inter&&i<n;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" class="sl ${on?'on':''}" ${inter?`data-i="${i}"`:''}/>`;
    if(on&&cw>18&&ch>18)s+=`<circle cx="${(x+cw/2).toFixed(1)}" cy="${(y+ch/2).toFixed(1)}" r="${Math.min(cw,ch)*.22}" class="pep"/>`;}
  return s+'</svg>';}
const canPaint=d=>d<=10||!!TRAY[d];
const foodSVG=(d,n,inter=false)=>d<=10?pizzaSVG(d,n,inter):traySVG(d,n,inter);
const ticket=(html,words)=>`<span class="ticket ${words?'words':''}">${html}</span>`;

/* =========================================================
   ROBOT PIZZAIOLO FR-4C
   ========================================================= */
function robot(mood='idle',size=76){let eyes,mouth,extra='';
  if(mood==='happy'){eyes=`<path d="M31 45 q7 -9 14 0" class="rb-l"/><path d="M55 45 q7 -9 14 0" class="rb-l"/>`;mouth=`<path d="M40 60 q10 8 20 0" class="rb-l"/>`;}
  else if(mood==='oops'){eyes=`<circle cx="38" cy="44" r="4.5" class="rb-eye"/><circle cx="62" cy="44" r="4.5" class="rb-eye"/><path d="M31 35 l11 3" class="rb-l"/><path d="M69 35 l-11 3" class="rb-l"/>`;mouth=`<path d="M40 63 q5 -4 10 0 t10 0" class="rb-l"/>`;
    extra=`<g transform="translate(92 26)"><path class="rb-sweat" d="M0 0 C-5 7 -5 11 0 11 C5 11 5 7 0 0Z" fill="#59b8ff" stroke="var(--ink)" stroke-width="2"/></g>`;}
  else if(mood==='think'){eyes=`<circle cx="40" cy="41" r="5" class="rb-eye"/><circle cx="64" cy="41" r="5" class="rb-eye"/>`;mouth=`<path d="M43 62 h14" class="rb-l"/>`;
    extra=`<circle class="rb-dot" cx="98" cy="16" r="3" fill="var(--ink)"/><circle class="rb-dot d2" cx="106" cy="9" r="3.5" fill="var(--ink)"/><circle class="rb-dot d3" cx="115" cy="2" r="4" fill="var(--ink)"/>`;}
  else if(mood==='wow'){eyes=`<circle cx="38" cy="44" r="7" class="rb-eye"/><circle cx="62" cy="44" r="7" class="rb-eye"/>`;mouth=`<circle cx="50" cy="62" r="4" class="rb-l"/>`;}
  else{eyes=`<circle cx="38" cy="44" r="5.5" class="rb-eye"/><circle cx="62" cy="44" r="5.5" class="rb-eye"/>`;mouth=`<path d="M42 61 q8 4 16 0" class="rb-l"/>`;}
  if(mood==='happy'||mood==='wow'){const st='M0-7L2-2 7 0 2 2 0 7-2 2-7 0-2-2Z';
    extra=`<g transform="translate(2 22)"><path class="rb-spark" d="${st}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></g><g transform="translate(100 18)"><path class="rb-spark s2" d="${st}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></g><g transform="translate(104 72)"><path class="rb-spark s3" d="${st}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></g>`;}
  const armR=mood==='wave'?`<path d="M72 88 L86 70" class="rb-arm"/><circle cx="87" cy="68" r="5" class="rb-hand"/>`:`<path d="M72 88 L84 100" class="rb-arm"/><circle cx="85" cy="101" r="5" class="rb-hand"/>`;
  return `<svg class="robot mood-${mood}" width="${size}" height="${size*1.2}" viewBox="-10 -24 130 142" aria-hidden="true"><g class="rb-all">
  <g class="rb-armL"><path d="M28 88 L16 100" class="rb-arm"/><circle cx="15" cy="101" r="5" class="rb-hand"/></g><g class="rb-armR">${armR}</g>
  <rect x="30" y="80" width="40" height="30" rx="8" class="rb-shirt"/><line x1="32" y1="89" x2="68" y2="89" class="rb-stripe"/><line x1="31" y1="97" x2="69" y2="97" class="rb-stripe"/><line x1="32" y1="105" x2="68" y2="105" class="rb-stripe"/>
  <path d="M38 79 L62 79 L50 92 Z" class="rb-scarf"/>
  <g class="rb-headg"><rect x="6" y="36" width="10" height="20" rx="4" class="rb-head"/><rect x="84" y="36" width="10" height="20" rx="4" class="rb-head"/>
  <rect x="14" y="20" width="72" height="58" rx="16" class="rb-head"/><rect x="22" y="28" width="56" height="42" rx="10" class="rb-screen"/>
  <g class="rb-eyes">${eyes}</g><path d="M36 55 q7 -6 14 0 q7 -6 14 0 q-7 4 -14 0 q-7 4 -14 0z" class="rb-mus"/><g class="rb-mouth">${mouth}</g>
  <path d="M24 22 L76 22 L76 12 C88 10 88 -12 72 -10 C70 -22 54 -24 50 -14 C46 -24 30 -22 28 -10 C12 -12 12 10 24 12 Z" class="rb-hat"/>
  <rect x="24" y="14" width="17.3" height="6" fill="#2e9d4a"/><rect x="41.3" y="14" width="17.4" height="6" fill="#fff"/><rect x="58.7" y="14" width="17.3" height="6" fill="#d7392b"/></g>
  ${extra}</g></svg>`;}
function botSay(mood,text,size=76,cls=''){return `<div class="bot ${cls}"><div class="bot-av">${robot(mood,size)}</div><div class="say"><b class="who">FR-4C · pizzaiolo</b><span class="txt">${text}</span></div></div>`;}
const RM=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function typeAll(root){if(RM())return;root.querySelectorAll('.say .txt:not([data-typed])').forEach(el=>{el.dataset.typed='1';
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];let n;while((n=w.nextNode()))nodes.push([n,n.nodeValue]);
  const total=nodes.reduce((a,[,t])=>a+t.length,0);if(!total)return;nodes.forEach(([nd])=>nd.nodeValue='');
  const rb=el.closest('.bot')&&el.closest('.bot').querySelector('.robot');if(rb)rb.classList.add('talking');
  const step=Math.max(1,Math.ceil(total/65));let shown=0;
  const iv=setInterval(()=>{shown+=step;let left=shown;for(const [nd,t] of nodes){nd.nodeValue=t.slice(0,Math.max(0,Math.min(t.length,left)));left-=t.length;}
    if(shown>=total){clearInterval(iv);if(rb)rb.classList.remove('talking');}},18);});}

/* façana de la pizzeria (portada) */
function facadeSVG(){let aw='';for(let i=0;i<20;i++)aw+=`<path d="M${i*32},0 h32 v42 a16 16 0 0 1 -32 0z" fill="${i%2?'#fff':'#ff6a00'}" stroke="#000" stroke-width="3"/>`;
  return `<svg viewBox="0 0 640 300" class="facade" role="img" aria-label="Façana de la Pizzeria Tres Quarts">
  <rect width="640" height="300" fill="#f3efe6"/><rect y="250" width="640" height="50" fill="#d9d2c3"/>
  <rect x="20" y="70" width="600" height="185" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect x="110" y="8" width="420" height="50" rx="8" fill="#000"/><text x="320" y="44" text-anchor="middle" font-family="Bricolage Grotesque,Arial Black,sans-serif" font-weight="800" font-size="30" fill="#ff6a00" letter-spacing="2">PIZZERIA TRES QUARTS</text>
  <g transform="translate(0,58)">${aw}</g>
  <rect x="44" y="118" width="210" height="120" fill="#cfe8ff" stroke="#000" stroke-width="4"/>
  <g transform="translate(149,178)"><circle r="46" fill="#efefef" stroke="#000" stroke-width="3"/><path d="M0,0 L0,-40 A40,40 0 1 1 -40,0 Z" fill="#ffc94a" stroke="#b8651f" stroke-width="3"/>
  <circle cx="14" cy="-18" r="6" fill="#d7392b"/><circle cx="18" cy="16" r="6" fill="#d7392b"/><circle cx="-16" cy="18" r="6" fill="#d7392b"/><ellipse cx="4" cy="4" rx="5" ry="3" fill="#2e9d4a"/>

function mcOf(n,d,L){const c=nameF(n,d),opts=shuffle([c,...wrongNames(n,d,L)]);return {opts,correct:opts.indexOf(c)};}
function qPairs(L){const set=new Set(),fr=[];const same=Math.random()<.5;let dd=null;
  while(fr.length<4){let [n,d]=genFrac(L,{proper:true});if(same&&L<2){dd=dd||d;d=dd;n=rnd(1,d-1);if(d-1<4){dd=null;}}const k=n+'/'+d;if(set.has(k))continue;set.add(k);fr.push([n,d]);if(set.size>60)break;}
  return {kind:'pairs',items:fr,left:shuffle(fr.map((_,i)=>i)),right:shuffle(fr.map((_,i)=>i)),prompt:'Uneix cada <b>fracció</b> amb el seu <b>tiquet</b>. Toca una fracció i després el tiquet que li correspon.',
    explain:fr.map(([n,d])=>`${F(n,d)} → <b class="nm">«${nameF(n,d)}»</b>`).join('<br>')};}
function qClient(L){const [n,d]=genFrac(L,{proper:true});const {opts,correct}=mcOf(n,d,L);
  const vis=(d<=10||(TRAY[d]&&d<=20)||d===100)?foodSVG(d,n):ticket(F(n,d));
  return {kind:'mc',n,d,options:opts,correct,visual:vis,prompt:d<=10||TRAY[d]&&d<=20||d===100?'El client assenyala aquests trossos. <b>Quin tiquet és el correcte?</b>':'Aquesta és la comanda. <b>Com s\'escriu el tiquet?</b>',
    hint:`Primer el numerador (${card(n)}), després el nom del ${d}${n>1?' en plural':''}.`,explain:explainName(n,d)};}
function qPhone(L){const [n,d]=genFrac(L);return {kind:'listen',n,d,ans:[n,d],say:`Hola! Voldria ${nameF(n,d)} de pizza, si us plau.`,
  prompt:'☎️ Ring, ring! Un client truca per fer una comanda. <b>Escolta-la i escriu la fracció en xifres.</b>',hint:'La primera paraula és el numerador (dalt). La segona és el denominador (baix).',explain:explainName(n,d)};}
function qPrepare(L){const [n,d]=genFrac(L,{proper:Math.random()<.5});
  if(n<d&&n<=12&&canPaint(d)&&Math.random()<.5)return {kind:'paint',n,d,target:n,visual:ticket(nameF(n,d),true),prompt:'Llegeix el tiquet i <b>posa a la pizza els trossos</b> que demana (toca els trossos).',hint:`El nom del denominador et diu en quants trossos està tallada (${d}). El numerador, quants n'has de posar.`,explain:explainName(n,d)};

function qWrite(L){const [n,d]=genFrac(L);return {kind:'words',n,d,visual:ticket(F(n,d)),prompt:'<b>Escriu el tiquet en lletres</b> perquè la cuina entengui la comanda.',
  hint:`Comença pel numerador: «${card(n)}».`,explain:explainName(n,d)};}

let AC=null,MASTER=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-8;comp.ratio.value=4;comp.connect(AC.destination);MASTER=AC.createGain();MASTER.gain.value=1;MASTER.connect(comp);}
  if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,t0,dur,type='triangle',vol=.18){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MASTER);o.start(t);o.stop(t+dur+.05);}
const SFX={
  ok(){tone(784,0,.14,'triangle',.45);tone(1175,.12,.28,'triangle',.45);tone(1568,.12,.28,'sine',.15);},
  err(){tone(415,0,.22,'square',.32);tone(415,0,.22,'triangle',.55);tone(311,.26,.45,'square',.32);tone(311,.26,.45,'triangle',.55);},
  tap(){tone(660,0,.05,'square',.04);},
  cash(){tone(1318,0,.08,'square',.12);tone(1760,.08,.25,'triangle',.3);},
  ring(){for(let i=0;i<4;i++){tone(880,i*.18,.08,'square',.12);tone(1100,i*.18+.08,.08,'square',.12);}},
  angry(){tone(220,0,.3,'sawtooth',.18);tone(165,.28,.4,'sawtooth',.18);},
  stage(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.18,'triangle',.3));},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.22,'triangle',.3));}};
function sfx(n){if(S&&S.mute)return;try{SFX[n]();}catch(e){}}

let VOICE=null;
function pickVoice(){try{const vs=window.speechSynthesis.getVoices();VOICE=vs.find(v=>/^ca([-_]|$)/i.test(v.lang))||null;}catch(e){VOICE=null;}}
if(typeof window!=='undefined'&&'speechSynthesis' in window){pickVoice();try{window.speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function speak(text){if(!('speechSynthesis' in window)||!VOICE)return false;try{const u=new SpeechSynthesisUtterance(text);u.voice=VOICE;u.lang=VOICE.lang;u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);return true;}catch(e){return false;}}

function confetti(n=170){const c=$('#confetti');let x=null;try{x=c.getContext('2d');}catch(e){}if(!x||RM())return;c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff6a00','#ffc94a','#000000','#d7392b','#2e9d4a'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:5+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.3,col:pick(cols)}));
  let t=0;cancelAnimationFrame(confetti.raf);
  (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<280)confetti.raf=requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

const B32='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',CSB=13,CSM=(1<<CSB)-1;
function makeCode(){const secs=Math.round(((S.end||Date.now())-S.start)/1000);let n=0n;
  const put=(v,b)=>{n=(n<<BigInt(b))|BigInt(Math.max(0,Math.min(Math.round(v)||0,2**b-1)));};
  put(1,2);put(S.won?1:0,1);put(S.free?1:0,1);put(S.score,13);put(secs,15);put(S.angry,7);put(S.best,6);put(S.ok,8);
  S.stages.forEach(s=>put(s.done?1:0,1));S.lstars.forEach(v=>put(v,2));S.terr.forEach(v=>put(v,5));
  n=(n<<BigInt(CSB))|BigInt(h32('pz34|'+normTeam(S.team)+'|'+n.toString())&CSM);
  let s='';for(let i=0;i<24;i++){s=B32[Number(n&31n)]+s;n>>=5n;}return s.match(/.{4}/g).join('-');}
function readCode(name,code){const c=String(code).toUpperCase().replace(/[^0-9A-Z]/g,'');if(c.length!==24)return null;
  let n=0n;for(const ch of c){const i=B32.indexOf(ch);if(i<0)return null;n=(n<<5n)|BigInt(i);}
  const cs=Number(n&BigInt(CSM));n>>=BigInt(CSB);if(cs!==(h32('pz34|'+normTeam(name)+'|'+n.toString())&CSM))return null;
  const take=b=>{const v=Number(n&BigInt(2**b-1));n>>=BigInt(b);return v;};
  const terr=[],lstars=[],done=[];for(let i=5;i>=0;i--)terr[i]=take(5);for(let i=2;i>=0;i--)lstars[i]=take(2);for(let i=NS-1;i>=0;i--)done[i]=take(1)===1;
  const ok=take(8),best=take(6),angry=take(7),secs=take(15),score=take(13),free=take(1),won=take(1),ver=take(2);
  if(n!==0n||ver!==1)return null;
  return {won:!!won,free:!!free,score,secs,angry,best,ok,done,lstars,terr,errors:terr.reduce((a,b)=>a+b,0),nd:done.filter(Boolean).length};}
function stateFromCode(name,pin,v){const s=newState(name,pin,v.free);s.stages.forEach((st,i)=>st.done=v.done[i]);
  Object.assign(s,{lstars:v.lstars,terr:v.terr,score:v.score,best:v.best,ok:v.ok,errors:v.errors,angry:v.angry,won:v.won,start:Date.now()-v.secs*1000});if(v.won)s.end=Date.now();return s;}

function nextQ(){const s=cur.s;let type=s;if(s===5)type=pick([1,2,3,4,4,3]);cur.type=type;cur.q=GEN[type](cur.L);cur.tries=0;cur.answered=false;cur.hint=false;cur.sel=null;cur.qStart=Date.now();cur.textShown=false;renderQ();}

  <h2>${St.icon} ${St.name}</h2><div class="progress">${orders(cur.served,N)}${cur.s>0?angryHTML(cur.angry):''}</div>${cartaHTML(cur.L)}`;}
function renderQ(){const q=cur.q;let inner='';const sub='<button class="btn primary" data-act="submit">Servir 🍕</button>';
  if(q.kind==='pairs'){inner=`<div class="pairs"><div class="pcol">${q.left.map(i=>`<button class="pc frc" data-act="pl" data-i="${i}">${F(...q.items[i])}</button>`).join('')}</div><div class="pcol">${q.right.map(i=>`<button class="pc nm" data-act="pr" data-i="${i}">${nameF(...q.items[i])}</button>`).join('')}</div></div>`;cur.pairsLeft=4;cur.pairErr=0;cur.selL=null;cur.selR=null;}
  else if(q.kind==='mc')inner=`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-act="mc" data-i="${k}">${o}</button>`).join('')}</div>`;
  else if(q.kind==='frac'||q.kind==='listen')inner=`${q.kind==='listen'?phoneHTML():''}<div class="ansrow"><div class="fracin"><input id="an" inputmode="numeric" autocomplete="off" aria-label="Numerador"><span class="fbar"></span><input id="ad" inputmode="numeric" autocomplete="off" aria-label="Denominador"></div>${sub}</div>`;
  else if(q.kind==='words')inner=`<div class="ansrow" style="flex-direction:column"><input id="ww" class="wordin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escriu el nom en lletres" placeholder="Escriu aquí en lletres..."><div class="keys">${['è','ç','à','-'].map(c=>`<button class="key" data-act="ins" data-c="${c}">${c}</button>`).join('')}</div>${sub}</div>`;
  else if(q.kind==='paint')inner=`<div class="visual">${foodSVG(q.d,0,true)}</div><div class="counter" id="cnt">Trossos posats: 0</div><div class="ansrow">${sub}</div>`;
  const tip=pick(TIPS[cur.L]);
  show(`<section class="room">${stageHead()}
  <article class="qcard"><div class="qnum">${STAGES[cur.s].desc} · ${cur.s===0?'Tauler':'Comanda'} ${Math.min(cur.served+1,STAGES[cur.s].count)} de ${STAGES[cur.s].count}</div>
  ${cur.s===5?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div><div class="legend">Serveix-la abans que s\'acabi la barra i guanyes propina ràpida ⚡</div>':''}
  ${botSay(Math.random()<.5?'idle':'think',tip,50,'small')}
  <div class="prompt">${q.prompt}</div>${q.visual?`<div class="visual">${q.visual}</div>`:''}${inner}
  <div id="hintBox"></div><div class="tools">${q.kind!=='pairs'?'<button class="btn small ghost" data-act="hint" id="hintBtn">💡 Pista (−3)</button>':''}</div><div id="fb"></div></article></section>`);
  if(q.kind==='listen'){sfx('ring');setTimeout(()=>playOrder(true),650);}
  if(cur.s===5)startTimer();
  const f=$('#ww')||$('#an');if(f&&window.matchMedia&&matchMedia('(pointer:fine)').matches)f.focus();}
function phoneHTML(){return `<div class="phone ringing" id="phone"><div class="ring">☎️</div><div class="row center" style="margin:0"><button class="btn primary" data-act="listen">🔊 Escolta la comanda</button><button class="btn small ghost" data-act="showtext">📝 No ho sento: mostra-la escrita (−3)</button></div><div id="written" class="written"></div></div>`;}
function playOrder(auto){const wEl=$('#written');if(!cur||!cur.q||cur.q.kind!=='listen'||!wEl)return;const ok=speak(cur.q.say);if(!ok&&!cur.textShown){cur.textShown=true;wEl.innerHTML=`<span class="muted" style="font-size:1rem;font-weight:400">Aquest dispositiu no té veu en català. Aquí tens la comanda escrita:</span><br>«${esc(cur.q.say)}»`;}}
let TMR=null;const TLIM=25000;
function startTimer(){clearInterval(TMR);TMR=setInterval(()=>{const b=$('#tbar');if(!b||!cur||cur.answered){clearInterval(TMR);return;}const f=Math.max(0,1-(Date.now()-cur.qStart)/TLIM);b.style.transform=`scaleX(${f})`;},250);}

function flash(msg){$('#fb').innerHTML=`<div class="fb warn">${msg}</div>`;}
const isInt=v=>/^\d+$/.test(v);
const PRAISE=['<i>Perfetto!</i> Comanda servida.','<i>Bravissimo!</i> El client està content.','Molt bé! Aquí tens la propina.','<i>Che buono!</i> Ho has clavat.','Comanda perfecta! 🍕'];
const RETRY=['<i>Mamma mia!</i> Aquesta no és la comanda. Torna-hi!','Ui, el client diu que no és això. Prova-ho una altra vegada!','Gairebé! Revisa-ho amb calma.'];
const ANGRY=['<i>Mamma mia!</i> El client s\'ha enfadat. Mira com es diu:','Ai, ai... client enfadat. Fixa-t\'hi bé:'];
function evaluate(q,ans){
  if(q.kind==='mc')return {ok:ans===q.correct};
  if(q.kind==='words')return checkWords(q.n,q.d,ans);
  if(q.kind==='paint')return {ok:ans===q.target,msg:ans===q.target?'':`Has posat ${ans} trossos.`};
  const [x,y]=ans,[n,d]=q.ans;return {ok:x===n&&y===d,msg:x===n&&y===d?'':`La teva resposta: ${F(x,y)}`};}
function submit(val){if(!cur||cur.answered)return;const q=cur.q;let ans;
  if(q.kind==='mc')ans=val;
  else if(q.kind==='frac'||q.kind==='listen'){const a=$('#an').value.trim(),b=$('#ad').value.trim();if(!isInt(a)||!isInt(b)){flash('Escriu el numerador (dalt) i el denominador (baix).');return;}if(+b===0){flash('El denominador no pot ser 0!');return;}ans=[+a,+b];}
  else if(q.kind==='words'){const a=$('#ww').value.trim();if(!a){flash('Escriu el tiquet en lletres.');return;}if(/\d/.test(a)){flash('Ho has d\'escriure amb <b>lletres</b>, no amb xifres. 😉');return;}ans=a;}
  else if(q.kind==='paint'){ans=app.querySelectorAll('.qcard .interactive .sl.on').length;if(!ans){flash('Toca els trossos per posar-los a la pizza.');return;}}
  const res=evaluate(q,ans);const T=cur.s===5?5:cur.type;
  if(!res.ok&&!cur.tries){cur.tries=1;S.errors++;S.terr[T]=Math.min(31,S.terr[T]+1);S.stages[cur.g].err++;cur.err++;S.streak=0;save();updateHeader();sfx('err');
    if(q.kind==='mc'){const o=app.querySelectorAll('.opt')[val];o.classList.add('wrong');o.disabled=true;}
    $('#fb').innerHTML=`<div class="fb bad">${botSay('oops',pick(RETRY),60,'small')}${res.msg?`<p>${res.msg}</p>`:''}<p><b>Segon intent!</b> Si ara l'encertes, guanyes <b>+5</b>.</p></div>`;
    $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  cur.answered=true;clearInterval(TMR);
  app.querySelectorAll('.qcard input,.qcard .opt,.qcard .key,[data-act="submit"],#hintBtn,[data-act="listen"],[data-act="showtext"]').forEach(e=>e.disabled=true);
  app.querySelectorAll('.qcard .interactive').forEach(e=>e.classList.remove('interactive'));
  if(q.kind==='mc'){const o=app.querySelectorAll('.opt');o[q.correct].classList.add('right');if(!res.ok)o[val].classList.add('wrong');}
  let pts=0,fast=false,angryNow=false;
  if(res.ok){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak);pts=cur.tries?5:10+(S.streak>=3?5:0);if(cur.s===5&&!cur.tries&&Date.now()-cur.qStart<TLIM){pts+=5;fast=true;}S.score+=pts;sfx('cash');}
  else{S.errors++;S.terr[T]=Math.min(31,S.terr[T]+1);S.stages[cur.g].err++;cur.err++;S.streak=0;S.angry++;cur.angry++;angryNow=true;sfx('angry');}
  cur.served++;const N=STAGES[cur.s].count,failed=cur.angry>=3,fin=!failed&&cur.served>=N;
  save();updateHeader();
  const say=res.ok?`${cur.tries?'Ara sí! Bona rectificació.':pick(PRAISE)} <span class="pts">+${pts} 💶${fast?' ⚡':''}${pts>=15&&!fast?' 🔥':''}</span>`:pick(ANGRY);
  const btn=failed?'<button class="btn primary" data-act="failed">Continuar</button>':fin?'<button class="btn primary" data-act="stagedone">Tancar el torn 🎉</button>':'<button class="btn primary" data-act="next">Següent comanda</button>';
  $('#fb').innerHTML=`<div class="fb ${res.ok?'ok':'bad'}">${botSay(res.ok?'happy':'oops',say,60,'small')}${res.msg?`<p>${res.msg}</p>`:''}<div class="exp">${q.explain}</div>${btn}</div>`;
  const pr=app.querySelector('.progress');if(pr)pr.innerHTML=orders(cur.served,N)+angryHTML(cur.angry);
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});}
function useHint(){if(!cur||cur.hint||cur.answered)return;cur.hint=true;S.score=Math.max(0,S.score-3);save();updateHeader();
  $('#hintBox').innerHTML=`<div class="fb warn">💡 ${cur.q.hint}</div>`;$('#hintBtn').disabled=true;}
function pairClick(side,i,btn){if(!cur||cur.answered||btn.classList.contains('matched'))return;sfx('tap');
  if(side==='l'){app.querySelectorAll('.pc.frc.sel').forEach(e=>e.classList.remove('sel'));cur.selL=i;}else{app.querySelectorAll('.pc.nm.sel').forEach(e=>e.classList.remove('sel'));cur.selR=i;}
  btn.classList.add('sel');
  if(cur.selL!=null&&cur.selR!=null){const l=app.querySelector(`.pc.frc[data-i="${cur.selL}"]`),r=app.querySelector(`.pc.nm[data-i="${cur.selR}"]`);
    if(cur.selL===cur.selR){[l,r].forEach(e=>{e.classList.remove('sel');e.classList.add('matched');e.disabled=true;});cur.pairsLeft--;sfx('ok');
      if(cur.pairsLeft===0)pairsDone();}
    else{[l,r].forEach(e=>{e.classList.remove('sel');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');});cur.pairErr++;S.errors++;S.terr[0]=Math.min(31,S.terr[0]+1);S.stages[cur.g].err++;cur.err++;S.streak=0;sfx('err');
      $('#fb').innerHTML=`<div class="fb bad">${botSay('oops',`<i>Mamma mia!</i> Aquest tiquet no és el d'aquesta fracció. Llegeix-lo bé!`,50,'small')}</div>`;save();updateHeader();}
    cur.selL=null;cur.selR=null;}}
function pairsDone(){cur.answered=true;const pts=Math.max(4,12-3*cur.pairErr);S.ok+=4;S.score+=pts;if(cur.pairErr===0){S.streak++;S.best=Math.max(S.best,S.streak);}cur.served++;
  const N=STAGES[0].count,fin=cur.served>=N;save();updateHeader();sfx('cash');
  $('#fb').innerHTML=`<div class="fb ok">${botSay('happy',`${cur.pairErr===0?'<i>Perfetto!</i> Tots els tiquets al seu lloc.':'Tiquets col·locats!'} <span class="pts">+${pts} 💶</span>`,60,'small')}<div class="exp">${cur.q.explain}</div>${fin?'<button class="btn primary" data-act="stagedone">Tancar el torn 🎉</button>':'<button class="btn primary" data-act="next">Següent tauler</button>'}</div>`;
  const pr=app.querySelector('.progress');if(pr)pr.innerHTML=orders(cur.served,N);$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});}

function stageFailed(){show(`<section class="reveal">${botSay('oops','<i>Mamma mia!</i> Tres clients enfadats... Tanquem un moment, repassem la carta i tornem a obrir. Tu pots!',80)}
  <div style="max-width:720px;margin:0 auto;text-align:left">${cartaHTML(cur.L).replace('<details class="carta">','<details class="carta" open>')}</div>
  <div class="row center"><button class="btn primary big" data-act="retry">Tornar a començar el torn</button><button class="btn" data-act="map">Mapa</button></div></section>`);}
function stageDone(){const g=cur.g,L=cur.L,s=cur.s;const first=!S.stages[g].done;S.stages[g].done=true;let extra='';
  if(s===5){const e=S.stages.slice(gIdx(L,0),gIdx(L,6)).reduce((a,st)=>a+st.err,0),stars=e<=3?3:e<=8?2:1;S.lstars[L]=Math.max(S.lstars[L],stars);
    extra=`<div class="bigstars">${starsTxt(stars)}</div><p>Ressenya dels clients de <b>${LEVELS[L].name}</b></p>`;}
  const allDone=S.stages.every(st=>st.done);if(allDone&&!S.won){S.won=true;S.end=S.end||Date.now();}
  save();updateHeader();
  if(allDone&&first&&s===5){renderDiploma(true);return;}
  const nextG=g+1<NS&&unlockedG(g+1)?g+1:null;
  show(`<section class="reveal"><h2>${s===5?`${LEVELS[L].name}: superat!`:'Torn acabat!'}</h2>${extra}
  ${botSay(s===5?'wow':'happy',s===5&&L<2?`Increïble! La pizzeria creix: ara obrim <b>${LEVELS[L+1].name}</b>! 🎉`:pick(['<i>Grazie mille!</i> Els clients han marxat contents.','Quin torn més bo! 🍕','<i>Bravo!</i> Cuina neta i clients feliços.']),80)}
  <div class="row center">${nextG!=null?`<button class="btn primary big" data-act="stage" data-g="${nextG}">Següent torn: ${STAGES[nextG%6].icon} ${STAGES[nextG%6].name}</button>`:''}<button class="btn" data-act="map">Mapa</button></div></section>`);
  sfx('stage');confetti(s===5?160:70);}
function renderDiploma(celebrate){const tot=S.lstars.reduce((a,b)=>a+b,0);
  show(`<section class="reveal"><div class="diploma"><div style="font-size:2.4rem">🎓🍕</div><h3>Diploma de pizzaiolo de les fraccions</h3>
  <p>La Pizzeria Tres Quarts certifica que</p><p style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2rem;margin:.2rem 0">${esc(S.team)}</p>
  <p>sap escriure les fraccions en català fins al 100.</p><div class="bigstars">${'⭐'.repeat(tot)}</div><p class="muted" style="color:#555">Signat: FR-4C, pizzaiolo en cap · Matemàtiques · Ins Júlia Minguell, Badalona</p></div>
  <div class="statgrid"><div>Propines<b>${S.score} 💶</b></div><div>Temps<b>${fmt((S.end||Date.now())-S.start)}</b></div><div>Encerts<b>${S.ok}</b></div><div>Errors<b>${S.errors}</b></div><div>Clients enfadats<b>${S.angry}</b></div><div>Millor ratxa<b>🔥 ${S.best}</b></div></div>
  <div class="codepanel">Codi de progrés per al professor<br><span class="codebox">${makeCode()}</span></div>
  <div class="row center"><button class="btn primary" data-act="map">Mapa</button><button class="btn" data-act="logout">Sortir</button></div></section>`);
  if(celebrate){sfx('win');confetti(240);}}

/* ---------- tauler del professor ---------- */
const TNAMES=STAGES.map(s=>s.icon+' '+s.name);
function sortRes(R){return R.sort((a,b)=>(b.won-a.won)||(b.nd-a.nd)||(b.score-a.score)||(a.secs-b.secs));}
const heat=e=>`<span class="heat h${e===0?0:e<=3?1:e<=7?2:3}">${e>=31?'31+':e}</span>`;
function where(r){if(r.won)return '🎓 Diploma';const g=r.done.findIndex(x=>!x);if(g<0)return '—';return `${LEVELS[Math.floor(g/6)].icon} ${STAGES[g%6].icon} ${STAGES[g%6].name}`;}
function renderTeacher(msg=''){if(S)save();S=null;cur=null;const R=sortRes(loadRes());const tot=[0,1,2,3,4,5].map(k=>R.reduce((a,r)=>a+r.terr[k],0)),maxT=Math.max(0,...tot);
  show(`<section class="room"><div class="rhead"><button class="btn small" data-act="home2">← Inici</button></div><h2>Tauler del professor</h2>
  <p class="muted">Cada alumne et dona el seu nom i el <b>codi de progrés</b>. El codi va lligat al nom. Els resultats es desen només en aquest dispositiu.</p>
  <details class="box"><summary>⚙️ Opcions del professor</summary><div>
    <label class="check"><input type="checkbox" id="tfree" data-act="togglefree" ${getFree()?'checked':''}> <span><b>Mode lliure en aquest dispositiu:</b> tots els torns oberts des del principi.</span></label>
    <p class="muted" style="font-size:.95rem;margin:.5rem 0 0">S'aplica als alumnes que entrin en aquest ordinador o tauleta mentre estigui activat. Si el desactives, ningú perd el progrés.</p></div></details>
  <div class="tform"><label>Nom de l'alumne<input id="tteam" autocomplete="off" placeholder="Com l'ha escrit l'alumne"></label><label>Codi de progrés<input id="tcode" autocomplete="off" placeholder="XXXX-XXXX-..." maxlength="40"></label><button class="btn primary" data-act="addres">Afegir</button></div>
  <details class="box"><summary>📋 Afegir-ne molts de cop (enganxar una llista)</summary><div>
    <p style="margin-top:0">Una línia per alumne, amb el nom i el codi (per exemple, copiat d'un formulari del Classroom):</p>
    <textarea class="bulk" id="bulk" placeholder="Salma	7K2M-QX9P-...&#10;Andrei; 4HT8-..."></textarea>
    <div class="row"><button class="btn primary small" data-act="bulkadd">Afegir la llista</button></div></div></details>
  <div id="tmsg">${msg}</div>
  ${R.length?`<div class="twrap"><table class="res"><thead><tr><th>#</th><th>Alumne</th><th>On és</th><th>Torns</th><th>⭐ Barri</th><th>⭐ Trattoria</th><th>⭐ Festival</th><th>Propines</th><th>Temps</th><th>Errors</th><th>😠</th>${STAGES.map(s=>`<th title="${esc(s.name)}">${s.icon}</th>`).join('')}<th>S'encalla a</th><th></th></tr></thead><tbody>
  ${R.map((r,i)=>{const mx=Math.max(...r.terr),w=mx>0?r.terr.indexOf(mx):-1;
    return `<tr><td>${i+1}</td><td><b>${esc(r.team)}</b></td><td>${where(r)}</td><td>${r.nd}/${NS}</td>${r.lstars.map(v=>`<td>${v?'⭐'.repeat(v):'—'}</td>`).join('')}<td>${r.score}</td><td>${fmt(r.secs*1000)}</td><td>${r.errors}</td><td>${r.angry}</td>${r.terr.map(e=>`<td>${heat(e)}</td>`).join('')}<td>${w>=0?esc(TNAMES[w]):'—'}</td><td><button class="rm" data-act="delres" data-k="${esc(r.key)}" aria-label="Esborrar">✕</button></td></tr>`;}).join('')}
  </tbody><tfoot><tr><td></td><td>Total classe</td><td colspan="9">${maxT>0?`Tipus d'exercici amb més errors: <b>${esc(TNAMES[tot.indexOf(maxT)])}</b>`:''}</td>${tot.map(t=>`<td>${t}</td>`).join('')}<td colspan="2"></td></tr></tfoot></table></div>
  <p class="legend">Columnes 🎫 🙋 ☎️ 👨‍🍳 ✍️ ⏱️: errors a cada tipus d'exercici (tiquets, triar el nom, escoltar, del nom a la fracció, escriure el nom, hora punta). Com més taronja, més errors.</p>
  <div class="row"><button class="btn primary" data-act="xlsx">⬇️ Exportar a Excel</button><button class="btn small" data-act="copyres">📋 Copiar la taula</button><button class="btn small ghost" data-act="clearres">Esborrar-ho tot</button></div><div id="csvArea"></div>`
  :`<div class="codepanel">Encara no hi ha cap alumne. Afegeix el primer amb el formulari de dalt.</div>`}</section>`);}
function upsertRes(team,v){const key=normTeam(team),R=loadRes(),old=R.findIndex(r=>r.key===key);const row=Object.assign({key,team,at:Date.now()},v);if(old>=0)R[old]=row;else R.push(row);saveRes(R);return old>=0;}
function addRes(){const team=$('#tteam').value.trim().replace(/\s+/g,' '),code=$('#tcode').value.trim();
  if(!team||!code){$('#tmsg').innerHTML='<div class="fb warn">Cal el nom i el codi de progrés.</div>';return;}
  const v=readCode(team,code);if(!v){$('#tmsg').innerHTML='<div class="fb bad" style="padding:.6rem 1rem">Codi no vàlid per a aquest nom. Comprova el codi i que el nom sigui el mateix que va escriure l\'alumne (majúscules i accents no importen).</div>';return;}
  const was=upsertRes(team,v);renderTeacher(`<div class="fb ok" style="padding:.6rem 1rem">✅ ${esc(team)}: ${v.won?'té el diploma!':v.nd+' de '+NS+' torns'} · ${v.score} 💶${was?' (resultat anterior actualitzat)':''}</div>`);}
const CODE_RE=/([2-9A-HJ-NP-Z]{4}(?:-?[2-9A-HJ-NP-Z]{4}){5})["'\s]*$/i;
function bulkAdd(){const lines=$('#bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let ok=0;const bad=[];
  lines.forEach(l=>{const m=l.match(CODE_RE);if(!m){bad.push(l);return;}const name=l.slice(0,m.index).replace(/[\t,;|"]+/g,' ').replace(/\s+/g,' ').trim();const v=name&&readCode(name,m[1]);if(!v){bad.push(l);return;}upsertRes(name,v);ok++;});
  renderTeacher(`<div class="fb ${bad.length?'warn':'ok'}" style="padding:.6rem 1rem">✅ Afegits o actualitzats: <b>${ok}</b>.${bad.length?`<br>No s'han pogut llegir (${bad.length}):<br>${bad.map(esc).join('<br>')}`:''}</div>`);}
function resRows(R){return R.map((r,i)=>{const o={'Posició':i+1,'Alumne':r.team,'On és':where(r).replace(/[^\p{L}\p{N}\s'·:-]/gu,'').trim(),'Torns fets':r.nd,'Estrelles barri':r.lstars[0],'Estrelles trattoria':r.lstars[1],'Estrelles festival':r.lstars[2],'Propines':r.score,'Temps (min)':+(r.secs/60).toFixed(1),'Encerts':r.ok,'Errors':r.errors,'Clients enfadats':r.angry,'Millor ratxa':r.best};
  STAGES.forEach((s,k)=>{o[`Errors: ${s.name}`]=r.terr[k];});const mx=Math.max(...r.terr);o["S'encalla a"]=mx>0?STAGES[r.terr.indexOf(mx)].name:'';o['Codi afegit el']=new Date(r.at).toLocaleString('ca-ES');return o;});}
function tmsg2(html){$('#csvArea').innerHTML=`<div class="fb warn" style="margin-top:.8rem">${html}</div>`;}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej();s.onerror=rej;document.head.appendChild(s);});}
async function exportXlsx(){const R=sortRes(loadRes());if(!R.length)return;tmsg2('Preparant el fitxer d\'Excel...');
  let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(!dl){tmsg2('La descàrrega directa no està disponible en aquesta vista. Fes servir <b>«Copiar la taula»</b> i enganxa-la a Excel.');return;}
  let X;try{X=await loadXLSX();}catch(e){tmsg2('No s\'ha pogut carregar el generador d\'Excel. Pots fer servir «Copiar la taula».');return;}
  const ws=X.utils.json_to_sheet(resRows(R));ws['!cols']=Object.keys(resRows(R)[0]).map(k=>({wch:Math.max(9,Math.min(30,k.length+2))}));
  const sum=STAGES.map((s,k)=>{const e=R.reduce((a,r)=>a+r.terr[k],0);return {"Tipus d'exercici":s.name,'Què fa l\'alumne':s.desc,'Errors totals':e,"Mitjana d'errors per alumne":+(e/R.length).toFixed(2)};});
  const ws2=X.utils.json_to_sheet(sum);ws2['!cols']=[{wch:24},{wch:36},{wch:13},{wch:26}];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Alumnes');X.utils.book_append_sheet(wb,ws2,'Per tipus');
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});const dt=new Date().toISOString().slice(0,10);
  try{await dl.save({filename:`Pizzeria_Tres_Quarts_resultats_${dt}.xlsx`,data:new Blob([buf])});$('#csvArea').innerHTML='<div class="fb ok" style="padding:.6rem 1rem;margin-top:.8rem">✅ Fitxer d\'Excel preparat. Mira a la carpeta de descàrregues.</div>';}
  catch(e){const c=e&&e.code;tmsg2(c==='declined'?'Descàrrega cancel·lada.':c==='rate_limited'?'Ja hi ha una descàrrega oberta. Espera un moment.':'No s\'ha pogut descarregar en aquesta vista. Fes servir <b>«Copiar la taula»</b>.');}}
function copyRes(){const rows=resRows(sortRes(loadRes()));if(!rows.length)return;const keys=Object.keys(rows[0]);const txt=[keys.join('\t'),...rows.map(o=>keys.map(k=>o[k]).join('\t'))].join('\n');
  const fb=()=>{$('#csvArea').innerHTML=`<p class="muted">Selecciona el text, copia'l (Ctrl+C) i enganxa'l a Excel:</p><textarea class="csv" readonly>${esc(txt)}</textarea>`;const ta=app.querySelector('textarea.csv');ta.focus();ta.select();};
  try{navigator.clipboard.writeText(txt).then(()=>{$('#csvArea').innerHTML='<div class="fb ok" style="padding:.6rem 1rem;margin-top:.8rem">Taula copiada. Enganxa-la a Excel.</div>';},fb);}catch(e){fb();}}

/* =========================================================
   ESDEVENIMENTS
   ========================================================= */
if(app){
new MutationObserver(()=>typeAll(app)).observe(app,{childList:true,subtree:true});
document.querySelector('.top').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='mute'&&S){S.mute=!S.mute;save();updateHeader();}
  if(a==='logout'){try{speechSynthesis.cancel();}catch(_){}renderStart();}
  if(a==='home'){if(S)renderMap();else renderStart();}});
app.addEventListener('click',e=>{
  const sl=e.target.closest('.qcard .interactive .sl');
  if(sl&&cur&&!cur.answered){sl.classList.toggle('on');$('#cnt').textContent=`Trossos posats: ${app.querySelectorAll('.qcard .interactive .sl.on').length}`;sfx('tap');return;}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='login')login();
  else if(a==='showrestore'){const r=$('#restoreBox');r.hidden=!r.hidden;if(!r.hidden)$('#ucode').focus();}
  else if(a==='soundtest'){SFX.ok();setTimeout(()=>SFX.err(),700);$('#stMsg').innerHTML=botSay('happy','Has d\'haver sentit dos sons: <b>«ding-ding»</b> (encert) i <b>«oh-oh»</b> (error). Si no sents res, revisa el volum.',56,'small');}
  else if(a==='voicetest'){pickVoice();const ok=speak('Hola! Voldria tres quarts de pizza, si us plau.');
    $('#stMsg').innerHTML=botSay(ok?'happy':'think',ok?`Veu en català trobada: <b>${esc(VOICE.name)}</b>. Has d'haver sentit «tres quarts de pizza». 🍕`:'Aquest dispositiu <b>no té veu en català</b>. No passa res: les comandes per telèfon sortiran escrites. (En alguns ordinadors es pot instal·lar la veu catalana des de la configuració d\'idioma del sistema.)',56,'small');}
  else if(a==='map'){try{speechSynthesis.cancel();}catch(_){}renderMap();}
  else if(a==='stage')enterStage(+b.dataset.g);
  else if(a==='mc')submit(+b.dataset.i);
  else if(a==='submit')submit();
  else if(a==='next')nextQ();
  else if(a==='hint')useHint();
  else if(a==='pl')pairClick('l',+b.dataset.i,b);
  else if(a==='pr')pairClick('r',+b.dataset.i,b);
  else if(a==='listen')playOrder(false);
  else if(a==='showtext'){if(!cur.textShown){cur.textShown=true;S.score=Math.max(0,S.score-3);save();updateHeader();}$('#written').textContent=`«${cur.q.say}»`;}
  else if(a==='ins'){const w=$('#ww');if(w&&!w.disabled){const s=w.selectionStart??w.value.length;w.value=w.value.slice(0,s)+b.dataset.c+w.value.slice(w.selectionEnd??s);w.focus();w.setSelectionRange(s+1,s+1);}}
  else if(a==='failed')stageFailed();
  else if(a==='retry')enterStage(cur.g);
  else if(a==='stagedone')stageDone();
  else if(a==='diploma')renderDiploma(false);
  else if(a==='showcode')showCode();
  else if(a==='logout'){try{speechSynthesis.cancel();}catch(_){}renderStart();}
  else if(a==='reset'){if(confirm('Segur que vols reiniciar la teva pizzeria? Es perdrà tot el progrés.')){const n=S.team,p=S.pin;try{localStorage.removeItem(userKey(n,p));}catch(_){}S=newState(n,p,getFree());save();renderMap();}}
  else if(a==='teacher')renderTeacher();
  else if(a==='home2')renderStart();
  else if(a==='addres')addRes();
  else if(a==='bulkadd')bulkAdd();
  else if(a==='delres'){saveRes(loadRes().filter(r=>r.key!==b.dataset.k));renderTeacher();}
  else if(a==='copyres')copyRes();
  else if(a==='xlsx')exportXlsx();
  else if(a==='clearres'){if(confirm('Segur que vols esborrar tots els resultats?')){saveRes([]);renderTeacher();}}
  else if(a==='togglefree'){setFree(b.checked);$('#tmsg').innerHTML=`<div class="fb ok" style="padding:.6rem 1rem">${b.checked?'🔓 Mode lliure activat en aquest dispositiu.':'🔒 Mode lliure desactivat: els torns s\'obren per ordre.'}</div>`;}
});
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  if(t.matches('#an')&&$('#ad')&&$('#ad').value===''){e.preventDefault();$('#ad').focus();return;}
  if(t.matches('#an,#ad,#ww')){e.preventDefault();submit();}
  else if(t.matches('#uname')){e.preventDefault();$('#upin').focus();}
  else if(t.matches('#upin,#ucode')){e.preventDefault();login();}
  else if(t.matches('#tteam')){e.preventDefault();$('#tcode').focus();}
  else if(t.matches('#tcode')){e.preventDefault();addRes();}});
setInterval(()=>{if(S&&!S.end){const c=$('#clock');if(c)c.textContent=fmt(Date.now()-S.start);}},1000);
renderStart();
}
</script>
