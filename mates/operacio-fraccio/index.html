   <p style="margin:.8rem 0 0"><button class="linkbtn" data-act="teacher">🧑‍🏫 Tauler del professor</button></p>
  </div></section>`);}
function login(){const name=$('#uname').value.trim().replace(/\s+/g,' '),pin=$('#upin').value.trim(),rb=$('#restoreBox'),code=rb.hidden?'':$('#ucode').value.trim();
  const say=(m,t)=>{$('#stMsg').innerHTML=botSay(m,t,56,'small');};
  if(normTeam(name).length<2){say('oops','Escriu el teu <b>nom i cognom</b>.');return;}
  if(!/^\d{4}$/.test(pin)){say('oops','El codi personal ha de tenir <b>4 xifres</b>.');return;}
  ac();
  if(code){const v=readCode(name,code);if(!v){say('oops','Aquest codi de progrés no és vàlid per a aquest nom. Revisa\'l i escriu el nom exactament igual que la primera vegada.');sfx('err');return;}
    S=stateFromCode(name,pin,v);S.free=getFree();save();sfx('unlock');renderMap(`Hola de nou, ${firstName()}! He recuperat la teva partida.`);return;}
  const s=loadUser(name,pin);
  if(s){S=resumeTime(s);S.free=getFree();save();sfx('ok');renderMap(`Hola de nou, ${firstName()}! Continuem on ho vas deixar.`);return;}
  if(otherPinExists(name,pin)){say('think','En aquest dispositiu ja hi ha una partida amb aquest nom però amb <b>un altre codi personal</b>. Revisa el codi. Si de veritat vols començar de nou, torna a prémer «Entrar».');
    if(login.warned!==name+pin){login.warned=name+pin;return;}}
  S=newState(name,pin,getFree());save();sfx('unlock');renderMap();}

function renderMap(greet){cur=null;const done=S.rooms.filter(r=>r.done).length,N=ROOMS.length,all=done===N;
  const next=ROOMS.findIndex((r,i)=>!S.rooms[i].done&&unlocked(i));
  const msg=greet||(done===0?`Benvingut/da, <b>${firstName()}</b>! Comença per la porta 1. Cada porta que obris desprecinta la següent.`:all?'Tens totes les xifres! Ves a la porta de sortida... si recordes el codi. 😏':pick([`Portes ${done} de ${N} xifres. Endavant, ${firstName()}!`,`${done} cadenats oberts. Em comences a preocupar... 😅`,`Bona feina! Queden ${N-done} portes.`]));
  let html=`<section>${botSay(greet?'wave':all?'wow':done?'happy':'idle',msg)}${S.free?'<p class="legend">🔓 Mode lliure activat pel professor: totes les portes estan obertes.</p>':''}`;
  OBJ.forEach((O,oi)=>{html+=`<div class="obj"><div class="obj-h"><h3>${O.t}</h3><span>${O.name}</span><span class="pg">📘 ${O.pg}</span></div><div class="grid">`;
    ROOMS.forEach((R,i)=>{if(R.obj!==oi)return;const st=S.rooms[i],open=unlocked(i);
      html+=`<button class="card ${st.done?'done':''} ${open?'':'locked'} ${i===next?'current':''}" ${open?`data-act="room" data-r="${i}"`:'disabled'}>
      <div class="c-top"><span class="c-ic">${R.icon}</span>${padlock(st.done)}</div><div class="c-num">Porta ${i+1} · ${R.pg}</div>
      <div class="c-name">${R.name}</div><div class="c-sub">${R.sub}</div>
      <div class="c-st">${st.done?`Xifra <span class="digit-s">${S.digits[i]}</span>`:open?dots(st.correct):''}</div>
      ${open?'':`<div class="tape tape-x" aria-hidden="true"></div><div class="tape tape-x b" aria-hidden="true"></div>`}</button>`;});
    html+='</div></div>';});
  html+=`<div class="obj"><div class="grid"><button class="card final ${all?'':'locked'}" ${all?'data-act="final"':'disabled'}>${padlock(false)}<div><div class="c-name">Porta de sortida</div><div class="c-sub">${all?'Introdueix el codi de 9 xifres per escapar.':'Obre les 9 portes per activar-la.'}</div></div>
    ${all?'':`<div class="tape tape-x" aria-hidden="true"></div><div class="tape tape-x b" aria-hidden="true"></div>`}</button></div></div>
  <div id="codeArea"></div><div class="row end"><button class="btn small" data-act="showcode">📤 El meu codi de progrés</button><button class="btn small ghost" data-act="reset">Reiniciar la meva partida</button></div></section>`;
  show(html);}
function showCode(){$('#codeArea').innerHTML=`<div class="codepanel">Codi de progrés de <b>${esc(S.team)}</b><br><span class="codebox" style="font-size:clamp(1.1rem,4.6vw,1.9rem)">${makeCode()}</span>
  <p class="muted" style="margin:.3rem 0 0">Apunta'l! Serveix per <b>continuar en un altre dispositiu</b> (botó «Tinc un codi de progrés») i perquè el professor vegi com vas.</p></div>`;$('#codeArea').scrollIntoView({behavior:'smooth',block:'nearest'});}
function roomHead(i){const R=ROOMS[i];return `<div class="rhead"><button class="btn small" data-act="map">← Mapa</button><span class="rtitle">${R.icon} Porta ${i+1} · ${OBJ[R.obj].t}</span><span class="pgchip">📘 Dossier ${R.pg}</span></div>`;}
function renderRoom(i){const R=ROOMS[i];cur={room:i,q:null,lastGen:null,answered:false,hint:false,sel:null,order:[]};
  if(S.rooms[i].done){renderReveal(i);return;}
  if(!S.rooms[i].seen){show(`<section class="room">${roomHead(i)}<h2>${R.name}</h2>${botSay('wave',R.intro)}
    <div class="theory-card">${R.theory}</div><div class="row"><button class="btn primary big" data-act="go">Som-hi! Primer repte</button></div></section>`);return;}
  nextQ();}
function nextQ(){const R=ROOMS[cur.room];let g;do{g=pick(R.gens);}while(g===cur.lastGen&&new Set(R.gens).size>1);
  cur.lastGen=g;cur.q=g();cur.tries=0;cur.answered=false;wbClear();cur.hint=false;cur.sel=null;cur.order=[];renderQ();}

function paintFig(q){if(q.fig==='pie')return piesSVG(q.d,0,true,q.units);if(q.fig==='rect')return rectSVG(q.cols,q.rows,0,true);return barsSVG(q.d,0,true,q.units);}
function cardHTML(i,act,extra=''){const [n,d]=cur.q.cards?cur.q.cards[i]:cur.q.items[i];return `<button class="pcard ${extra}" data-act="${act}" data-i="${i}" aria-label="${n} de ${d}">${F(n,d)}</button>`;}
function drawCards(){const q=cur.q,N=q.cards.length,sign=q.asc?'&lt;':'&gt;';let s='';
  for(let k=0;k<N;k++){if(k>0)s+=`<span class="sign-op">${sign}</span>`;s+=cur.order[k]!=null?cardHTML(cur.order[k],'cardback'):`<div class="slot">${k+1}</div>`;}
  $('#slots').innerHTML=s;$('#deck').innerHTML=q.cards.map((c,i)=>cur.order.includes(i)?'':cardHTML(i,'cardpick')).join('')||'<span class="muted">Totes col·locades. Toca una carta de dalt per tornar-la.</span>';}

function renderQ(){const i=cur.room,R=ROOMS[i],st=S.rooms[i],q=cur.q;let inner='';
  const sub='<button class="btn primary" data-act="submit">Comprovar</button>';
  if(q.kind==='mc')inner=`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-act="mc" data-i="${k}">${o}</button>`).join('')}</div>`;
  else if(q.kind==='frac')inner=`<div class="ansrow"><div class="fracin"><input id="an" inputmode="numeric" autocomplete="off" aria-label="Numerador"><span class="fbar"></span><input id="ad" inputmode="numeric" autocomplete="off" aria-label="Denominador"></div>${sub}</div>`;
  else if(q.kind==='num')inner=`<div class="ansrow"><input id="nn" class="numin" inputmode="numeric" autocomplete="off" aria-label="Resposta">${sub}</div>`;
  else if(q.kind==='dec')inner=`<div class="ansrow"><input id="dd" class="numin" inputmode="decimal" autocomplete="off" aria-label="Nombre decimal" placeholder="0,0">${sub}</div>`;
  else if(q.kind==='words')inner=`<div class="ansrow" style="flex-direction:column"><input id="ww" class="wordin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escriu en lletres" placeholder="Escriu aquí en lletres..."><div class="keys"><button class="key" data-act="ins" data-c="è">è</button><button class="key" data-act="ins" data-c="ç">ç</button><button class="key" data-act="ins" data-c="à">à</button></div>${sub}</div>`;
  else if(q.kind==='mixed')inner=`<div class="ansrow"><div class="mixin"><input id="mw" class="mixw" inputmode="numeric" autocomplete="off" aria-label="Unitats senceres"><div class="fracin"><input id="an" inputmode="numeric" autocomplete="off" aria-label="Numerador"><span class="fbar"></span><input id="ad" inputmode="numeric" autocomplete="off" aria-label="Denominador"></div></div>${sub}</div>`;
  else if(q.kind==='paint')inner=`${q.ref||''}<div class="visual" style="margin-top:0">${paintFig(q)}</div><div class="counter" id="cnt">Parts pintades: 0</div><div class="ansrow">${sub}</div>`;
  else if(q.kind==='line')inner=`<div class="visual">${lineSVG(q.d,q.U)}</div><div class="counter" id="cnt">Toca una marca de la recta</div><div class="ansrow">${sub}</div>`;
  else if(q.kind==='cards')inner=`<div class="cardlab">La teva fila</div><div class="slots" id="slots"></div><div class="cardlab">Les teves cartes</div><div class="deck" id="deck"></div><div class="ansrow">${sub}</div>`;
  else if(q.kind==='pick')inner=`<div class="deck">${q.items.map((c,k)=>cardHTML(k,'pickt')).join('')}</div><div class="ansrow">${sub}</div>`;
  show(`<section class="room">${roomHead(i)}
  <div class="progress">${R.name} ${dots(st.correct)}</div>
  <details class="theory"><summary>📘 Resum del dossier (${R.pg})</summary><div class="theory-card">${R.theory}</div></details>
  <article class="qcard"><div class="qnum">Repte ${Math.min(st.correct+1,NEED)} de ${NEED}</div>
  ${botSay(Math.random()<.5?'idle':'think',pick(R.tips),52,'small')}
  <div class="prompt">${q.prompt}</div>${q.visual?`<div class="visual">${q.visual}</div>`:''}${inner}
  <div id="hintBox"></div><div class="tools"><button class="btn small ghost" data-act="hint" id="hintBtn">💡 Pista (−3)</button></div><div id="fb"></div></article></section>`);
  if(q.kind==='cards')drawCards();
  const f=$('#ww')||$('#mw')||$('#an')||$('#nn')||$('#dd');if(f&&window.matchMedia('(pointer:fine)').matches)f.focus();}

function flash(msg){$('#fb').innerHTML=`<div class="fb warn">${msg}</div>`;}
function evaluate(q,ans){
  if(q.kind==='mc')return {ok:ans===q.correct};
  if(q.kind==='num')return {ok:ans===q.ans,msg:ans===q.ans?'':`La teva resposta: ${ans}`};
  if(q.kind==='dec')return {ok:Math.abs(ans-q.ans)<1e-9,msg:Math.abs(ans-q.ans)<1e-9?'':`La teva resposta: ${fmtDec(ans)}`};
  if(q.kind==='paint'||q.kind==='line')return {ok:ans===q.target};
  if(q.kind==='words')return checkWords(q.n,q.d,ans);
  if(q.kind==='cards'){const ok=ans.every((v,k)=>v===q.order[k]);return {ok};}
  if(q.kind==='pick'){const a=[...ans].sort((x,y)=>x-y),b=[...q.want].sort((x,y)=>x-y);return {ok:a.length===b.length&&a.every((v,k)=>v===b[k])};}
  if(q.kind==='mixed'){const [w,n,d]=ans,[W,N,D]=q.ans;if(w===W&&n*D===N*d&&n<d)return {ok:true,msg:(n!==N?`💡 Es pot simplificar: ${MIX(W,N,D)}`:'')};return {ok:false,msg:`La teva resposta: ${MIX(w,n,d)}`};}
  const [x,y]=ans;if(q.check){const r=q.check(x,y);if(!r.ok&&!r.msg)r.msg=`La teva resposta: ${F(x,y)}`;return r;}
  const [n,d]=q.ans;
  if((x===n&&y===d)||(q.equiv&&x*d===n*y)){const [sx,sy]=simp(x,y);return {ok:true,msg:gcd(x,y)>1?`💡 Encara la pots simplificar: ${sy===1?sx:F(sx,sy)}`:''};}
  return {ok:false,msg:`La teva resposta: ${F(x,y)}`};}
const isInt=v=>/^\d+$/.test(v);
function submit(val){if(!cur||cur.answered)return;const q=cur.q;let ans;
  if(q.kind==='mc')ans=val;
  else if(q.kind==='frac'||q.kind==='mixed'){const a=$('#an').value.trim(),b=$('#ad').value.trim();
    if(q.kind==='mixed'){const w=$('#mw').value.trim();if(!isInt(w)){flash('Escriu les unitats senceres (el nombre gran de l\'esquerra).');return;}}
    if(!isInt(a)){flash('Escriu un nombre al numerador (a dalt).');return;}
    if(!isInt(b)){if(q.kind==='frac'&&b===''){}else{flash('Escriu un nombre al denominador (a baix).');return;}}
    const y=b===''?1:parseInt(b,10);if(y===0){flash('El denominador no pot ser 0: no podem dividir en 0 parts!');return;}
    ans=q.kind==='mixed'?[parseInt($('#mw').value,10),parseInt(a,10),y]:[parseInt(a,10),y];}
  else if(q.kind==='num'){const a=$('#nn').value.trim();if(!isInt(a)){flash('Escriu un nombre enter.');return;}ans=parseInt(a,10);}
  else if(q.kind==='dec'){const a=$('#dd').value.trim().replace(/\s/g,'');if(!/^\d+([.,]\d+)?$/.test(a)){flash('Escriu un nombre. Per als decimals, fes servir la coma: 3,5');return;}ans=parseFloat(a.replace(',','.'));}
  else if(q.kind==='words'){const a=$('#ww').value.trim();if(!a){flash('Escriu la fracció en lletres.');return;}if(/\d/.test(a)){flash('Ho has d\'escriure amb <b>lletres</b>, no amb xifres. 😉');return;}ans=a;}
  else if(q.kind==='paint'){ans=app.querySelectorAll('.interactive .seg.on').length;if(!ans){flash('Pinta alguna part tocant la figura.');return;}}
  else if(q.kind==='line'){if(cur.sel==null){flash('Toca primer una marca de la recta.');return;}ans=cur.sel;}
  else if(q.kind==='cards'){if(cur.order.length<q.cards.length){flash('Col·loca totes les cartes a la fila.');return;}ans=cur.order.slice();}
  else if(q.kind==='pick'){ans=[...app.querySelectorAll('.pcard.sel')].map(e=>+e.dataset.i);if(!ans.length){flash('Toca almenys una carta.');return;}}
  const res=evaluate(q,ans);
  if(!res.ok&&!cur.tries){cur.tries=1;S.errors++;S.rooms[cur.room].err=(S.rooms[cur.room].err||0)+1;S.streak=0;save();updateHeader();sfx('err');
    if(q.kind==='mc'){const o=app.querySelectorAll('.opt')[val];o.classList.add('wrong');o.disabled=true;}
    $('#fb').innerHTML=`<div class="fb bad">${botSay('oops',pick(RETRY),60,'small')}${res.msg?`<p>${res.msg}</p>`:''}<p><b>Torna-ho a provar!</b> Si ara l'encertes, sumaràs <b>+5</b>.${cur.hint?'':' Si vols, fes servir la pista 💡.'}</p></div>`;
    $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  cur.answered=true;
  app.querySelectorAll('.qcard input,.qcard .opt,.qcard .key,[data-act="submit"],#hintBtn,.qcard .pcard').forEach(e=>e.disabled=true);
  app.querySelectorAll('.qcard .interactive').forEach(e=>e.classList.remove('interactive'));
  if(q.kind==='mc'){const o=app.querySelectorAll('.opt');o[q.correct].classList.add('right');if(!res.ok)o[val].classList.add('wrong');}
  if(q.kind==='line'){const svg=app.querySelector('.qcard .visual svg'),x=+svg.dataset.x0+q.target*(+svg.dataset.step),m=svg.querySelector('.okmark');m.setAttribute('cx',x);m.style.display='';}
  if(q.kind==='cards'){app.querySelectorAll('#slots .pcard').forEach((e,k)=>e.classList.add(+e.dataset.i===q.order[k]?'good':'badc'));}
  if(q.kind==='pick'){app.querySelectorAll('.qcard .pcard').forEach(e=>{const i=+e.dataset.i,w=q.want.includes(i),s=e.classList.contains('sel');if(w)e.classList.add('good');else if(s)e.classList.add('badc');});}
  const st=S.rooms[cur.room];let pts=0;
  if(res.ok){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak);pts=cur.tries?5:10+(S.streak>=3?5:0);S.score+=pts;st.correct++;sfx('ok');}
  else{S.errors++;st.err=(st.err||0)+1;S.streak=0;sfx('err');}
  const fin=st.correct>=NEED&&!st.done;if(fin)st.done=true;
  save();updateHeader();
  const say=res.ok?`${cur.tries?'Ara sí! Bona rectificació.':pick(PRAISE)} <span class="pts">+${pts}${pts>10?' 🔥':''}</span>`:pick(OOPS);
  $('#fb').innerHTML=`<div class="fb ${res.ok?'ok':'bad'}">${botSay(res.ok?(fin?'wow':'happy'):'oops',say,60,'small')}
    ${res.msg?`<p>${res.msg}</p>`:''}<div class="exp">${q.explain}</div>
    <button class="btn primary" data-act="${fin?'unlock':'next'}">${fin?'Obrir el cadenat 🔓':'Següent repte'}</button></div>`;
  app.querySelector('.progress .dots').outerHTML=dots(st.correct);
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});}
function useHint(){if(!cur||cur.hint||cur.answered)return;cur.hint=true;S.hints++;S.score=Math.max(0,S.score-3);save();updateHeader();sfx('hint');
  $('#hintBox').innerHTML=`<div class="hint">💡 ${cur.q.hint}</div>`;$('#hintBtn').disabled=true;}

function renderReveal(i){const last=S.rooms.every(r=>r.done);
  show(`<section class="reveal">${padlock(false,'biglock')}<h2>Porta ${i+1} oberta!</h2>
  ${botSay('wow',last?'Increïble... Tens totes les xifres. Ara, a la porta de sortida!':`La xifra secreta de «${ROOMS[i].name}» és aquesta. Apunta-la a la llibreta!`,70)}
  <div class="bigdigit pop">${S.digits[i]}</div>
  <div class="row center"><button class="btn primary big" data-act="map">Tornar al mapa</button></div></section>`);

function renderFinal(){show(`<section class="reveal"><div class="rhead"><button class="btn small" data-act="map">← Mapa</button></div>
  ${padlock(false,'biglock')}<h2>Porta de sortida</h2>
  <div style="max-width:640px;margin:0 auto;text-align:left">${botSay('think','Introdueix les 9 xifres en l\'ordre de les portes (de la 1 a la 9). Si falles, pots tornar-ho a provar. Soc un robot, no un monstre.')}</div>
  <div class="code" id="code">${ROOMS.map((R,i)=>`<label><span>${R.icon}</span><input class="cd" maxlength="1" inputmode="numeric" data-i="${i}" aria-label="Xifra de la porta ${i+1}"></label>`).join('')}</div>
  <div id="cfb"></div><div class="row center"><button class="btn primary big" data-act="open">Obrir la porta 🔑</button></div></section>`);

function checkCode(){const v=[...app.querySelectorAll('.cd')].map(e=>e.value);
  if(v.some(x=>!/^\d$/.test(x))){$('#cfb').innerHTML='<div class="fb warn">Falten xifres per omplir.</div>';return;}
  if(v.every((x,i)=>+x===S.digits[i])){S.won=true;S.end=S.end||Date.now();save();renderWin();}
  else{const c=$('#code');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');sfx('lockFail');
    $('#cfb').innerHTML=botSay('oops','Codi incorrecte. Revisa les xifres al mapa i l\'ordre de les portes.',60,'small');}}
function renderWin(){const acc=S.ok/((S.ok+S.errors)||1),stars=acc>=.85?3:acc>=.65?2:1;
  const rank=stars===3?'Mestre de les fraccions':stars===2?'Expert en fraccions':'Aprenent de fraccions (i ja n\'hi ha per estar orgullós!)';
  show(`<section class="reveal win">${padlock(true,'biglock open')}<h2>Has escapat!</h2><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
  <p style="font-size:1.3rem"><b>${esc(S.team)}</b> · ${rank}</p>
  <div style="max-width:640px;margin:0 auto;text-align:left">${botSay('happy',`M'has guanyat, ${firstName()}. Ho reconec. Ets un crack de les fraccions! 🧡`)}</div>
  <div class="statgrid"><div>Punts<b>${S.score}</b></div><div>Temps<b>${fmt(S.end-S.start)}</b></div><div>Encerts<b>${S.ok}</b></div><div>Errors<b>${S.errors}</b></div><div>Millor ratxa<b>🔥 ${S.best}</b></div><div>Pistes<b>${S.hints}</b></div></div>
  <div class="codepanel">Codi de progrés per al professor<br><span class="codebox" style="font-size:clamp(1.1rem,4.6vw,1.9rem)">${makeCode()}</span><p class="muted" style="margin:.3rem 0 0">Alumne: <b>${esc(S.team)}</b></p></div>
  <div class="row center"><button class="btn primary big" data-act="logout">Sortir</button></div>
  <p class="muted" style="margin-top:1.5rem">Matemàtiques · Ins Júlia Minguell, Badalona · Fet amb IA</p></section>`);
  sfx('win');confetti(220);}

/* ---------- tauler del professor ---------- */
function sortRes(R){return R.sort((a,b)=>(b.won-a.won)||(b.rd-a.rd)||(b.score-a.score)||(a.secs-b.secs));}
const heat=(e,open)=>`<span class="heat h${e===0?0:e<=2?1:e<=4?2:3} ${open?'open':''}">${e>=7?'7+':e}</span>`;
function renderTeacher(msg=''){if(S)save();S=null;cur=null;const R=sortRes(loadRes());
  const tot=ROOMS.map((_,k)=>R.reduce((a,r)=>a+r.err[k],0)),maxT=Math.max(0,...tot);
  show(`<section class="room"><div class="rhead"><button class="btn small" data-act="home2">← Inici</button></div><h2>Tauler del professor</h2>
  <p class="muted">Cada alumne et dona el seu nom i el <b>codi de progrés</b> (botó «El meu codi de progrés» del mapa, o la pantalla final). El codi va lligat al nom. Els resultats es desen només en aquest dispositiu.</p>
  <details class="theory"><summary>⚙️ Opcions del professor</summary><div class="theory-card">
    <label class="check" style="margin-top:0"><input type="checkbox" id="tfree" data-act="togglefree" ${getFree()?'checked':''}> <span><b>Mode lliure en aquest dispositiu:</b> totes les portes obertes des del principi, per treballar només una part del dossier.</span></label>
    <p class="muted" style="font-size:.95rem;margin:.5rem 0 0">S'aplica a tots els alumnes que entrin en aquest ordinador o tauleta mentre estigui activat. Si el desactives, les portes tornen a obrir-se per ordre, i cap alumne perd el progrés.</p></div></details>
  <div class="tform"><label>Nom i cognom<input id="tteam" autocomplete="off" placeholder="Com l'ha escrit l'alumne"></label><label>Codi de progrés<input id="tcode" autocomplete="off" placeholder="XXXX-XXXX-..." maxlength="40"></label><button class="btn primary" data-act="addres">Afegir</button></div>
  <details class="theory"><summary>📋 Afegir-ne molts de cop (enganxar una llista)</summary><div class="theory-card">
    <p>Una línia per alumne, amb el nom i el codi (per exemple, copiat d'un full de càlcul o d'un formulari del Classroom):</p>
    <textarea class="bulk" id="bulk" placeholder="Salma Benali	7K2M-QX9P-...&#10;Andrei Popescu; 4HT8-..."></textarea>
    <div class="row"><button class="btn primary small" data-act="bulkadd">Afegir la llista</button></div></div></details>
  <div id="tmsg">${msg}</div>
  ${R.length?`<div class="twrap"><table class="res"><thead><tr><th>#</th><th>Alumne</th><th>Estat</th><th>Portes</th><th>Punts</th><th>Temps</th><th>Errors</th><th>Pistes</th>${ROOMS.map((_,k)=>`<th title="${esc(ROOMS[k].name)}">P${k+1}</th>`).join('')}<th>S'encalla a</th><th></th></tr></thead><tbody>
  ${R.map((r,i)=>{const mx=Math.max(...r.err),where=mx>0?r.err.indexOf(mx):-1;
    return `<tr><td>${i+1}</td><td><b>${esc(r.team)}</b></td><td>${r.won?'🏆 Ha escapat':'⏳ En curs'}</td><td>${r.rd}/${ROOMS.length}</td><td>${r.score}</td><td>${fmt(r.secs*1000)}</td><td>${r.errors}</td><td>${r.hints}</td>${r.err.map((e,k)=>`<td>${heat(e,r.correct[k]>=NEED)}</td>`).join('')}<td>${where>=0?`P${where+1} · ${esc(ROOMS[where].name)}`:'—'}</td><td><button class="rm" data-act="delres" data-k="${esc(r.key)}" aria-label="Esborrar">✕</button></td></tr>`;}).join('')}
  </tbody><tfoot><tr><td></td><td>Total classe</td><td colspan="6">${maxT>0?`Porta amb més errors: <b>P${tot.indexOf(maxT)+1} · ${esc(ROOMS[tot.indexOf(maxT)].name)}</b>`:''}</td>${tot.map(t=>`<td>${t}</td>`).join('')}<td colspan="2"></td></tr></tfoot></table></div>
  <p class="legend">P1–P9: errors a cada porta (7+ vol dir 7 o més). Vora verda: porta oberta. Com més taronja, més errors.</p>
  <div class="row"><button class="btn primary" data-act="xlsx">⬇️ Exportar a Excel</button><button class="btn small" data-act="copyres">📋 Copiar la taula</button><button class="btn small ghost" data-act="clearres">Esborrar-ho tot</button></div><div id="csvArea"></div>`
  :`<div class="codepanel">Encara no hi ha cap alumne. Afegeix el primer amb el formulari de dalt.</div>`}</section>`);}
function upsertRes(team,v){const key=normTeam(team),R=loadRes(),old=R.findIndex(r=>r.key===key);const row=Object.assign({key,team,at:Date.now()},v);
  if(old>=0)R[old]=row;else R.push(row);saveRes(R);return old>=0;}
function addRes(){const team=$('#tteam').value.trim().replace(/\s+/g,' '),code=$('#tcode').value.trim();
  if(!team||!code){$('#tmsg').innerHTML='<div class="fb warn">Cal el nom i el codi de progrés.</div>';return;}
  const v=readCode(team,code);
  if(!v){$('#tmsg').innerHTML='<div class="fb bad" style="padding:.6rem 1rem">Codi no vàlid per a aquest nom. Comprova el codi i que el nom sigui el mateix que va escriure l\'alumne (majúscules i accents no importen).</div>';return;}
  const was=upsertRes(team,v);
  renderTeacher(`<div class="fb ok" style="padding:.6rem 1rem">✅ ${esc(team)}: ${v.won?'ha escapat!':v.rd+' de '+ROOMS.length+' portes'} · ${v.score} punts${was?' (resultat anterior actualitzat)':''}</div>`);}
const CODE_RE=/([2-9A-HJ-NP-Z]{4}(?:-?[2-9A-HJ-NP-Z]{4}){5})["'\s]*$/i;
function bulkAdd(){const lines=$('#bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let ok=0;const bad=[];
  lines.forEach(l=>{const m=l.match(CODE_RE);if(!m){bad.push(l);return;}const name=l.slice(0,m.index).replace(/[\t,;|"]+/g,' ').replace(/\s+/g,' ').trim();
    const v=name&&readCode(name,m[1]);if(!v){bad.push(l);return;}upsertRes(name,v);ok++;});
  renderTeacher(`<div class="fb ${bad.length?'warn':'ok'}" style="padding:.6rem 1rem">✅ Afegits o actualitzats: <b>${ok}</b>.${bad.length?`<br>No s'han pogut llegir (${bad.length}):<br>${bad.map(esc).join('<br>')}`:''}</div>`);}
function resRows(R){return R.map((r,i)=>{const o={'Posició':i+1,'Alumne':r.team,'Estat':r.won?'Ha escapat':'En curs','Portes obertes':r.rd,'Punts':r.score,'Temps (min)':+(r.secs/60).toFixed(1),'Encerts':r.ok,'Errors':r.errors,'Pistes':r.hints,'Millor ratxa':r.best};
  ROOMS.forEach((R2,k)=>{o[`P${k+1} errors`]=r.err[k];});ROOMS.forEach((R2,k)=>{o[`P${k+1} encerts`]=r.correct[k];});
  const mx=Math.max(...r.err);o["S'encalla a"]=mx>0?`P${r.err.indexOf(mx)+1} ${ROOMS[r.err.indexOf(mx)].name}`:'';o['Codi afegit el']=new Date(r.at).toLocaleString('ca-ES');return o;});}
function tmsg2(html){$('#csvArea').innerHTML=`<div class="fb warn" style="margin-top:.8rem">${html}</div>`;}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej();s.onerror=rej;document.head.appendChild(s);});}
async function exportXlsx(){const R=sortRes(loadRes());if(!R.length)return;tmsg2('Preparant el fitxer d\'Excel...');
  let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(!dl){tmsg2('La descàrrega directa no està disponible en aquesta vista. Fes servir <b>«Copiar la taula»</b> i enganxa-la a Excel.');return;}
  let X;try{X=await loadXLSX();}catch(e){tmsg2('No s\'ha pogut carregar el generador d\'Excel (revisa la connexió). Pots fer servir «Copiar la taula».');return;}
  const ws=X.utils.json_to_sheet(resRows(R));ws['!cols']=[{wch:8},{wch:26},{wch:12},{wch:9},{wch:8},{wch:10},{wch:9},{wch:8},{wch:8},{wch:11},...ROOMS.map(()=>({wch:10})),...ROOMS.map(()=>({wch:11})),{wch:30},{wch:18}];
  const sum=ROOMS.map((R2,k)=>{const e=R.reduce((a,r)=>a+r.err[k],0);return {'Porta':`P${k+1}`,'Nom':R2.name,'Objectiu':OBJ[R2.obj].t,'Pàgines del dossier':R2.pg,"Alumnes que l'han oberta":R.filter(r=>r.correct[k]>=NEED).length,'Errors totals':e,"Mitjana d'errors per alumne":+(e/R.length).toFixed(2)};});
  const ws2=X.utils.json_to_sheet(sum);ws2['!cols']=[{wch:7},{wch:24},{wch:12},{wch:18},{wch:24},{wch:13},{wch:26}];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Alumnes');X.utils.book_append_sheet(wb,ws2,'Per portes');
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});const dt=new Date().toISOString().slice(0,10);
  try{await dl.save({filename:`Escape_v2_resultats_${dt}.xlsx`,data:new Blob([buf])});$('#csvArea').innerHTML='<div class="fb ok" style="padding:.6rem 1rem;margin-top:.8rem">✅ Fitxer d\'Excel preparat. Mira a la carpeta de descàrregues.</div>';}
  catch(e){const c=e&&e.code;tmsg2(c==='declined'?'Descàrrega cancel·lada.':c==='rate_limited'?'Ja hi ha una descàrrega oberta. Espera un moment i torna-ho a provar.':'No s\'ha pogut descarregar en aquesta vista. Fes servir <b>«Copiar la taula»</b> i enganxa-la a Excel.');}}
function copyRes(){const rows=resRows(sortRes(loadRes()));if(!rows.length)return;const keys=Object.keys(rows[0]);
  const txt=[keys.join('\t'),...rows.map(o=>keys.map(k=>o[k]).join('\t'))].join('\n');
  const fb=()=>{$('#csvArea').innerHTML=`<p class="muted">Selecciona el text, copia'l (Ctrl+C) i enganxa'l a Excel:</p><textarea class="csv" readonly>${esc(txt)}</textarea>`;const ta=app.querySelector('textarea.csv');ta.focus();ta.select();};
  try{navigator.clipboard.writeText(txt).then(()=>{$('#csvArea').innerHTML='<div class="fb ok" style="padding:.6rem 1rem;margin-top:.8rem">Taula copiada. Enganxa-la a Excel.</div>';},fb);}catch(e){fb();}}

/* ---------- pissarra ---------- */
const WB={strokes:[],curS:null,tool:'ink',ctx:null,c:null,dpr:1};
function wbInit(){const fab=document.createElement('button');fab.className='wb-fab';fab.dataset.wb='open';fab.innerHTML='✏️ Pissarra';document.body.appendChild(fab);
  const p=document.createElement('div');p.className='wb';p.id='wb';p.hidden=true;p.setAttribute('role','dialog');p.setAttribute('aria-label','Pissarra de càlculs');
  p.innerHTML=`<div class="wb-bar"><span class="wb-title">✏️ Pissarra</span>
   <button class="wb-tool on" data-wb="ink" title="Bolígraf negre" aria-label="Bolígraf negre"><span class="wb-dot" style="background:var(--ink)"></span></button>
   <button class="wb-tool" data-wb="accent" title="Bolígraf taronja" aria-label="Bolígraf taronja"><span class="wb-dot" style="background:var(--accent)"></span></button>
   <button class="wb-tool" data-wb="eraser" title="Goma" aria-label="Goma">🧽</button>
   <button class="wb-tool" data-wb="undo" title="Desfer" aria-label="Desfer">↶</button>
   <button class="wb-tool" data-wb="clear" title="Esborrar-ho tot" aria-label="Esborrar-ho tot">🗑️</button>
   <button class="wb-tool" data-wb="close" title="Tancar" aria-label="Tancar">✕</button></div>
   <div class="wb-q" id="wbq"></div><div class="wb-wrap" id="wbw"><canvas id="wbc"></canvas></div>
   <div class="wb-foot muted">Esborrany: s'esborra sol quan canvies de repte.</div>`;
  document.body.appendChild(p);WB.c=p.querySelector('canvas');WB.ctx=WB.c.getContext&&(()=>{try{return WB.c.getContext('2d');}catch(e){return null;}})();
  document.body.addEventListener('click',e=>{const b=e.target.closest('[data-wb]');if(!b)return;const a=b.dataset.wb;
    if(a==='open')wbOpen(true);else if(a==='close')wbOpen(false);
    else if(a==='ink'||a==='accent'||a==='eraser'){WB.tool=a;p.querySelectorAll('[data-wb="ink"],[data-wb="accent"],[data-wb="eraser"]').forEach(x=>x.classList.toggle('on',x===b));}
    else if(a==='undo'){WB.strokes.pop();wbDraw();}else if(a==='clear'){WB.strokes=[];wbDraw();}});
  const pos=e=>{const r=WB.c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  WB.c.addEventListener('pointerdown',e=>{e.preventDefault();try{WB.c.setPointerCapture(e.pointerId);}catch(_){}WB.curS={t:WB.tool,w:WB.tool==='eraser'?28:(e.pointerType==='pen'?2.5+2*(e.pressure||.5):3.5),p:[pos(e)]};WB.strokes.push(WB.curS);wbDraw();});
  WB.c.addEventListener('pointermove',e=>{if(!WB.curS)return;e.preventDefault();const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];ev.forEach(x=>WB.curS.p.push(pos(x)));wbDraw(true);});
  const end=()=>{WB.curS=null;};WB.c.addEventListener('pointerup',end);WB.c.addEventListener('pointercancel',end);WB.c.addEventListener('pointerleave',end);
  window.addEventListener('resize',()=>{if(!p.hidden)wbSize();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!p.hidden)wbOpen(false);});}
function wbOpen(on){const p=$('#wb');if(!p)return;p.hidden=!on;document.body.classList.toggle('wb-open',on);
  if(on){$('#wbq').innerHTML=cur&&cur.q&&!cur.answered?cur.q.prompt:'';wbSize();}}
function wbSize(){if(!WB.ctx)return;const r=$('#wbw').getBoundingClientRect();WB.dpr=window.devicePixelRatio||1;WB.c.width=Math.max(1,r.width*WB.dpr);WB.c.height=Math.max(1,r.height*WB.dpr);wbDraw();}
function wbDraw(){const x=WB.ctx;if(!x)return;x.setTransform(WB.dpr,0,0,WB.dpr,0,0);x.clearRect(0,0,WB.c.width,WB.c.height);
  const cs=getComputedStyle(document.documentElement),col={ink:cs.getPropertyValue('--ink').trim()||'#000',accent:cs.getPropertyValue('--accent').trim()||'#ff6a00'};
  x.lineCap='round';x.lineJoin='round';
  for(const s of WB.strokes){x.globalCompositeOperation=s.t==='eraser'?'destination-out':'source-over';x.strokeStyle=s.t==='eraser'?'#000':col[s.t];x.lineWidth=s.w;x.beginPath();
    const [x0,y0]=s.p[0];x.moveTo(x0,y0);if(s.p.length===1)x.lineTo(x0+.1,y0+.1);for(let i=1;i<s.p.length;i++)x.lineTo(s.p[i][0],s.p[i][1]);x.stroke();}
  x.globalCompositeOperation='source-over';}
function wbClear(){WB.strokes=[];WB.curS=null;wbDraw();const q=$('#wbq');if(q)q.innerHTML=cur&&cur.q?cur.q.prompt:'';}

/* =========================================================
   ESDEVENIMENTS
   ========================================================= */
if(app){
$('#brand').innerHTML=`${padlock(false,'')} Operació Fracció · v2`;
wbInit();
new MutationObserver(()=>typeAll(app)).observe(app,{childList:true,subtree:true});
document.querySelector('.top').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='mute'){S.mute=!S.mute;save();updateHeader();}
  if(b.dataset.act==='logout'){wbOpen(false);renderStart();}
  if(b.dataset.act==='home'){if(S&&!S.won)renderMap();else renderStart();}});
app.addEventListener('click',e=>{
  const seg=e.target.closest('.qcard .interactive .seg');
  if(seg&&cur&&!cur.answered&&cur.q.kind==='paint'){seg.classList.toggle('on');$('#cnt').textContent=`Parts pintades: ${app.querySelectorAll('.qcard .interactive .seg.on').length}`;sfx('tap');return;}
  const hit=e.target.closest('.qcard .interactive .hit');
  if(hit&&cur&&!cur.answered){const i=+hit.dataset.i,svg=hit.closest('svg'),x=+svg.dataset.x0+i*(+svg.dataset.step),m=svg.querySelector('.marker');
    cur.sel=i;m.style.display='';m.setAttribute('transform',`translate(${x},40)`);const d=cur.q.d;$('#cnt').innerHTML=`Has marcat: ${i%d===0?i/d:F(i,d)}`;sfx('tap');return;}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='login')login();
  else if(a==='showrestore'){const r=$('#restoreBox');r.hidden=!r.hidden;if(!r.hidden)$('#ucode').focus();}
  else if(a==='logout'){wbOpen(false);renderStart();}
  else if(a==='soundtest'){const was=S;S=null;SFX.ok();setTimeout(()=>SFX.err(),700);S=was;$('#stMsg').innerHTML=botSay('happy','Has d\'haver sentit dos sons: <b>«ding-ding»</b> (encert) i <b>«oh-oh»</b> (error). Si no sents res, revisa el volum o que el navegador no tingui el so silenciat.',56,'small');}
  else if(a==='map')renderMap();
  else if(a==='room')renderRoom(+b.dataset.r);
  else if(a==='go'){S.rooms[cur.room].seen=true;save();nextQ();}
  else if(a==='mc')submit(+b.dataset.i);
  else if(a==='submit')submit();
  else if(a==='next')nextQ();
  else if(a==='hint')useHint();
  else if(a==='ins'){const w=$('#ww');if(w&&!w.disabled){const s=w.selectionStart??w.value.length;w.value=w.value.slice(0,s)+b.dataset.c+w.value.slice(w.selectionEnd??s);w.focus();w.setSelectionRange(s+1,s+1);}}
  else if(a==='cardpick'){if(!cur.answered){cur.order.push(+b.dataset.i);sfx('tap');drawCards();}}
  else if(a==='cardback'){if(!cur.answered){cur.order=cur.order.filter(x=>x!==+b.dataset.i);sfx('tap');drawCards();}}
  else if(a==='pickt'){if(!cur.answered){b.classList.toggle('sel');sfx('tap');}}
  else if(a==='unlock')renderReveal(cur.room);
  else if(a==='final')renderFinal();
  else if(a==='open')checkCode();
  else if(a==='reset'){if(confirm('Segur que vols reiniciar la teva partida? Es perdrà tot el progrés.')){const n=S.team,p=S.pin,f=S.free;clearSave();S=newState(n,p,f);save();renderMap();}}
  else if(a==='showcode')showCode();
  else if(a==='teacher')renderTeacher();
  else if(a==='home2')renderStart();
  else if(a==='addres')addRes();
  else if(a==='delres'){saveRes(loadRes().filter(r=>r.key!==b.dataset.k));renderTeacher();}
  else if(a==='copyres')copyRes();
  else if(a==='xlsx')exportXlsx();
  else if(a==='bulkadd')bulkAdd();
  else if(a==='togglefree'){setFree(b.checked);$('#tmsg').innerHTML=`<div class="fb ok" style="padding:.6rem 1rem">${b.checked?'🔓 Mode lliure activat en aquest dispositiu.':'🔒 Mode lliure desactivat: les portes s\'obren per ordre.'}</div>`;}
  else if(a==='clearres'){if(confirm('Segur que voleu esborrar tots els resultats?')){saveRes([]);renderTeacher();}}
});
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  if(t.matches('#mw')){e.preventDefault();$('#an').focus();return;}
  if(t.matches('#an')&&$('#ad')&&$('#ad').value===''){e.preventDefault();$('#ad').focus();return;}
  if(t.matches('#an,#ad,#nn,#dd,#ww')){e.preventDefault();submit();}
  else if(t.matches('.cd')){e.preventDefault();checkCode();}
  else if(t.matches('#tteam')){e.preventDefault();$('#tcode').focus();}
  else if(t.matches('#tcode')){e.preventDefault();addRes();}
  else if(t.matches('#uname')){e.preventDefault();$('#upin').focus();}
  else if(t.matches('#upin,#ucode')){e.preventDefault();login();}});
app.addEventListener('input',e=>{if(e.target.matches('.cd')){e.target.value=e.target.value.replace(/\D/g,'').slice(-1);
  if(e.target.value){const n=app.querySelector(`.cd[data-i="${+e.target.dataset.i+1}"]`);if(n)n.focus();}}});
setInterval(()=>{if(S&&!S.end){const c=$('#clock');if(c)c.textContent=fmt(Date.now()-S.start);}},1000);
renderStart();
}
</script>
