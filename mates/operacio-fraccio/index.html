<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape v2 · Operació Fracció: el laboratori precintat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#000000; --muted:#545454; --line:#d4d4d4; --slot:#efefef;
  --accent:#ff6a00; --accent-soft:#ffe3cc; --on-accent:#000000;
  --ok:#11803c; --ok-bg:#e2f6e8; --bad:#c42e1a; --bad-bg:#fde6e1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#151515; --ink:#ffffff; --muted:#b5b5b5; --line:#3a3a3a; --slot:#2a2a2a;
    --accent-soft:#3d1f08; --ok:#52d98a; --ok-bg:#0f2a1a; --bad:#ff8a73; --bad-bg:#3a140d;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#151515; --ink:#ffffff; --muted:#b5b5b5; --line:#3a3a3a; --slot:#2a2a2a;
  --accent-soft:#3d1f08; --ok:#52d98a; --ok-bg:#0f2a1a; --bad:#ff8a73; --bad-bg:#3a140d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-size:20px;line-height:1.5;overflow-x:hidden}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Arial Black',Impact,system-ui,sans-serif;font-weight:800;line-height:1.02;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- cinta policial ---------- */
.tape{height:16px;background:repeating-linear-gradient(-45deg,var(--accent) 0 11px,#000 11px 22px);
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 110px,transparent 110px 126px);mask-image:repeating-linear-gradient(90deg,#000 0 110px,transparent 110px 126px)}
.tape .run{display:none}
.cover>.tape{height:22px}
.tape-x{position:absolute;left:-25%;right:-25%;top:40%;height:22px;transform:rotate(-14deg);z-index:3;pointer-events:none}
.tape-x.b{transform:rotate(11deg);top:58%}

/* ---------- capçalera ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:.6rem;justify-content:space-between;padding:.5rem 1rem;flex-wrap:wrap}
.brand{font-family:'Bricolage Grotesque','Arial Black',sans-serif;font-weight:800;font-size:1.2rem;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:.45rem}
.brand svg{width:26px;height:30px}
.stats{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.chip{border:2px solid var(--ink);border-radius:999px;padding:.1rem .65rem;font-size:.95rem;background:var(--surface);white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
button.chip{cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:1.2rem 1rem 3rem}

/* ---------- fraccions ---------- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em .04em}
.fr>span:last-child{padding:.04em .18em 0}
.mix{display:inline-flex;align-items:center;gap:.05em;vertical-align:middle}
.mix>b{font-size:1.25em}

/* ---------- botons ---------- */
.btn{border:3px solid var(--ink);background:var(--surface);color:var(--ink);padding:.65rem 1.15rem;border-radius:12px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-weight:700;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.big{font-size:1.2rem;padding:.85rem 1.5rem}
.btn.small{font-size:.9rem;padding:.35rem .8rem;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:1.2rem}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.muted{color:var(--muted)}

/* ---------- robot ---------- */
.bot{display:flex;gap:.8rem;align-items:flex-end;margin:1rem 0}
.bot-av{flex:none;line-height:0}
.bot .say{position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:.65rem 1rem;margin-bottom:.4rem}
.bot .say b.who{display:block;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.bot.small .say{font-size:1rem;padding:.45rem .8rem}
.robot{overflow:visible}
.robot .rb-head{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.robot .rb-screen{fill:#000}
.robot .rb-eye{fill:var(--accent)}
.robot .rb-l{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.robot .rb-body{fill:var(--accent);stroke:var(--ink);stroke-width:4}
.robot .rb-ink{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.robot .rb-bulb{fill:var(--accent);stroke:var(--ink);stroke-width:3}
.robot .rb-arm{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.robot .rb-hand{fill:var(--accent);stroke:var(--ink);stroke-width:3}
.robot .rb-txt{fill:#000;font:800 11px 'Bricolage Grotesque',sans-serif;text-anchor:middle}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-10px)}100%{transform:translateY(0)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}70%{transform:rotate(5deg)}}
@keyframes blink{0%,80%{opacity:1}85%{opacity:.25}}

/* ---------- portada ---------- */
.cover{position:relative;border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:8px 8px 0 var(--ink);margin-top:.5rem}
.cover-in{padding:1.6rem 1.4rem 1.4rem;position:relative}
.cover h1{font-size:clamp(2.8rem,10vw,5.6rem);margin:.2rem 0 .6rem}
.cover h1 small{display:block;font-size:.36em;letter-spacing:0;color:var(--muted);margin-top:.35rem;font-weight:500}
.cover .tape{font-size:1.05rem}
.cover-grid{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end}
.cover-lock{width:110px;height:130px}
@media (max-width:620px){.cover-grid{grid-template-columns:1fr}.cover-lock{display:none}}
.field{display:block;font-weight:700;margin:1.2rem 0 .4rem}
.field input{display:block;width:100%;max-width:480px;margin-top:.35rem;padding:.7rem .9rem;border:3px solid var(--ink);border-radius:12px;background:var(--surface);font-size:1.15rem}
.check{display:flex;gap:.5rem;align-items:center;font-size:1rem;margin-top:.6rem;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.rules{margin-top:1.4rem;border:3px solid var(--ink);border-radius:14px;padding:1rem 1.2rem;background:var(--accent-soft)}
.rules h3{margin:.1rem 0 .4rem;font-size:1.3rem}
.rules ul{margin:.2rem 0;padding-left:1.2rem}
.sign{margin-top:1.4rem;border-top:3px solid var(--ink);padding-top:.9rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.sign .school{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem}
.sign .ai{border:2px solid var(--ink);border-radius:999px;padding:.1rem .7rem;font-size:.9rem;font-weight:700}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--muted);font-size:1rem}

/* ---------- mapa ---------- */
.obj{margin-top:1.6rem}
.obj-h{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:.3rem}
.obj-h h3{margin:0;font-size:1.35rem}
.obj-h .pg{font-size:.9rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-top:.9rem}
.card{position:relative;overflow:hidden;text-align:left;border:3px solid var(--ink);border-radius:16px;background:var(--surface);padding:1rem 1.1rem;cursor:pointer;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;gap:.3rem;min-height:190px}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.card.locked{cursor:not-allowed;box-shadow:none;background:var(--slot)}
.card.locked .c-name,.card.locked .c-sub,.card.locked .c-top{opacity:.45}
.card.done{background:var(--accent-soft)}
.card.current{box-shadow:5px 5px 0 var(--accent)}
.c-top{display:flex;justify-content:space-between;align-items:flex-start}
.c-ic{font-size:2rem;line-height:1}
.c-lock{width:30px;height:36px}
.c-num{font-weight:700;font-size:.9rem;color:var(--muted)}
.c-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.4rem;line-height:1.1}
.c-sub{color:var(--muted);font-size:.95rem}
.c-st{margin-top:auto;font-weight:700;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.digit-s{display:inline-grid;place-items:center;width:1.8em;height:1.8em;background:#000;color:var(--accent);border-radius:8px}
.card.final{grid-column:1/-1;min-height:auto;background:#000;color:#fff;box-shadow:5px 5px 0 var(--accent);flex-direction:row;align-items:center;gap:1rem}
.card.final .c-sub{color:#ddd}
.card.final.locked{background:var(--slot);color:var(--ink)}
.card.final.locked .c-sub{color:var(--muted)}
.dots{display:inline-flex;gap:.35rem;vertical-align:middle}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);display:inline-block}
.dots i.on{background:var(--accent)}

/* ---------- sala ---------- */
.rhead{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.rtitle{font-weight:700;color:var(--muted)}
.pgchip{border:2px solid var(--ink);border-radius:8px;padding:0 .5rem;font-size:.85rem;font-weight:700;background:var(--accent-soft)}
.room h2{font-size:clamp(2rem,6vw,3rem);margin:.8rem 0 .4rem}
.progress{display:flex;gap:.7rem;align-items:center;margin:.8rem 0;font-weight:700;flex-wrap:wrap}
details.theory{border:2px solid var(--ink);border-radius:12px;background:var(--surface);margin-bottom:1rem}
details.theory summary{cursor:pointer;padding:.55rem .9rem;font-weight:700}
details.theory .theory-card{border:0;border-top:2px solid var(--ink);border-radius:0 0 12px 12px;margin:0}
.theory-card{border:3px solid var(--ink);border-radius:14px;padding:1rem 1.2rem;background:var(--surface)}
.theory-card h4{margin:.6rem 0 .2rem;font-family:'Bricolage Grotesque',sans-serif;font-size:1.15rem}
.theory-card p{margin:.3rem 0 .7rem}
.theory-card ul,.theory-card ol{padding-left:1.3rem;margin:.3rem 0 .7rem}
.theory-card li{margin:.2rem 0}
.ex{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0}
.ex>div{flex:1 1 220px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.35rem;margin:.5rem 0}
.names div{display:flex;align-items:center;gap:.5rem;border:2px solid var(--line);border-radius:10px;padding:.25rem .55rem;font-size:1rem}
.names .fr{color:var(--accent);font-size:1.05rem}

.qcard{position:relative;border:3px solid var(--ink);border-radius:18px;background:var(--surface);padding:1.1rem 1.2rem 1.4rem;box-shadow:6px 6px 0 var(--accent)}
.qnum{font-weight:700;color:var(--muted);font-size:.95rem}
.prompt{font-size:1.4rem;line-height:1.45;margin:.4rem 0 1rem}
.prompt .fr{font-size:1.15em}
.visual{margin:1rem 0}
.fig{display:block;margin:0 auto;max-width:100%;height:auto}
.seg{fill:var(--slot);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.seg.on{fill:var(--accent)}
.outline{fill:none;stroke:var(--ink);stroke-width:4}
.interactive .seg{cursor:pointer}
.interactive .seg:hover{fill:var(--accent-soft)}
.interactive .seg.on:hover{fill:var(--accent)}
.axis{stroke:var(--ink);stroke-width:3;pointer-events:none}
.tick{stroke:var(--ink);stroke-width:2;pointer-events:none}
.tick.big{stroke-width:3.5}
.lbl{fill:var(--ink);font-size:24px;font-weight:700;text-anchor:middle;pointer-events:none;font-family:'Atkinson Hyperlegible',sans-serif}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:var(--accent);fill-opacity:.15}
.mk{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.mk-ok{fill:var(--ok);stroke:var(--ink);stroke-width:2}
.counter{text-align:center;font-weight:700;font-size:1.15rem;margin:.3rem 0 .6rem;min-height:1.6em}
.eqref{display:grid;grid-template-columns:3.6rem 1fr;align-items:center;gap:.6rem;max-width:480px;margin:0 auto .8rem}
.eqlab{font-size:1.5rem;text-align:center}
.eqpair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;max-width:520px;margin:.5rem 0}
.eqpair>div{text-align:center}
.pies2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;text-align:center;max-width:460px;margin:0 auto}
.pies2 .who{font-weight:700;margin-bottom:.3rem}

.opts{display:grid;grid-template-columns:1fr;gap:.7rem}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:3px solid var(--ink);background:var(--surface);border-radius:12px;padding:.8rem 1rem;font-size:1.2rem;cursor:pointer;text-align:center;box-shadow:3px 3px 0 var(--ink);min-height:64px}
.opt .fr{font-size:1.15em}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.opt:disabled{cursor:default}

.ansrow{display:flex;gap:1.2rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:.35rem}
.fracin input,.numin,.mixw{width:5.2rem;text-align:center;font-size:1.8rem;font-weight:700;padding:.3rem;border:3px solid var(--ink);border-radius:10px;background:var(--bg)}
.numin{width:8rem}
.mixw{width:4.4rem;font-size:2.4rem}
.mixin{display:inline-flex;align-items:center;gap:.5rem}
.fbar{display:block;width:6rem;height:5px;background:var(--ink);border-radius:3px}
.wordin{width:min(100%,460px);font-size:1.5rem;padding:.5rem .8rem;border:3px solid var(--ink);border-radius:12px;background:var(--bg)}
.keys{display:flex;gap:.4rem;justify-content:center;margin-top:.5rem}
.key{border:2px solid var(--ink);background:var(--surface);border-radius:8px;min-width:2.6rem;padding:.2rem .5rem;font-size:1.2rem;font-weight:700;cursor:pointer}

/* ---------- cartes ---------- */
.deck{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;min-height:132px;align-items:center}
.slots{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;align-items:center;margin:1rem 0;padding:.8rem;border:3px dashed var(--line);border-radius:16px}
.slot{width:84px;height:118px;border:3px dashed var(--muted);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.sign-op{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.6rem;color:var(--accent);padding:0 .1rem}
.pcard{position:relative;width:84px;height:118px;border:3px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;font-size:1.7rem;padding:0;transition:transform .12s}
.pcard::before,.pcard::after{content:'◆';position:absolute;color:var(--accent);font-size:.8rem;line-height:1}
.pcard::before{top:6px;left:8px}
.pcard::after{bottom:6px;right:8px;transform:rotate(180deg)}
.pcard:hover:not(:disabled){transform:translateY(-4px)}
.pcard.sel{background:var(--accent);color:#000}
.pcard.sel::before,.pcard.sel::after{color:#000}
.pcard.good{border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.pcard.badc{border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.pcard:disabled{cursor:default}
.cardlab{text-align:center;font-weight:700;color:var(--muted);font-size:.95rem}

.tools{margin-top:1.1rem;display:flex;justify-content:flex-end}
.hint{margin-top:.8rem;border:2px dashed var(--accent);border-radius:12px;padding:.6rem .9rem;background:var(--accent-soft)}
.fb{margin-top:1rem;border:3px solid var(--ink);border-left-width:12px;border-radius:12px;padding:.4rem 1rem .9rem}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.warn{border-color:var(--accent);background:var(--accent-soft);padding:.6rem 1rem}
.fb .bot{margin:.4rem 0 .2rem}
.pts{display:inline-block;background:#000;color:var(--accent);border-radius:8px;padding:0 .45rem;font-size:.95rem;margin-left:.3rem}
.exp{margin:.4rem 0 .9rem;line-height:1.75}
.exp .fr{font-size:1.05em}
.mini{margin:.5rem 0}
.mini svg{max-width:340px}
.cmp{display:grid;gap:.7rem}
.cmp-row{display:grid;grid-template-columns:3.5rem 1fr;align-items:center;gap:.6rem}
.cmp-f{font-size:1.5rem;text-align:center}

/* ---------- revelació, porta, victòria ---------- */
.reveal{text-align:center;padding-top:1rem}
.reveal h2{font-size:clamp(2rem,7vw,3.2rem);margin:.4rem 0}
.biglock{width:120px;height:150px;margin:0 auto;display:block}
.biglock .shackle{transform-origin:78px 60px;transition:transform .6s cubic-bezier(.3,1.6,.5,1) .25s}
.biglock.open .shackle{transform:translateY(-16px) rotate(28deg)}
.bigdigit{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:8.5rem;line-height:1;width:1.4em;height:1.5em;display:grid;place-items:center;margin:1rem auto;background:#000;color:var(--accent);border-radius:24px;box-shadow:8px 8px 0 var(--accent)}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) .5s both}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.code{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;margin:1.2rem 0}
.code label{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:1.3rem}
.code input{width:3rem;height:3.8rem;text-align:center;font-size:2rem;font-weight:800;border:3px solid var(--ink);border-radius:12px;background:var(--surface)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.win h2{font-size:clamp(2.4rem,9vw,4.5rem);margin:.3rem 0}
.stars{font-size:3rem;letter-spacing:.2rem}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin:1.2rem 0;text-align:left}
.statgrid div{border:3px solid var(--ink);border-radius:12px;padding:.6rem .8rem;background:var(--surface)}
.statgrid b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:2rem}
.codebox{display:inline-block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.6rem,6.5vw,2.4rem);letter-spacing:.08em;background:#000;color:var(--accent);padding:.4rem 1rem;border-radius:14px;margin:.4rem 0}
.codepanel{margin-top:1rem;border:3px solid var(--ink);border-radius:14px;padding:1rem 1.2rem;background:var(--accent-soft);text-align:center}

/* ---------- tauler professor ---------- */
.tform{display:grid;grid-template-columns:1fr 1fr auto;gap:.7rem;align-items:end;margin:1rem 0}
@media (max-width:640px){.tform{grid-template-columns:1fr}}
.tform label{font-weight:700;font-size:.95rem}
.tform input{display:block;width:100%;margin-top:.3rem;padding:.6rem .8rem;border:3px solid var(--ink);border-radius:12px;background:var(--surface);font-size:1.1rem}
.tform input#tcode{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.twrap{overflow-x:auto;border:3px solid var(--ink);border-radius:14px;background:var(--surface);margin-top:1rem}
table.res{width:100%;border-collapse:collapse;font-size:1rem;min-width:620px}
table.res th,table.res td{padding:.55rem .7rem;text-align:left;border-bottom:2px solid var(--line);white-space:nowrap}
table.res th{background:#000;color:#fff}
table.res tr:last-child td{border-bottom:0}
.rm{background:none;border:0;cursor:pointer;font-size:1.1rem;color:var(--bad)}
textarea.csv{width:100%;min-height:8rem;margin-top:.6rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;border:2px solid var(--ink);border-radius:10px;padding:.5rem;background:var(--surface);color:var(--ink)}

/* ---------- pissarra ---------- */
.wb-fab{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;border:3px solid var(--ink);background:var(--accent);color:#000;border-radius:999px;padding:.6rem 1.1rem;font-weight:700;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.wb-fab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
body.wb-open .wb-fab{display:none}
.wb{position:fixed;z-index:45;top:0;right:0;bottom:0;width:min(560px,46vw);background:var(--surface);border-left:4px solid var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wb[hidden]{display:none}
.wb-bar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.5rem .6rem;border-bottom:3px solid var(--ink);background:var(--bg)}
.wb-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;margin-right:auto}
.wb-tool{border:2px solid var(--ink);background:var(--surface);border-radius:10px;min-width:46px;height:46px;font-size:1.15rem;cursor:pointer;font-weight:700;display:inline-grid;place-items:center;padding:0 .5rem}
.wb-tool.on{background:var(--accent);color:#000;box-shadow:inset 0 0 0 2px #000}
.wb-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);display:block}
.wb-q{display:none;padding:.4rem .8rem;border-bottom:2px solid var(--line);font-size:1rem;max-height:30vh;overflow:auto}
.wb-wrap{flex:1;position:relative;background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;touch-action:none;overflow:hidden}
.wb canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wb-foot{font-size:.85rem;padding:.3rem .8rem;border-top:2px solid var(--line)}
@media (min-width:901px){body.wb-open main{max-width:none;margin:0 calc(min(560px,46vw) + 1rem) 0 1rem}}
@media (max-width:900px){.wb{width:100%;border-left:0}.wb-q{display:block}}
main{padding-bottom:6rem}

/* ---------- accés i tauler ---------- */
.pin{letter-spacing:.4em;max-width:180px!important;text-align:center;font-weight:700}
.heat{display:inline-grid;place-items:center;width:1.9rem;height:1.6rem;border-radius:6px;font-size:.85rem;font-weight:700;border:1.5px solid var(--line)}
.heat.h0{color:var(--muted)}.heat.h1{background:var(--accent-soft)}.heat.h2{background:#ffb27a;color:#000}.heat.h3{background:var(--accent);color:#000}
.heat.open{outline:2px solid var(--ok);outline-offset:1px}
table.res tfoot td{background:var(--accent-soft);font-weight:700;border-top:3px solid var(--ink)}
.legend{font-size:.9rem;color:var(--muted);margin:.5rem 0}
textarea.bulk{width:100%;min-height:7rem;border:3px solid var(--ink);border-radius:12px;padding:.6rem;background:var(--surface);color:var(--ink);font:1rem ui-monospace,Menlo,Consolas,monospace}

/* ---------- robot animat ---------- */
.robot .rb-all{animation:rbFloat 3.2s ease-in-out infinite}
@keyframes rbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.robot .rb-eyes{transform-box:fill-box;transform-origin:center;animation:rbBlink 4.2s infinite}
@keyframes rbBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.robot .rb-bulb{animation:rbGlow 1.6s ease-in-out infinite}
@keyframes rbGlow{0%,100%{opacity:1}50%{opacity:.3}}
.robot.talking .rb-mouth{transform-box:fill-box;transform-origin:center;animation:rbTalk .16s ease-in-out infinite alternate}
@keyframes rbTalk{from{transform:scale(1,1)}to{transform:scale(.8,.25)}}
.robot .rb-armR{transform-box:view-box;transform-origin:72px 88px}
.robot.mood-wave .rb-armR{animation:rbWave .45s ease-in-out 6 alternate}
@keyframes rbWave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.robot.mood-happy .rb-all,.robot.mood-wow .rb-all{animation:rbHop .5s ease-out 2,rbFloat 3.2s ease-in-out 1s infinite}
@keyframes rbHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.robot.mood-happy .rb-armL,.robot.mood-wow .rb-armL{transform-box:view-box;transform-origin:28px 88px;animation:rbArmUp .5s ease-out 2 alternate}
.robot.mood-happy .rb-armR,.robot.mood-wow .rb-armR{animation:rbArmUpR .5s ease-out 2 alternate}
@keyframes rbArmUp{to{transform:rotate(60deg)}}
@keyframes rbArmUpR{to{transform:rotate(-60deg)}}
.robot .rb-spark{transform-box:fill-box;transform-origin:center;animation:rbSpark .9s ease-out 2 both}
.robot .rb-spark.s2{animation-delay:.2s}.robot .rb-spark.s3{animation-delay:.4s}
@keyframes rbSpark{0%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(.5) rotate(90deg);opacity:0}}
.robot.mood-oops .rb-headg{transform-box:view-box;transform-origin:50px 60px;animation:rbShake .45s ease-in-out 2}
@keyframes rbShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.robot .rb-sweat{animation:rbSweat 1.3s ease-in 2 both}
@keyframes rbSweat{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.robot.mood-think .rb-eyes{animation:rbLook 2.4s ease-in-out infinite}
@keyframes rbLook{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.robot .rb-dot{animation:rbDots 1.2s infinite}.robot .rb-dot.d2{animation-delay:.2s}.robot .rb-dot.d3{animation-delay:.4s}
@keyframes rbDots{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.robot *{animation:none!important}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.pop,.shake,.robot,.robot .rb-bulb{animation:none!important}.biglock .shackle{transition:none}}
@media (max-width:520px){body{font-size:18px}.prompt{font-size:1.25rem}.bigdigit{font-size:6.5rem}.pcard,.slot{width:70px;height:100px;font-size:1.45rem}}
</style>

<body>
<header class="top"><div class="top-in"><button class="brand" data-act="home" aria-label="Inici" id="brand"></button><div class="stats" id="stats"></div></div>
<div class="tape" aria-hidden="true"></div></header>
<main id="app"></main>
<canvas id="confetti"></canvas>
<script>
/* =========================================================
   UTILITATS
   ========================================================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const simp=(n,d)=>{const g=gcd(n,d)||1;return [n/g,d/g];};
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MIX=(w,n,d)=>`<span class="mix"><b>${w}</b>${F(n,d)}</span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function simpNote(n,d){const [x,y]=simp(n,d);if(y===1)return ` = <b>${x}</b>`;if(x!==n)return ` = ${F(x,y)} <span class="muted">(simplificada)</span>`;return '';}
function coprime(bmin,bmax,improper){let a,b;do{b=rnd(bmin,bmax);a=rnd(1,improper?b+3:b-1);}while(gcd(a,b)!==1||a===b);return [a,b];}
const fmtDec=x=>String(+x.toFixed(6)).replace('.',',');
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* noms interculturals: pakistanesos, marroquins, catalans, espanyols, romanesos i xinesos */
const PEOPLE=[
  ['Ayesha','f'],['Hamza','m'],['Zainab','f'],['Bilal','m'],['Hira','f'],['Usman','m'],
  ['Yassin','m'],['Salma','f'],['Imane','f'],['Ayoub','m'],['Nour','f'],['Youssef','m'],
  ['Pol','m'],['Laia','f'],['Jordi','m'],['Núria','f'],['Arnau','m'],['Mireia','f'],
  ['Lucía','f'],['Pablo','m'],['Sergio','m'],['Carmen','f'],['Álvaro','m'],['Marta','f'],
  ['Andrei','m'],['Ioana','f'],['Mihai','m'],['Elena','f'],['Bogdan','m'],['Alina','f'],
  ['Wei','m'],['Mei','f'],['Hao','m'],['Lin','f'],['Jun','m'],['Yan','f']];
const art=([n,g])=>/^[AÀÁEÉÈIÍOÓÒUÚH]/i.test(n)?`l'${n}`:(g==='m'?`en ${n}`:`la ${n}`);
const Art=p=>{const s=art(p);return s[0].toUpperCase()+s.slice(1);};
const people=k=>shuffle(PEOPLE).slice(0,k);

/* =========================================================
   NOMS EN CATALÀ (dossier pàg. 3)
   ========================================================= */
const NUM=['zero','un','dos','tres','quatre','cinc','sis','set','vuit','nou','deu','onze','dotze','tretze','catorze','quinze','setze','disset','divuit','dinou','vint'];
const DEN={2:['mig','mitjos'],3:['terç','terços'],4:['quart','quarts'],5:['cinquè','cinquens'],6:['sisè','sisens'],7:['setè','setens'],8:['vuitè','vuitens'],9:['novè','novens'],10:['desè','desens'],
  11:['onzè','onzens'],12:['dotzè','dotzens'],13:['tretzè','tretzens'],14:['catorzè','catorzens'],15:['quinzè','quinzens'],16:['setzè','setzens'],17:['dissetè','dissetens'],18:['divuitè','divuitens'],19:['dinovè','dinovens']};
const CAST={2:'medios',3:'tercios',4:'cuartos',5:'quintos',6:'sextos',7:'séptimos',8:'octavos',9:'novenos',10:'décimos'};
const nameF=(n,d)=>`${NUM[n]} ${DEN[d][n===1?0:1]}`;
const normW=s=>String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[-.,;:!?«»"]/g,' ').replace(/\s+/g,' ').trim();
function acceptedNames(n,d){const s=[nameF(n,d)];if(n===1){s.push('u '+DEN[d][0]);if(d===2)s.push('la meitat','meitat','mig');}return s.map(normW);}
function checkWords(n,d,input){const v=normW(input),acc=acceptedNames(n,d);
  if(acc.includes(v))return {ok:true};
  if(acc.map(strip).includes(strip(v)))return {ok:true,msg:`Correcte! Però compte amb els accents: s'escriu <b>«${nameF(n,d)}»</b>.`};
  const sv=strip(v);let m='';
  if(/cuart|terci|quint|sext|septim|octav|decimo|medio|avo/.test(sv))m='Això és castellà! 😉';
  else if(/^dues /.test(sv))m='El numerador va en masculí: «dos», no «dues».';
  else if(n>1&&sv===strip(normW(NUM[n]+' '+DEN[d][0])))m='Quan el numerador és més gran que 1, el denominador va en <b>plural</b>.';
  else if(n===1&&sv===strip(normW('un '+DEN[d][1])))m='Quan el numerador és 1, el denominador va en <b>singular</b>.';
  return {ok:false,msg:(m?m+'<br>':'')+`La teva resposta: «${esc(input)}»`};}

/* =========================================================
   FIGURES SVG
   ========================================================= */
function pieOne(d,k,cx,cy,r,inter,u){
  if(d===1)return `<circle cx="${cx}" cy="${cy}" r="${r}" class="seg ${k>=1?'on':''}" ${inter?`data-i="${u}"`:''}/>`;
  let s='';for(let i=0;i<d;i++){const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" class="seg ${i<k?'on':''}" ${inter?`data-i="${u*d+i}"`:''}/>`;}
  return s;}
function piesSVG(d,n,inter=false,units){units=units||Math.max(1,Math.ceil(n/d));const r=60,g=22,w=units*2*r+(units-1)*g+8,h=2*r+8;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="fig ${inter?'interactive':''}" style="width:min(100%,${units*170}px)" role="img" aria-label="cercles dividits en ${d} parts">`;
  for(let u=0;u<units;u++){const k=inter?0:Math.max(0,Math.min(d,n-u*d));s+=pieOne(d,k,4+r+u*(2*r+g),4+r,r,inter,u);}
  return s+'</svg>';}
function barsSVG(d,n,inter=false,units){units=units||Math.max(1,Math.ceil(n/d));const W=360,H=48,g=14,h=units*H+(units-1)*g+6,sw=W/d;
  let s=`<svg viewBox="0 0 ${W+6} ${h}" class="fig ${inter?'interactive':''}" style="width:min(100%,480px)" role="img" aria-label="barra dividida en ${d} parts">`;
  for(let u=0;u<units;u++){const y=3+u*(H+g),k=inter?0:Math.max(0,Math.min(d,n-u*d));
    for(let i=0;i<d;i++)s+=`<rect x="${(3+i*sw).toFixed(2)}" y="${y}" width="${sw.toFixed(2)}" height="${H}" class="seg ${i<k?'on':''}" ${inter?`data-i="${u*d+i}"`:''}/>`;}
  return s+'</svg>';}
/* rectangle de cols×rows; es pinta per columnes (com al dossier pàg. 10) o amb una llista d'índexs */
function rectSVG(cols,rows,on,inter=false,maxw=360){const W=300,H=170,cw=W/cols,ch=H/rows;
  let s=`<svg viewBox="0 0 ${W+8} ${H+8}" class="fig ${inter?'interactive':''}" style="width:min(100%,${maxw}px)" role="img" aria-label="rectangle dividit en ${cols*rows} parts">`;
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){const i=c*rows+r,p=inter?false:(Array.isArray(on)?on.includes(i):i<on);
    s+=`<rect x="${(4+c*cw).toFixed(2)}" y="${(4+r*ch).toFixed(2)}" width="${cw.toFixed(2)}" height="${ch.toFixed(2)}" class="seg ${p?'on':''}" ${inter?`data-i="${i}"`:''}/>`;}
  s+=`<rect x="4" y="4" width="${W}" height="${H}" class="outline"/>`;
  return s+'</svg>';}
function barCustom(w,p){const W=360,H=60,T=w.reduce((a,b)=>a+b,0);let x=3,s=`<svg viewBox="0 0 ${W+6} ${H+6}" class="fig" style="width:min(100%,480px)" role="img" aria-label="barra">`;
  w.forEach((v,i)=>{const ww=W*v/T;s+=`<rect x="${x.toFixed(2)}" y="3" width="${ww.toFixed(2)}" height="${H}" class="seg ${i===p?'on':''}"/>`;x+=ww;});return s+'</svg>';}
function lineSVG(d,U,opt={}){const W=600,x0=30,x1=570,tot=U*d,step=(x1-x0)/tot;
  let s=`<svg viewBox="0 0 ${W} 112" class="fig ${opt.mark==null?'interactive':''}" style="width:100%;max-width:640px" data-x0="${x0}" data-step="${step}" role="img" aria-label="recta numèrica">`;
  s+=`<line x1="${x0}" y1="52" x2="${x1}" y2="52" class="axis"/>`;
  for(let i=0;i<=tot;i++){const x=x0+i*step,big=i%d===0;s+=`<line x1="${x}" y1="${big?32:42}" x2="${x}" y2="${big?72:62}" class="tick ${big?'big':''}"/>`;if(big)s+=`<text x="${x}" y="102" class="lbl">${i/d}</text>`;}
  if(opt.mark!=null)s+=`<path transform="translate(${x0+opt.mark*step},40)" d="M0,0 L-12,-22 L12,-22 Z" class="mk"/>`;
  else{for(let i=1;i<tot;i++){const x=x0+i*step;s+=`<rect x="${x-step/2}" y="6" width="${step}" height="80" class="hit" data-i="${i}"/>`;}
    s+=`<path class="mk marker" d="M0,0 L-12,-22 L12,-22 Z" style="display:none"/><circle class="mk-ok okmark" r="10" cy="52" style="display:none"/>`;}
  return s+'</svg>';}
function padlock(open=false,cls='c-lock'){return `<svg viewBox="0 0 100 120" class="${cls} ${open?'open':''}" aria-hidden="true">
  <g class="shackle"><path d="M28 58 V38 a22 22 0 0 1 44 0 V${open?44:58}" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></g>
  <rect x="12" y="54" width="76" height="60" rx="12" fill="var(--accent)" stroke="currentColor" stroke-width="6"/>
  <circle cx="50" cy="79" r="8" fill="currentColor"/><rect x="46" y="82" width="8" height="18" rx="3" fill="currentColor"/></svg>`;}

/* =========================================================
   ROBOT FR-4C
   ========================================================= */
function robot(mood='idle',size=76){
  let eyes,mouth,extra='';
  if(mood==='happy'){eyes=`<path d="M31 47 q7 -9 14 0" class="rb-l"/><path d="M55 47 q7 -9 14 0" class="rb-l"/>`;mouth=`<path d="M38 56 q12 11 24 0" class="rb-l"/>`;}
  else if(mood==='oops'){eyes=`<circle cx="38" cy="46" r="4.5" class="rb-eye"/><circle cx="62" cy="46" r="4.5" class="rb-eye"/><path d="M31 37 l11 3" class="rb-l"/><path d="M69 37 l-11 3" class="rb-l"/>`;mouth=`<path d="M39 60 q5 -5 11 0 t11 0" class="rb-l"/>`;
    extra=`<g transform="translate(92 22)"><path class="rb-sweat" d="M0 0 C-5 7 -5 11 0 11 C5 11 5 7 0 0Z" fill="#59b8ff" stroke="var(--ink)" stroke-width="2"/></g>`;}
  else if(mood==='think'){eyes=`<circle cx="40" cy="42" r="5" class="rb-eye"/><circle cx="64" cy="42" r="5" class="rb-eye"/>`;mouth=`<path d="M42 58 h14" class="rb-l"/>`;
    extra=`<circle class="rb-dot" cx="96" cy="14" r="3" fill="var(--ink)"/><circle class="rb-dot d2" cx="104" cy="7" r="3.5" fill="var(--ink)"/><circle class="rb-dot d3" cx="113" cy="0" r="4" fill="var(--ink)"/>`;}
  else if(mood==='wow'){eyes=`<circle cx="38" cy="45" r="7" class="rb-eye"/><circle cx="62" cy="45" r="7" class="rb-eye"/>`;mouth=`<circle cx="50" cy="59" r="4.5" class="rb-l"/>`;}
  else{eyes=`<circle cx="38" cy="45" r="5.5" class="rb-eye"/><circle cx="62" cy="45" r="5.5" class="rb-eye"/>`;mouth=`<path d="M41 57 q9 5 18 0" class="rb-l"/>`;}
  if(mood==='happy'||mood==='wow'){const st='M0-7L2-2 7 0 2 2 0 7-2 2-7 0-2-2Z';
    extra=`<g transform="translate(4 20)"><path class="rb-spark" d="${st}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></g><g transform="translate(98 16)"><path class="rb-spark s2" d="${st}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></g><g transform="translate(102 70)"><path class="rb-spark s3" d="${st}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></g>`;}
  const armR=mood==='wave'?`<path d="M72 88 L86 70" class="rb-arm"/><circle cx="87" cy="68" r="5" class="rb-hand"/>`:`<path d="M72 88 L84 100" class="rb-arm"/><circle cx="85" cy="101" r="5" class="rb-hand"/>`;
  return `<svg class="robot mood-${mood}" width="${size}" height="${size*1.1}" viewBox="-10 -8 128 126" aria-hidden="true"><g class="rb-all">
  <line x1="50" y1="10" x2="50" y2="22" class="rb-ink"/><circle cx="50" cy="8" r="6" class="rb-bulb"/>
  <g class="rb-armL"><path d="M28 88 L16 100" class="rb-arm"/><circle cx="15" cy="101" r="5" class="rb-hand"/></g><g class="rb-armR">${armR}</g>
  <rect x="30" y="82" width="40" height="26" rx="8" class="rb-body"/><text x="50" y="100" class="rb-txt">FR-4C</text>
  <g class="rb-headg"><rect x="6" y="38" width="10" height="20" rx="4" class="rb-head"/><rect x="84" y="38" width="10" height="20" rx="4" class="rb-head"/>
  <rect x="14" y="22" width="72" height="56" rx="16" class="rb-head"/><rect x="22" y="30" width="56" height="40" rx="10" class="rb-screen"/>
  <g class="rb-eyes">${eyes}</g><g class="rb-mouth">${mouth}</g></g>${extra}</g></svg>`;}
function botSay(mood,text,size=76,cls=''){return `<div class="bot ${cls}"><div class="bot-av">${robot(mood,size)}</div><div class="say"><b class="who">FR-4C</b><span class="txt">${text}</span></div></div>`;}
const RM=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function typeAll(root){if(RM())return;root.querySelectorAll('.say .txt:not([data-typed])').forEach(el=>{el.dataset.typed='1';
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];let n;while((n=w.nextNode()))nodes.push([n,n.nodeValue]);
  const total=nodes.reduce((a,[,t])=>a+t.length,0);if(!total)return;nodes.forEach(([nd])=>nd.nodeValue='');
  const rb=el.closest('.bot')&&el.closest('.bot').querySelector('.robot');if(rb)rb.classList.add('talking');
  const step=Math.max(1,Math.ceil(total/65));let shown=0;
  const iv=setInterval(()=>{shown+=step;let left=shown;for(const [nd,t] of nodes){nd.nodeValue=t.slice(0,Math.max(0,Math.min(t.length,left)));left-=t.length;}
    if(shown>=total){clearInterval(iv);if(rb)rb.classList.remove('talking');}},18);});}

/* =========================================================
   CONSTRUCTORS DE PREGUNTES
   ========================================================= */
function mc(prompt,correct,distr,extra={}){const opts=shuffle([correct,...distr.slice(0,3)]);return Object.assign({kind:'mc',prompt,options:opts,correct:opts.indexOf(correct)},extra);}
function uniqFr(correct,cands,n=3){const seen=new Set([correct.join('/')]);const out=[];for(const p of shuffle(cands)){if(!p||p[1]<2||p[0]<1)continue;const k=p.join('/');if(seen.has(k))continue;seen.add(k);out.push(F(p[0],p[1]));if(out.length===n)break;}return out;}
const RECT={4:[[2,2]],6:[[3,2],[2,3]],8:[[4,2]],9:[[3,3]],10:[[5,2]],12:[[4,3],[3,4]],15:[[5,3]],16:[[4,4]]};
const rectDims=d=>RECT[d]?pick(RECT[d]):[d,1];
function figStatic(kind,d,n){if(kind==='pie')return piesSVG(d,n);if(kind==='rect'){const [c,r]=rectDims(d);return rectSVG(c,r,shuffle([...Array(d).keys()]).slice(0,n));}return barsSVG(d,n);}

/* ---------- SALA 1 · La capsa d'en Joan (pàg. 3–4) ---------- */
function s1_painted(){const kind=pick(['pie','bar','rect']);const d=kind==='rect'?pick([6,8,9,10,12,15,16]):rnd(3,10);const n=rnd(1,d-1);

    hint:'Compta totes les parts (va a baix) i després les pintades (va a dalt).',
    explain:`La unitat està dividida en <b>${d}</b> parts iguals → denominador ${d}. N'hi ha <b>${n}</b> de pintades → numerador ${n}.<br>És ${F(n,d)}, «${nameF(n,d)}».`};}

  if(v===1)return {kind:'num',prompt:`Quin és el <b>numerador</b> de ${F(n,d)}?`,ans:n,hint:'El numerador és el nombre de dalt.',explain:`El numerador és el de dalt: <b>${n}</b>. Indica quantes parts agafem de la unitat.`};
  if(v===2)return mc(`A la fracció ${F(n,d)}, què ens diu el <b>${n}</b>?`,'Quantes parts agafem de la unitat',['En quantes parts iguals es divideix la unitat','Quantes unitats tenim','Quantes parts sobren'],{hint:'És a dalt o a baix?',explain:`El ${n} és el <b>numerador</b>: el nombre de parts que agafem.`});
  return mc(`A la fracció ${F(n,d)}, què ens diu el <b>${d}</b>?`,'En quantes parts iguals es divideix la unitat',['Quantes parts agafem de la unitat','Quantes unitats tenim','Quantes parts sobren'],{hint:'És a dalt o a baix?',explain:`El ${d} és el <b>denominador</b>: el nombre de parts iguals en què es divideix la unitat.`});}
function s1_equal(){const d=pick([3,4,5]);const eq=Math.random()<.45;let w;

    hint:'Fixa\'t en la mida de cada tros.',explain:eq?`Les ${d} parts són iguals, així que la pintada és ${F(1,d)}.`:`Una fracció representa parts <b>IGUALS</b> de la unitat. Aquí els trossos tenen mides diferents, per tant la part pintada <b>no</b> és ${F(1,d)}.`};}

function terminates(n,d){let [,y]=simp(n,d);while(y%2===0)y/=2;while(y%5===0)y/=5;return y===1;}
function s3_decimal(){let n,d;do{d=pick([2,4,5,8,10,15,20]);n=rnd(1,d+6);}while(!terminates(n,d)||n%d===0);
  return {kind:'dec',prompt:`Troba l'expressió decimal de ${F(n,d)}`,ans:n/d,hint:`Divideix el numerador entre el denominador: ${n} : ${d}. Fes servir la coma.`,explain:`Una fracció també és una divisió: ${F(n,d)} = ${n} : ${d} = <b>${fmtDec(n/d)}</b>`};}
const SHARE=[

function s3_share(){const [a,b,t]=pick(SHARE);

function s3_ofq(){const C=[
  ()=>{const a=rnd(1,3);return {t:`🕐 Quants minuts són ${F(a,4)} d'hora?`,a,b:4,q:60,u:'minuts'};},
  ()=>{const b=pick([2,4,5,10]),a=rnd(1,b-1);const [P]=people(1);return {t:`💶 ${Art(P)} té 20 € de paga i en gasta ${F(a,b)} al cine. Quants euros gasta?`,a,b,q:20,u:'€'};},
  ()=>{const b=pick([2,4,5,10]),a=rnd(1,b-1),q=pick([100,200,400]),[P]=people(1);return {t:`🏃 ${Art(P)} ha de fer una cursa de ${q} m. Ja n'ha recorregut ${F(a,b)}. Quants metres ha recorregut?`,a,b,q,u:'m'};},
  ()=>{const b=pick([2,3,4,6]),a=rnd(1,b-1),q=b*rnd(2,4);return {t:`🍪 Una capsa té ${q} galetes i ${F(a,b)} són de xocolata. Quantes galetes de xocolata hi ha?`,a,b,q,u:'galetes'};},
  ()=>{const b=pick([2,3,4,5]),a=rnd(1,b-1),q=b*rnd(5,6);return {t:`🚶 A la classe hi ha ${q} alumnes i ${F(a,b)} vénen caminant. Quants alumnes vénen caminant?`,a,b,q,u:'alumnes'};},
  ()=>{const b=pick([2,4,5,10]),a=rnd(1,b-1);return {t:`🥛 Un cartró de llet té 1000 ml. Si te'n beus ${F(a,b)}, quants ml t'has begut?`,a,b,q:1000,u:'ml'};},
  ()=>{const b=pick([2,3,4]),a=rnd(1,b-1);return {t:`📱 El mòbil té 24 hores de bateria i en gastes ${F(a,b)} jugant. Quantes hores has jugat?`,a,b,q:24,u:'hores'};}];
  const c=pick(C)(),r=c.a*c.q/c.b;

/* ---------- SALA 4 · Pròpies o impròpies? (pàg. 7–8) ---------- */
function s4_class(){const t=rnd(0,2);let n,d;
  if(t===0){d=rnd(3,12);n=rnd(1,d-1);}else if(t===1){d=rnd(2,9);n=rnd(d+1,Math.min(2*d+3,3*d-1));if(n%d===0)n++;}else{d=rnd(2,12);n=d;}
  const why=[`${n} &lt; ${d}: el numerador és més petit → <b>pròpia</b>. ${F(n,d)} = ${fmtDec(n/d)} &lt; 1`,`${n} &gt; ${d}: el numerador és més gran → <b>impròpia</b>. ${F(n,d)} = ${fmtDec(+(n/d).toFixed(3))} &gt; 1`,`${n} = ${d}: numerador i denominador iguals → <b>igual a la unitat</b>. ${F(n,d)} = 1`];
  return {kind:'mc',prompt:`Quin tipus de fracció és ${F(n,d)}?`,options:['Pròpia (menys que 1)','Impròpia (més que 1)','Igual a la unitat'],correct:t,
    hint:'Compara el numerador amb el denominador.',explain:why[t]+`<div class="mini">${piesSVG(d,n)}</div>`};}
function s4_pick(){const want=Math.random()<.5?'pròpies':'impròpies';let items;
  do{items=[];const seen=new Set();while(items.length<6){const d=rnd(2,9),n=rnd(1,2*d+2);if(n===d)continue;const k=n+'/'+d;if(seen.has(k))continue;seen.add(k);items.push([n,d]);}}
  while(!items.some(([n,d])=>n<d)||!items.some(([n,d])=>n>d));
  const set=items.map(([n,d],i)=>(want==='pròpies'?n<d:n>d)?i:-1).filter(i=>i>=0);
  return {kind:'pick',items,want:set,prompt:`Toca <b>totes</b> les cartes amb fraccions <b>${want}</b>.`,hint:want==='pròpies'?'Pròpia: numerador MÉS PETIT que el denominador.':'Impròpia: numerador MÉS GRAN que el denominador.',
    explain:`Són ${want}: ${set.map(i=>F(...items[i])).join(' ')}<br>${want==='pròpies'?'Numerador &lt; denominador → valen menys que 1.':'Numerador &gt; denominador → valen més que 1.'}`};}
function s4_toMixed(){const d=rnd(2,8);let n;do{n=rnd(d+1,4*d-1);}while(n%d===0);const w=Math.floor(n/d),r=n%d;

    explain:`${n} : ${d} = ${w} i sobren ${r}.<br>${F(n,d)} = ${w>1?F(w*d,d)+' + ':F(d,d)+' + '}${F(r,d)} = ${w} + ${F(r,d)} = ${MIX(w,r,d)}`};}

function eqBase(){let a,b,k;do{[a,b]=coprime(2,6,false);k=rnd(2,4);}while(b*k>24);return [a,b,k];}

    ref:`<div class="eqref"><div class="eqlab">${F(a,b)}</div>${rectSVG(b,1,a)}</div><div class="cardlab">⬇️ Pinta aquí la mateixa quantitat (${F('?',b*k)})</div>`,
    prompt:`Pinta a la figura de baix <b>la mateixa quantitat</b> que a la de dalt.`,hint:`Cada columna de dalt ara està partida en ${k} trossos. Pinta les mateixes columnes senceres!`,
    explain:`<div class="eqpair"><div>${F(a,b)}${rectSVG(b,1,a)}</div><div>${F(a*k,b*k)}${rectSVG(b,k,a*k)}</div></div>Ocupen el mateix espai: són <b>equivalents</b>.<br>${F(a,b)} → ${F(a+' · '+k,b+' · '+k)} = ${F(a*k,b*k)} (hem <b>amplificat</b> per ${k}).`};}
function s6_eqCheck(){const [a,b,k]=eqBase();const eq=Math.random()<.5;const d=b*k;let c=a*k;if(!eq){do{c=rnd(1,d-1);}while(c===a*k);}
  return {kind:'mc',prompt:`Són equivalents ${F(a,b)} i ${F(c,d)}? Mira les figures.`,visual:`<div class="eqpair"><div>${F(a,b)}${rectSVG(b,1,a)}</div><div>${F(c,d)}${rectSVG(b,k,c)}</div></div>`,
    options:['Sí, són equivalents','No, no són equivalents'],correct:eq?0:1,hint:'Ocupen la mateixa quantitat de figura? També pots multiplicar en creu.',
    explain:`Multipliquem en creu: ${a} · ${d} = <b>${a*d}</b> i ${b} · ${c} = <b>${b*c}</b>. ${eq?'Surt el mateix → <b>són equivalents</b>.':'Surt diferent → <b>no</b> són equivalents.'}`};}
function s6_missing(){const [a,b,k]=eqBase();
  if(Math.random()<.65)return {kind:'num',prompt:`Completa perquè siguin equivalents: ${F(a,b)} = ${F('?',b*k)}`,visual:`<div class="eqpair"><div>${F(a,b)}${rectSVG(b,1,a)}</div><div>${F('?',b*k)}${rectSVG(b,k,0)}</div></div>`,
    ans:a*k,hint:`${b} · ? = ${b*k}. Multiplica el numerador pel mateix nombre.`,explain:`${b} · <b>${k}</b> = ${b*k}, per tant ${a} · <b>${k}</b> = <b>${a*k}</b>.<br>${F(a,b)} = ${F(a*k,b*k)}<div class="mini">${rectSVG(b,k,a*k)}</div>`};
  return {kind:'num',prompt:`Completa perquè siguin equivalents: ${F(a*k,b*k)} = ${F(a,'?')}`,ans:b,hint:`Per quin nombre has dividit ${a*k} per obtenir ${a}? Fes el mateix a baix.`,
    explain:`${a*k} : <b>${k}</b> = ${a}, per tant ${b*k} : <b>${k}</b> = <b>${b}</b> (hem <b>simplificat</b>).`};}
function s6_pick(){const [a,b]=coprime(2,7,false),k=rnd(2,5);
  const cands=[[a+k,b+k],[k*a,b],[a,k*b],[k*a+1,k*b],[k*a,k*b+1],[a+1,b+1]].filter(([x,y])=>x*b!==a*y);
  return mc(`Quina fracció és <b>equivalent</b> a ${F(a,b)}?`,F(k*a,k*b),uniqFr([k*a,k*b],cands),{hint:'Busca la que s\'obté multiplicant dalt i baix pel mateix nombre.',
    explain:`${F(a,b)} = ${F(a+' · '+k,b+' · '+k)} = ${F(k*a,k*b)}. <br>⚠️ Sumar el mateix nombre a dalt i a baix <b>no</b> dona una fracció equivalent.${b*k<=24?`<div class="eqpair"><div>${rectSVG(b,1,a)}</div><div>${rectSVG(b,k,a*k)}</div></div>`:''}`});}
function s6_simplify(){let a,b,k;do{[a,b]=coprime(2,6,false);k=rnd(2,4);}while(b*k>24);const n=a*k,d=b*k;
  return {kind:'frac',prompt:`<b>Simplifica</b> fins que no es pugui més: ${F(n,d)}`,ans:[a,b],
    check:(x,y)=>{if(x===a&&y===b)return {ok:true};if(x*d===n*y)return {ok:false,msg:`${F(x,y)} és equivalent, però encara es pot simplificar més!`};return {ok:false};},
    hint:`Divideix ${n} i ${d} pel mateix nombre (prova 2, 3, 5...).`,
    explain:`${F(n,d)} → ${F(n+' : '+k,d+' : '+k)} = <b>${F(a,b)}</b><div class="eqpair"><div>${rectSVG(b,k,n)}</div><div>${rectSVG(b,1,a)}</div></div>Mateixa quantitat, menys trossos.`};}

/* ---------- SALA 7 · La partida de cartes (pàg. 11–12) ---------- */
function s7_cards(){const N=rnd(4,5),asc=Math.random()<.5,v=rnd(0,2);let cards=[];const seen=new Set();
  const add=(n,d)=>{const k=(n/d).toFixed(9);if(seen.has(k))return;seen.add(k);cards.push([n,d]);};
  let g=0;const dd=rnd(6,12),nn=rnd(1,3);
  while(cards.length<N&&g++<999){if(v===0)add(rnd(1,dd+1),dd);else if(v===1){const d=rnd(nn+1,12);add(nn,d);}else{const d=pick([2,3,4,5,6,8,10,12]);add(rnd(1,d),d);}}
  const order=cards.map((c,i)=>i).sort((i,j)=>asc?cards[i][0]/cards[i][1]-cards[j][0]/cards[j][1]:cards[j][0]/cards[j][1]-cards[i][0]/cards[i][1]);
  const sign=asc?'&lt;':'&gt;';let m=cards.reduce((a,[,d])=>lcm(a,d),1);
  const how=v===0?'Tenen el <b>mateix denominador</b>: només cal comparar els numeradors.':v===1?'Tenen el <b>mateix numerador</b>: com més parts es fa la unitat, més petit és cada tros. És més gran la de denominador més petit.':
    (m<=60?`Busquem fraccions equivalents amb el <b>mateix denominador</b> (${m}) i comparem numeradors:<br>${cards.map(([n,d])=>`${F(n,d)} = ${F(n*m/d,m)}`).join(' &nbsp; ')}`:'Les passem a decimal i les comparem.');
  return {kind:'cards',cards,order,asc,prompt:`Ordena les cartes de <b>${asc?'més petita a més gran':'més gran a més petita'}</b>. Toca-les per ordre.`,hint:v===0?'Mateix denominador → mira els numeradors.':v===1?'Mateix numerador → com més gran el denominador, més petita la fracció.':'Busca un denominador comú, o fes les divisions.',
    explain:`${how}<br>Ordre correcte: ${order.map(i=>F(...cards[i])).join(` ${sign} `)}`};}
function s7_compare(){let a,b,c,d;const t=rnd(0,2);
  if(t===0){b=d=rnd(4,10);a=rnd(1,b-1);do{c=rnd(1,d-1);}while(c===a);}
  else if(t===1){a=c=rnd(1,4);b=rnd(a+1,10);do{d=rnd(c+1,10);}while(d===b);}
  else{b=rnd(2,8);a=rnd(1,b-1);if(Math.random()<.3){const k=rnd(2,3);c=a*k;d=b*k;}else{d=rnd(2,10);c=rnd(1,d-1);}if(d===b&&c===a){d=b+1;c=rnd(1,d-1);}}
  const L=a*d,R=c*b,ci=L>R?0:L<R?1:2;
  const ex=t===0?'Mateix denominador: és més gran la de numerador més gran.':t===1?'Mateix numerador: com més trossos, més petits. És més gran la de denominador més petit.':`Multipliquem en creu: ${a} · ${d} = <b>${L}</b> i ${c} · ${b} = <b>${R}</b>.${ci===2?' Són iguals: són equivalents!':''}`;
  return {kind:'mc',prompt:'Quin signe hi va? Fixa\'t en les barres.',visual:`<div class="cmp"><div class="cmp-row"><div class="cmp-f">${F(a,b)}</div>${barsSVG(b,a)}</div><div class="cmp-row"><div class="cmp-f">${F(c,d)}</div>${barsSVG(d,c)}</div></div>`,
    options:[`${F(a,b)} &gt; ${F(c,d)}`,`${F(a,b)} &lt; ${F(c,d)}`,`${F(a,b)} = ${F(c,d)}`],correct:ci,hint:'Compara quanta barra taronja hi ha a cada fila.',explain:ex};}

function s7_who(){const [P,Q]=shuffle(PEOPLE).slice(0,2);const W=pick([['de pizza','ha menjat'],['de la seva rajola de xocolata','ha menjat'],['del seu llibre','ha llegit'],['de la seva ampolla d\'aigua','ha begut']]);
  let a,b,c,d;do{b=pick([2,3,4,5,6,8]);d=pick([2,3,4,5,6,8]);a=rnd(1,b-1);c=rnd(1,d-1);}while(b===d&&a===c);
  const L=a*d,R=c*b,ci=L>R?0:L<R?1:2;const verb=W[1];
  return {kind:'mc',prompt:`${Art(P)} ${verb} ${F(a,b)} ${W[0]} i ${art(Q)}, ${F(c,d)}. Qui n'${verb} més?`,
    visual:`<div class="pies2"><div><div class="who">${P[0]}</div>${piesSVG(b,a)}</div><div><div class="who">${Q[0]}</div>${piesSVG(d,c)}</div></div>`,
    options:[Art(P),Art(Q),P[1]==='f'&&Q[1]==='f'?'Totes dues igual':'Tots dos igual'],correct:ci,hint:'Mira els dibuixos, o busca fraccions amb el mateix denominador.',
    explain:`Mateix denominador: ${F(a,b)} = ${F(a*lcm(b,d)/b,lcm(b,d))} i ${F(c,d)} = ${F(c*lcm(b,d)/d,lcm(b,d))}. ${ci===2?'Són iguals!':`N'${verb} més <b>${ci===0?art(P):art(Q)}</b>.`}`};}

/* ---------- SALA 8 · Suma i resta (pàg. 13–14) ---------- */
function opEx(a1,d1,a2,d2,plus){const op=plus?'+':'−';
  if(d1===d2){const n=plus?a1+a2:a1-a2;return {n,d:d1,html:`Mateix denominador: ${plus?'se sumen':'es resten'} els numeradors i es manté el denominador.<br>${F(a1,d1)} ${op} ${F(a2,d2)} = ${F(a1+' '+op+' '+a2,d1)} = ${F(n,d1)}${simpNote(n,d1)}`};}
  const m=lcm(d1,d2),e1=a1*m/d1,e2=a2*m/d2,n=plus?e1+e2:e1-e2;
  return {n,d:m,html:`<b>1r</b> m.c.m.(${d1}, ${d2}) = ${m}<br><b>2n</b> Arreglem els numeradors: ${F(a1,d1)} = ${F(e1,m)} i ${F(a2,d2)} = ${F(e2,m)}<br><b>3r</b> ${plus?'Sumem':'Restem'}: ${F(e1,m)} ${op} ${F(e2,m)} = ${F(n,m)}<br><b>4t</b> Simplifiquem: ${simpNote(n,m)?simpNote(n,m).replace(/^ = /,''):'no es pot simplificar.'}`};}
function s8_same(){const d=rnd(3,12),plus=Math.random()<.55;let a,b;if(plus){a=rnd(1,d-1);b=rnd(1,d-1);}else{a=rnd(2,d);b=rnd(1,a-1);}
  const r=opEx(a,d,b,d,plus);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,d)} ${plus?'+':'−'} ${F(b,d)}`,ans:[r.n,r.d],hint:'Mateix denominador. Què fas amb els numeradors? I amb el denominador?',
    explain:r.html+(r.n<=d?`<div class="mini">${barsSVG(d,r.n)}</div>`:'')+`⚠️ Mai no ${plus?'sumis':'restis'} els denominadors!`};}
const DENS=[2,3,4,5,6,8,10,12];
function s8_diff(){let d1,d2;do{d1=pick(DENS);d2=pick(DENS);}while(d1===d2||lcm(d1,d2)>30);
  let a1=rnd(1,d1-1),a2=rnd(1,d2-1);const plus=Math.random()<.55;
  if(!plus&&a1*d2===a2*d1)return s8_diff();
  if(!plus&&a1*d2<a2*d1){[a1,d1,a2,d2]=[a2,d2,a1,d1];}
  const r=opEx(a1,d1,a2,d2,plus);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a1,d1)} ${plus?'+':'−'} ${F(a2,d2)}`,ans:[r.n,r.d],hint:`Primer el m.c.m. de ${d1} i ${d2}. Després arregla els numeradors.`,explain:r.html};}
function s8_three(){const d=rnd(5,12);const a=rnd(1,d-2),b=rnd(1,d-1),c=rnd(1,d-1);const n=a+b+c;
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,d)} + ${F(b,d)} + ${F(c,d)}`,ans:[n,d],hint:'Totes tenen el mateix denominador: suma els tres numeradors.',explain:`${F(a+' + '+b+' + '+c,d)} = ${F(n,d)}${simpNote(n,d)}`};}
function pf(dens){const d=pick(dens);return [rnd(1,d-1),d];}
function s8_daily(){const t=rnd(0,5);
  if(t===0){let a,b,c;do{a=rnd(1,3);b=rnd(1,3);c=rnd(1,2);}while(a+b+c>7);const s=a+b+c,left=8-s;
    const [A,B,C,D]=people(4);return {kind:'frac',equiv:true,prompt:`🍕 D'una pizza de 8 trossos, ${art(A)} en pren ${F(a,8)}, ${art(B)} ${F(b,8)} i ${art(C)} ${F(c,8)}. Quanta pizza queda per a ${art(D)}, que ha arribat tard?`,ans:[left,8],
      hint:'Suma el que s\'han menjat i resta-ho de la pizza sencera, que és 8/8.',explain:`Han menjat ${F(a+' + '+b+' + '+c,8)} = ${F(s,8)}. Queda ${F(8,8)} − ${F(s,8)} = <b>${F(left,8)}</b>${simpNote(left,8)}<div class="mini">${piesSVG(8,left)}</div>`};}
  let a1,d1,a2,d2;const G=cond=>{do{[a1,d1]=pf([2,3,4,6,8]);[a2,d2]=pf([2,3,4,6,8]);}while(!cond());};
  if(t===1){G(()=>a1*d2+a2*d1<d1*d2);const r=opEx(a1,d1,a2,d2,true);
    return {kind:'frac',equiv:true,prompt:`📚 ${Art(people(1)[0])} fa ${F(a1,d1)} dels deures abans de sopar i ${F(a2,d2)} després. Quina part dels deures ha fet?`,ans:[r.n,r.d],hint:'Has de sumar les dues parts.',explain:r.html};}
  if(t===2){G(()=>a1*d2+a2*d1<d1*d2);const r=opEx(a1,d1,a2,d2,true);
    return {kind:'frac',equiv:true,prompt:`💶 De la paga, gastes ${F(a1,d1)} al cine i ${F(a2,d2)} en berenar. Quina part de la paga has gastat?`,ans:[r.n,r.d],hint:'Suma les dues parts.',explain:r.html};}
  if(t===3){G(()=>a1*d2>a2*d1);const r=opEx(a1,d1,a2,d2,false);
    return {kind:'frac',equiv:true,prompt:`🔋 El mòbil tenia ${F(a1,d1)} de bateria. Després de mirar vídeos, en té ${F(a2,d2)}. Quina part de la bateria has gastat?`,ans:[r.n,r.d],hint:'Resta el que tens ara del que tenies.',explain:r.html};}
  if(t===4){G(()=>a1*d2+a2*d1<d1*d2);const r=opEx(a1,d1,a2,d2,true),left=r.d-r.n;
    return {kind:'frac',equiv:true,prompt:`💧 Tens una ampolla d'aigua plena. Te'n beus ${F(a1,d1)} al matí i ${F(a2,d2)} a la tarda. Quina part de l'ampolla queda?`,ans:[left,r.d],hint:'1r suma el que t\'has begut. 2n resta-ho de l\'ampolla sencera (1).',
      explain:`${r.html}<br>Queda: 1 − ${F(r.n,r.d)} = ${F(r.d,r.d)} − ${F(r.n,r.d)} = <b>${F(left,r.d)}</b>${simpNote(left,r.d)}`};}
  G(()=>d1!==d2);const r=opEx(a1,d1,a2,d2,true);
  return {kind:'frac',equiv:true,prompt:`🧁 Una recepta de magdalenes demana ${F(a1,d1)} kg de farina i ${F(a2,d2)} kg de sucre. Quants kg pesen junts?`,ans:[r.n,r.d],hint:'Suma les dues quantitats.',explain:r.html};}
function s8_int(){const b=rnd(2,8),a=rnd(1,b-1);const t=pick([`🎂 Del pastís ja se n'ha menjat ${F(a,b)}. Quina part en queda?`,`📖 Ja has llegit ${F(a,b)} del llibre. Quina part et queda per llegir?`,`Calcula: 1 − ${F(a,b)}`]);
  return {kind:'frac',equiv:true,prompt:t,ans:[b-a,b],hint:`La unitat sencera és ${F(b,b)}.`,explain:`1 = ${F(b,b)}. ${F(b,b)} − ${F(a,b)} = <b>${F(b-a,b)}</b>${simpNote(b-a,b)}`};}

/* ---------- SALA 9 · Producte i divisió (pàg. 14–15) ---------- */
function s9_mul(){const a=rnd(1,7),b=rnd(2,9),c=rnd(1,7),d=rnd(2,9);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} · ${F(c,d)}`,ans:[a*c,b*d],hint:'Producte en paral·lel: dalt per dalt i baix per baix.',explain:`Es multipliquen els numeradors entre si i els denominadors entre si:<br>${F(a+' · '+c,b+' · '+d)} = ${F(a*c,b*d)}${simpNote(a*c,b*d)}`};}
function s9_div(){const a=rnd(1,7),b=rnd(2,9),c=rnd(1,7),d=rnd(2,9);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} : ${F(c,d)}`,ans:[a*d,b*c],hint:'Divisió: es multiplica en CREU (fent una X).',explain:`Producte en creu: dalt ${a} · ${d}, baix ${b} · ${c}:<br>${F(a+' · '+d,b+' · '+c)} = ${F(a*d,b*c)}${simpNote(a*d,b*c)}`};}
function s9_intOps(){const a=rnd(1,7),b=rnd(2,9),k=rnd(2,9),t=rnd(0,2);
  if(t===0)return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} · ${k}`,ans:[a*k,b],hint:`Escriu el ${k} com ${F(k,1)}.`,explain:`${F(a,b)} · ${F(k,1)} = ${F(a+' · '+k,b+' · 1')} = ${F(a*k,b)}${simpNote(a*k,b)}`};
  if(t===1)return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} : ${k}`,ans:[a,b*k],hint:`Escriu el ${k} com ${F(k,1)} i multiplica en creu.`,explain:`${F(a,b)} : ${F(k,1)} = ${F(a+' · 1',b+' · '+k)} = ${F(a,b*k)}${simpNote(a,b*k)}`};
  return {kind:'frac',equiv:true,prompt:`Calcula: ${k} : ${F(a,b)}`,ans:[k*b,a],hint:`Escriu el ${k} com ${F(k,1)} i multiplica en creu.`,explain:`${F(k,1)} : ${F(a,b)} = ${F(k+' · '+b,'1 · '+a)} = ${F(k*b,a)}${simpNote(k*b,a)}`};}
function s9_divInt(){const b=pick([2,3,4,5]),a=rnd(1,b-1),k=pick([2,3,4,5]);const cells=[...Array(a).keys()].map(c=>c*k);
  const t=pick([`🍬 Volem repartir ${F(a,b)} d'una capsa de llaminadures entre ${k} amics. Quina part de la capsa li toca a cadascú?`,`🍕 Tens ${F(a,b)} de pizza i la reparteixes entre ${k} germans. Quina part de la pizza sencera toca a cadascú?`]);
  return {kind:'frac',equiv:true,prompt:t,ans:[a,b*k],hint:`Dividir entre ${k} és com fer ${F(a,b)} : ${F(k,1)}.`,
    explain:`${F(a,b)} : ${k} = ${F(a,b)} : ${F(k,1)} = ${F(a+' · 1',b+' · '+k)} = <b>${F(a,b*k)}</b>${simpNote(a,b*k)}<div class="eqpair"><div>${rectSVG(b,1,a)}</div><div>${rectSVG(b,k,cells)}</div></div>Cada columna pintada es parteix en ${k} trossos: a cada amic li toca una fila.`};}
function s9_daily(){const t=rnd(0,3);
  if(t===0){const [a,b]=pick([[1,2],[3,4],[2,3],[1,3]]),[c,d]=pick([[1,2],[1,3],[1,4],[2,3]]);
    return {kind:'frac',equiv:true,prompt:`🍕 De la pizza en queda ${F(a,b)}. Te'n menges ${F(c,d)} d'aquest tros. Quina part de la pizza <b>sencera</b> t'has menjat?`,ans:[a*c,b*d],hint:'«La fracció d\'una fracció» es calcula multiplicant.',explain:`${F(c,d)} de ${F(a,b)} → ${F(c,d)} · ${F(a,b)} = ${F(c+' · '+a,d+' · '+b)} = <b>${F(a*c,b*d)}</b>${simpNote(a*c,b*d)}`};}
  if(t===1){const k=pick([2,3,4,5]);let G;do{G=rnd(k+1,4*k);}while(G%k===0);const [a,b]=simp(G,k);
    return {kind:'num',prompt:`🧃 Tens ${F(a,b)} litres de suc i omples gots de ${F(1,k)} de litre. Quants gots pots omplir?`,ans:G,hint:'Quantes vegades hi cap un got? → Divisió.',explain:`${F(a,b)} : ${F(1,k)} = ${F(a+' · '+k,b+' · 1')} = ${F(a*k,b)} = <b>${G} gots</b>`};}
  if(t===2){const b=pick([3,4,5]),a=rnd(1,b-1),d=pick([2,3,4]),c=rnd(1,d-1);
    return {kind:'frac',equiv:true,prompt:`🔵 En una bossa de bales, ${F(a,b)} són blaves, i ${F(c,d)} de les blaves són transparents. Quina fracció del total són blaves transparents?`,ans:[a*c,b*d],hint:'«de les blaves» → multiplica.',explain:`${F(c,d)} de ${F(a,b)} = ${F(c+' · '+a,d+' · '+b)} = <b>${F(a*c,b*d)}</b>${simpNote(a*c,b*d)}`};}
  const b=pick([2,3,4]),a=rnd(1,b-1),k=pick([2,3]);
  return {kind:'frac',equiv:true,prompt:`🥤 ${people(k).map(art).join(', ').replace(/, ([^,]*)$/,' i $1').replace(/^./,c=>c.toUpperCase())} van d'excursió i cadascú porta ${F(a,b)} de litre d'aigua. Quants litres porten entre tots?`,ans:[a*k,b],hint:`${k} vegades ${F(a,b)} → multiplica.`,explain:`${F(a,b)} · ${k} = ${F(a+' · '+k,b)} = <b>${F(a*k,b)}</b>${simpNote(a*k,b)}`};}

let AC=null;
let MASTER=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-8;comp.ratio.value=4;comp.connect(AC.destination);MASTER=AC.createGain();MASTER.gain.value=1;MASTER.connect(comp);}
  if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,t0,dur,type='triangle',vol=.18,f2){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MASTER);o.start(t);o.stop(t+dur+.05);}
const SFX={
  ok(){tone(784,0,.14,'triangle',.45);tone(1175,.12,.28,'triangle',.45);tone(1568,.12,.28,'sine',.15);},   /* ding-ding ascendent */

  tap(){tone(660,0,.05,'square',.04);},
  hint(){tone(988,0,.08,'sine',.1);tone(988,.1,.08,'sine',.1);},

function confetti(n=170){const c=$('#confetti');let x=null;try{x=c.getContext('2d');}catch(e){}if(!x)return;c.width=innerWidth;c.height=innerHeight;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#ff6a00','#ffa25c','#000000','#ff8a2b','#c94f00'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:5+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.3,col:pick(cols)}));
  let t=0;cancelAnimationFrame(confetti.raf);
  (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<280)confetti.raf=requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

const B32='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const normTeam=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function h32(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
const CSM=(1<<26)-1;
function makeCode(){const secs=Math.round(((S.end||Date.now())-S.start)/1000);let n=0n;
  const put=(v,b)=>{n=(n<<BigInt(b))|BigInt(Math.max(0,Math.min(Math.round(v)||0,2**b-1)));};
  put(1,2);put(S.won?1:0,1);put(S.free?1:0,1);put(S.score,11);put(secs,14);put(S.hints,6);put(S.best,5);
  S.rooms.forEach(r=>put(r.correct,3));S.rooms.forEach(r=>put(r.err||0,3));
  n=(n<<26n)|BigInt(h32('v2p|'+normTeam(S.team)+'|'+n.toString())&CSM);
  let s='';for(let i=0;i<24;i++){s=B32[Number(n&31n)]+s;n>>=5n;}return s.match(/.{4}/g).join('-');}
function readCode(name,code){const c=String(code).toUpperCase().replace(/[^0-9A-Z]/g,'');if(c.length!==24)return null;
  let n=0n;for(const ch of c){const i=B32.indexOf(ch);if(i<0)return null;n=(n<<5n)|BigInt(i);}
  const cs=Number(n&BigInt(CSM));n>>=26n;if(cs!==(h32('v2p|'+normTeam(name)+'|'+n.toString())&CSM))return null;
  const take=b=>{const v=Number(n&BigInt(2**b-1));n>>=BigInt(b);return v;};
  const err=[],correct=[];for(let i=ROOMS.length-1;i>=0;i--)err[i]=take(3);for(let i=ROOMS.length-1;i>=0;i--)correct[i]=take(3);
  const best=take(5),hints=take(6),secs=take(14),score=take(11),free=take(1),won=take(1),ver=take(2);
  if(n!==0n||ver!==1||correct.some(c=>c>NEED))return null;
  return {won:!!won,free:!!free,score,secs,hints,best,correct,err,rd:correct.filter(c=>c>=NEED).length,ok:correct.reduce((a,b)=>a+b,0),errors:err.reduce((a,b)=>a+b,0)};}
function stateFromCode(name,pin,v){const s=newState(name,pin,v.free);
  s.rooms.forEach((r,i)=>{r.correct=v.correct[i];r.done=v.correct[i]>=NEED;r.seen=r.correct>0||r.done;r.err=v.err[i];});
  Object.assign(s,{score:v.score,hints:v.hints,best:v.best,ok:v.ok,errors:v.errors,won:v.won,start:Date.now()-v.secs*1000});if(v.won)s.end=Date.now();return s;}

    <li>Tens una <b>pissarra ✏️</b> per fer càlculs (botó de baix a la dreta).</li>
    <li>Apunta cada xifra a la llibreta: la necessitaràs a la porta de sortida!</li></ul></div>
