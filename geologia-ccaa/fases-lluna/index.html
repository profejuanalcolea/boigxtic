<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fases de la Lluna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: escenari fix apaïsat de 1600×900 que s'escala a l'amplada disponible (pissarra / Google Sites). Esquerra: cel vist per l'observador (dalt) i òrbita vista des de l'espai (baix). Dreta: dades, la Lluna com es veu, controls i repte. */
:root{
  --bg:#0b1f3a; --fg:#f2f5f9; --muted:#9fb1c8; --line:#21395c; --panel:#0f2a4d; --accent:#ff8a2a; --accent-ink:#ffa85e; --ok:#7fe0a0; --tip:#13335c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow-x:hidden}
body{font-family:var(--f-body);font-size:18px;line-height:1.4}
#holder{position:relative;width:100%;overflow:hidden}
#stage{width:1600px;height:900px;transform-origin:0 0;display:grid;grid-template-columns:1110px 1fr;grid-template-rows:56px 1fr;gap:10px 18px;padding:12px 18px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;line-height:1}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--fg);padding-bottom:8px;flex-wrap:nowrap}
.lbl{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--fg);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.2;padding:3px 10px;background:var(--bg);color:var(--fg);border:0;border-left:2px solid var(--fg);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{font:inherit;font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2;padding:4px 12px;border:2px solid var(--fg);border-radius:4px;background:var(--bg);color:var(--fg);cursor:pointer}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#111;min-width:130px}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
button:focus-visible,input:focus-visible,.term:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.left{display:grid;grid-template-rows:310px 1fr;gap:10px;min-height:0}
.cv{position:relative;border-radius:6px;overflow:hidden;background:#050d1c}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv .tag{position:absolute;left:10px;top:8px;font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:#dfe8f5;background:rgba(5,13,28,.6);padding:2px 8px;border-radius:3px;pointer-events:none}
#orbit{cursor:pointer}
.right{display:flex;flex-direction:column;gap:10px;min-height:0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:var(--panel);border-radius:5px;padding:6px 10px;min-width:0}
.tile .lbl{display:block}
.tile b{font-family:var(--f-mono);font-weight:500;font-size:1.15rem;white-space:nowrap}
.tile.big{grid-column:1/-1}
.tile.big b{font-family:var(--f-display);font-size:1.9rem;font-weight:700;color:var(--accent-ink)}
.moonbox{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;background:var(--panel);border-radius:6px;padding:8px}
.moonbox canvas{width:200px;height:200px;display:block}
.moonbox p{margin:0;font-size:.95rem;color:var(--muted)}
.moonbox p b{color:var(--fg)}
.ctrls{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;white-space:nowrap;padding:4px 6px}
.slider{display:grid;grid-template-columns:128px 1fr 70px;align-items:center;gap:8px}
.slider output{font-family:var(--f-mono);font-size:.95rem;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.tog{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.95rem;user-select:none}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.challenge{background:var(--panel);border-radius:6px;padding:10px 12px;border-left:4px solid var(--accent);display:flex;flex-direction:column;gap:8px}
.challenge .q{font-size:1.05rem;font-weight:500}
.challenge .fb{font-size:.95rem;min-height:1.3em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--accent-ink)}
.term{text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px;cursor:help}
#tip{position:fixed;z-index:50;max-width:min(340px,calc(100vw - 24px));background:var(--tip);color:var(--fg);border:2px solid var(--accent);border-radius:6px;padding:9px 12px;font-size:.95rem;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none}
#tip b{font-family:var(--f-display);font-size:1.1rem;color:var(--accent-ink);display:block;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div id="holder"><div id="stage">
  <div class="bar">
    <h1>Fases de la Lluna</h1>
    <span class="spacer"></span>
    <span class="lbl" id="latlbl">Observador</span>
    <div class="seg" role="group" aria-labelledby="latlbl" id="latSeg"><button type="button" data-lat="41">Badalona 41° N</button><button type="button" data-lat="0">Equador</button><button type="button" data-lat="-35">Buenos Aires 35° S</button></div>
    <label class="tog"><input type="checkbox" id="show8" checked> Les 8 fases</label>
    <label class="tog"><input type="checkbox" id="showHz" checked> <span class="term" data-g="horitzo" tabindex="0">Horitzó</span></label>
    <button type="button" class="btn" id="fsBtn">⛶ Pantalla completa</button>
  </div>

  <div class="left">
    <div class="cv"><canvas id="sky" aria-label="El cel vist per l'observador"></canvas><span class="tag" id="skyTag">Què veu l'observador</span></div>
    <div class="cv"><canvas id="orbit" aria-label="Sol, Terra i Lluna vistos des de sobre del pol nord"></canvas><span class="tag">Des de l'espai · sobre el pol nord · sense escala</span></div>
  </div>

  <div class="right">
    <div class="info">
      <div class="tile big"><span class="lbl"><span class="term" data-g="fase" tabindex="0">Fase actual</span></span><b id="iPhase">—</b></div>
      <div class="tile"><span class="lbl">Des de la lluna nova</span><b id="iAge">—</b></div>
      <div class="tile"><span class="lbl">Hora de l'observador</span><b id="iHour">—</b></div>
      <div class="tile"><span class="lbl"><span class="term" data-g="illum" tabindex="0">Il·luminada</span></span><b id="iIll">—</b></div>
      <div class="tile"><span class="lbl"><span class="term" data-g="elong" tabindex="0">Angle Sol–Lluna</span></span><b id="iEl">—</b></div>
    </div>

    <div class="moonbox">
      <canvas id="moonBig" width="200" height="200" aria-label="La Lluna tal com es veu"></canvas>
      <div>
        <div class="lbl">Com es veu la Lluna</div>
        <p id="iSeen">—</p>
        <p style="margin-top:8px">Surt cap a les <b id="iRise">—</b><br>Es pon cap a les <b id="iSet">—</b></p>
      </div>
    </div>

    <div class="ctrls">
      <div class="row">
        <button type="button" class="btn" id="mDay" aria-label="Un dia enrere">−1 dia</button>
        <button type="button" class="btn" id="mHour" aria-label="Una hora enrere">−1 h</button>
        <button type="button" class="btn primary" id="play">▶ Reprodueix</button>
        <button type="button" class="btn" id="pHour" aria-label="Una hora endavant">+1 h</button>
        <button type="button" class="btn" id="pDay" aria-label="Un dia endavant">+1 dia</button>
      </div>
      <div class="row"><span class="lbl" id="spdlbl">Velocitat</span>
        <div class="seg" role="group" aria-labelledby="spdlbl" id="speedSeg"><button type="button" data-s="0.5">½ h/s</button><button type="button" data-s="2">2 h/s</button><button type="button" data-s="6">6 h/s</button><button type="button" data-s="24">1 dia/s</button></div>
      </div>
      <div class="slider"><label class="lbl" for="ageIn"><span class="term" data-g="sinodic" tabindex="0">Dia del cicle</span></label><input type="range" id="ageIn" min="0" max="29.53" step="0.01"><output id="ageOut">—</output></div>
      <div class="slider"><label class="lbl" for="hourIn">Hora</label><input type="range" id="hourIn" min="0" max="24" step="0.05"><output id="hourOut">—</output></div>
    </div>

    <div class="challenge">
      <div class="lbl">Repte <span id="chN"></span></div>
      <div class="q" id="chQ">—</div>
      <div class="row"><button type="button" class="btn primary" id="chCheck">Comprova</button><button type="button" class="btn" id="chNext">Següent repte</button></div>
      <div class="fb" id="chFb" aria-live="polite"></div>
    </div>
  </div>
</div></div>
<div id="tip" role="tooltip" hidden></div>

  const starA=Math.max(0,Math.min(1,(-a-0.05)/0.25));

    else if(k==='h'){g.fillRect(x-22,hz-24,44,24);g.beginPath();g.moveTo(x-28,hz-24);g.lineTo(x,hz-44);g.lineTo(x+28,hz-24);g.fill();if(a<0){g.fillStyle='#ffd65a';g.fillRect(x-13,hz-17,7,8);g.fillRect(x+6,hz-17,7,8);g.fillStyle=mix('#040806','#1c3317',tDay);}}

  const south=S.lat>=0, mid=S.lat===0?'Zenit (amunt)':south?'Sud':'Nord';
  g.font='700 18px "Barlow Condensed",sans-serif';g.fillStyle='#ffffff';g.textBaseline='middle';
  g.textAlign='left';g.fillText(south?'EST':'OEST',14,hz+30);g.textAlign='center';g.fillText(mid.toUpperCase(),w/2,hz+30);g.textAlign='right';g.fillText(south?'OEST':'EST',w-14,hz+30);
  document.getElementById('skyTag').textContent='Què veu l\'observador · mirant cap al '+(S.lat>=0?'sud':'nord');
  return {sun,moon};
}

  g.font='700 22px "Barlow Condensed",sans-serif';g.fillStyle='#4a2200';g.textAlign='left';g.textBaseline='middle';g.fillText('SOL',10,cy);
  for(let k=-3;k<=3;k++){const y=cy+k*h*0.12;const x0=sx+Math.sqrt(Math.max(0,sr*sr-(y-cy)*(y-cy)))+8;const lg=g.createLinearGradient(x0,0,x0+w*0.14,0);lg.addColorStop(0,'rgba(255,210,120,.75)');lg.addColorStop(1,'rgba(255,210,120,0)');g.strokeStyle=lg;g.lineWidth=2;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+w*0.14,y);g.stroke();g.fillStyle='rgba(255,210,120,.75)';}
  // orbit
  g.setLineDash([3,6]);g.strokeStyle='rgba(220,230,245,.55)';g.lineWidth=1.4;g.beginPath();g.arc(cx,cy,Ro,0,TAU);g.stroke();g.setLineDash([]);
  // 8 phase markers
  if(S.show8){g.font='600 15px "Barlow Condensed",sans-serif';for(let k=0;k<8;k++){const a=Math.PI+k*Math.PI/4;const x=cx+Ro*Math.cos(a),y=cy-Ro*Math.sin(a);g.fillStyle='rgba(255,138,42,.9)';g.beginPath();g.arc(x,y,4,0,TAU);g.fill();const lx=cx+(Ro+34)*Math.cos(a),ly=cy-(Ro+34)*Math.sin(a);g.textAlign='center';g.fillStyle='rgba(235,240,248,.85)';const nm=PH8[k].replace('Lluna ','');g.fillText(nm.charAt(0).toUpperCase()+nm.slice(1),lx,ly);}}

  g.fillStyle='#7d9b57';g.strokeStyle='#4f6b35';g.lineWidth=0.7;
  for(const poly of LAND){g.beginPath();for(let j=0;j<poly.length;j+=2){const lon=poly[j]/2*D2R,lat=poly[j+1]/2;const r=Re*(90-lat)/90,th=rotG+lon;const x=cx+r*Math.cos(th),y=cy-r*Math.sin(th);j?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();g.fill();g.stroke();}
  const ice=g.createRadialGradient(cx,cy,0,cx,cy,Re*0.3);ice.addColorStop(0,'rgba(245,250,255,.95)');ice.addColorStop(1,'rgba(235,245,255,0)');g.fillStyle=ice;g.beginPath();g.arc(cx,cy,Re*0.3,0,TAU);g.fill();

  g.restore();
  const atm=g.createRadialGradient(cx,cy,Re*0.96,cx,cy,Re*1.1);atm.addColorStop(0,'rgba(150,210,255,0)');atm.addColorStop(0.5,'rgba(150,210,255,.6)');atm.addColorStop(1,'rgba(150,210,255,0)');g.fillStyle=atm;g.beginPath();g.arc(cx,cy,Re*1.1,0,TAU);g.fill();

  const ta=-0.2*Math.PI,tx=cx+Re*1.55*Math.cos(ta),ty=cy+Re*1.55*Math.sin(ta);g.fillStyle='rgba(220,230,245,.85)';g.beginPath();g.moveTo(tx+2,ty-8);g.lineTo(tx-5,ty+3);g.lineTo(tx+7,ty+2);g.fill();

  if(S.showHz){const tx2=-Math.sin(oa),ty2=-Math.cos(oa);const L=Re*2.6;g.strokeStyle='rgba(255,138,42,.85)';g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();g.moveTo(ox-tx2*L,oy-ty2*L);g.lineTo(ox+tx2*L,oy+ty2*L);g.stroke();g.setLineDash([]);

  const mg=g.createRadialGradient(mx-mr*0.4,my-mr*0.3,mr*0.1,mx,my,mr);mg.addColorStop(0,'#f2efe8');mg.addColorStop(1,'#aaa69d');g.fillStyle=mg;g.fillRect(mx-mr,my-mr,2*mr,2*mr);

  g.restore();g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=1;g.beginPath();g.arc(mx,my,mr,0,TAU);g.stroke();

  g.setLineDash([2,4]);g.strokeStyle='rgba(220,230,245,.35)';g.beginPath();g.moveTo(cx+Re*1.15*Math.cos(ma),cy-Re*1.15*Math.sin(ma));g.lineTo(mx-mr*Math.cos(ma),my+mr*Math.sin(ma));g.stroke();g.setLineDash([]);
  g.font='700 17px "Barlow Condensed",sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.lineWidth=4;g.strokeStyle='rgba(3,7,15,.85)';g.strokeText('LLUNA',mx,my-mr-8);g.fillStyle='#fff';g.fillText('LLUNA',mx,my-mr-8);

orbCv.addEventListener('click',ev=>{if(!S.show8||!ORB.cx)return;const r=orbCv.getBoundingClientRect(),k=orbCv.offsetWidth/r.width;const x=(ev.clientX-r.left)*k,y=(ev.clientY-r.top)*k;
  let best=-1,bd=1e9;for(let i=0;i<8;i++){const a=Math.PI+i*Math.PI/4;const px=ORB.cx+ORB.Ro*Math.cos(a),py=ORB.cy-ORB.Ro*Math.sin(a);const lx=ORB.cx+(ORB.Ro+34)*Math.cos(a),ly=ORB.cy-(ORB.Ro+34)*Math.sin(a);const d=Math.min(Math.hypot(x-px,y-py),Math.hypot(x-lx,y-ly));if(d<bd){bd=d;best=i;}}

/* ---------- big moon + info ---------- */
const bigCv=document.getElementById('moonBig');
function drawBig(sky){
  const {g,w,h}=prep(bigCv);
  g.fillStyle='#050d1c';g.beginPath();g.arc(w/2,h/2,w/2-2,0,TAU);g.fill();
  const waxing=S.age<SYN/2;
  let rot;
  if(S.lat>0)rot=waxing?0:Math.PI; else if(S.lat<0)rot=waxing?Math.PI:0; else rot=Math.PI/2;
  drawMoonDisc(g,w/2,h/2,w/2-14,rot,{dark:'#1b2232'});
  const e=elong()/D2R, k=illum();
  const side=S.lat>0?(waxing?'dreta':'esquerra'):S.lat<0?(waxing?'esquerra':'dreta'):'part de baix';
  let seen;
  if(k<0.03)seen='No es veu: la cara il·luminada mira cap al Sol i és prop del Sol al cel.';
  else if(k>0.97)seen='Es veu sencera, tota la cara que mira la Terra és il·luminada.';
  else seen='La part il·luminada queda a la <b>'+side+'</b>.';
  const up=sky.moon.up>0, sunUp=sky.sun.up>0;
  seen+=' Ara mateix '+(up?(sunUp?'és sobre l\'horitzó, de dia.':'és sobre l\'horitzó, de nit.'):'és sota l\'horitzó.');
  document.getElementById('iSeen').innerHTML=seen;
}
function info(){
  const d=Math.floor(S.age), hh=Math.floor((S.age-d)*24+1e-6);
  document.getElementById('iPhase').textContent=phaseName();
  document.getElementById('iAge').textContent=d+' d '+hh+' h';
  document.getElementById('iHour').textContent=fmtH(S.hour);
  document.getElementById('iIll').textContent=Math.round(illum()*100)+' %';
  document.getElementById('iEl').textContent=Math.round(elong()/D2R)%360+'°';
  const lag=S.age/SYN*24;
  document.getElementById('iRise').textContent=fmtH(6+lag);
  document.getElementById('iSet').textContent=fmtH(18+lag);
  document.getElementById('ageOut').textContent=S.age.toFixed(1).replace('.',',')+' d';
  document.getElementById('hourOut').textContent=fmtH(S.hour);
}

const playBtn=document.getElementById('play');let last=0;
function tick(ts){if(!S.playing)return;if(last){const dt=Math.min(100,ts-last)/1000;const hrs=dt*S.speed;S.hour+=hrs;S.age+=hrs/24;S.hour%=24;S.age%=SYN;sync();draw();}last=ts;requestAnimationFrame(tick);}
playBtn.addEventListener('click',()=>{S.playing=!S.playing;playBtn.textContent=S.playing?'❚❚ Pausa':'▶ Reprodueix';last=0;if(S.playing)requestAnimationFrame(tick);});
document.getElementById('fsBtn').addEventListener('click',()=>{const el=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}catch(_){}});

  ageIn.value=S.age;hourIn.value=S.hour;
  document.querySelectorAll('#speedSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===S.speed));
  document.querySelectorAll('#latSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lat===S.lat));

}

const tip=document.getElementById('tip');let tipFor=null;
function showTip(el){const gl=GLOSS[el.dataset.g];if(!gl)return;tipFor=el;tip.innerHTML='';const b=document.createElement('b');b.textContent=gl[0];tip.appendChild(b);tip.appendChild(document.createTextNode(gl[1]));tip.hidden=false;const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;let x=Math.min(window.innerWidth-tw-12,Math.max(12,r.left+r.width/2-tw/2));let y=r.bottom+8;if(y+th>window.innerHeight-8)y=r.top-th-8;tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('.term');if(el)showTip(el);else if(tipFor)hideTip();});
