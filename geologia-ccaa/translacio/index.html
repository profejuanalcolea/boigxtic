<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Translació · versió 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --text:#ffffff; --muted:#bdbdbd; --orange:#ff7a00; --line:#333333;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:clamp(16px,0.8vw + 10px,20px);
  display:flex; flex-direction:column; min-height:420px;
}
.stage{position:relative; flex:1; min-height:0}
canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.hud{position:absolute; left:clamp(10px,2vw,28px); top:clamp(8px,1.5vw,20px); pointer-events:none}
.hud .d{font-size:clamp(1.7rem,3.4vw,3.2rem); font-weight:700; line-height:1}
.hud .s{font-size:clamp(1rem,1.7vw,1.6rem); font-weight:700; margin-top:4px}
.hud .s b{color:#f7d038}
.hud .m{font-size:clamp(1rem,1.7vw,1.6rem); color:var(--orange); font-weight:700; margin-top:6px; min-height:1.3em}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px clamp(10px,2vw,24px); border-top:1px solid var(--line)}
.btn{
  font:inherit; font-size:.9em; color:var(--text); background:transparent; cursor:pointer;
  border:2px solid var(--text); border-radius:999px; padding:.35em .9em; white-space:nowrap;
}
.btn:hover{border-color:var(--orange); color:var(--orange)}
.btn:focus-visible, input:focus-visible{outline:3px solid var(--orange); outline-offset:3px}
.btn.icon{width:2.7em; height:2.7em; padding:0; display:grid; place-items:center; font-size:1em}
.btn.primary{background:var(--orange); border-color:var(--orange); color:#000; font-weight:700}
.btn.primary:hover{background:#ffb266; border-color:#ffb266; color:#000}
.btn.chip{font-size:.74em; padding:.35em .75em; border-color:#666; color:var(--muted)}
.btn.chip[aria-pressed=true]{border-color:var(--orange); color:var(--orange)}
input[type=range]{flex:1; min-width:180px; appearance:none; -webkit-appearance:none; height:34px; background:transparent; cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px; border-radius:4px; background:#444}
input[type=range]::-moz-range-track{height:8px; border-radius:4px; background:#444}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:var(--orange); border:3px solid #000; margin-top:-10px; box-shadow:0 0 0 2px var(--orange)}
input[type=range]::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:var(--orange); border:3px solid #000; box-shadow:0 0 0 2px var(--orange)}
.credits-btn{
  font:inherit; font-size:.72em; font-weight:700; font-style:italic; width:1.9em; height:1.9em; padding:0;
  border-radius:50%; border:1px solid #555; background:transparent; color:#888; cursor:pointer; margin-left:auto;
}
.credits-btn:hover,.credits-btn[aria-expanded=true]{color:var(--orange); border-color:var(--orange)}
.credits-btn:focus-visible{outline:3px solid var(--orange); outline-offset:3px}
.credits{
  position:fixed; right:clamp(10px,2vw,24px); bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:20;
  background:#0d0d0d; border:1px solid #444; border-left:4px solid var(--orange); border-radius:10px;
  padding:14px 40px 14px 16px; min-width:220px; max-width:calc(100vw - 20px);
  box-shadow:0 8px 30px rgba(0,0,0,.6); animation:credIn .18s ease-out;
}
.credits[hidden]{display:none}
@keyframes credIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.credits-school{font-weight:700; font-size:1em}
.credits-subject{color:var(--orange); font-size:.9em; margin-top:2px}
.credits-author{color:var(--muted); font-size:.85em; margin-top:8px}
.credits-close{position:absolute; top:6px; right:8px; font:inherit; font-size:1.2em; line-height:1; background:none; border:0; color:#888; cursor:pointer; padding:4px}
.credits-close:hover{color:#fff}
@media (prefers-reduced-motion:reduce){.credits{animation:none}}
@media (max-width:640px){ input[type=range]{order:10; flex-basis:100%} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" role="img" aria-label="Animació de la Terra girant al voltant del Sol, amb els equinoccis i els solsticis"></canvas>
  <div class="hud" aria-live="polite"><div class="d" id="hudDate">—</div><div class="m" id="hudMoment"></div><div class="s" id="hudHN"></div><div class="s" id="hudHS"></div></div>
</div>
<div class="bar" role="region" aria-label="Controls de l'animació">
  <button class="btn icon" id="prevBtn" type="button" aria-label="Moment anterior">⏮</button>
  <button class="btn icon primary" id="playBtn" type="button" aria-label="Reprodueix">▶</button>
  <button class="btn icon" id="nextBtn" type="button" aria-label="Moment següent">⏭</button>
  <input type="range" id="slider" min="0" max="365.24" step="0.01" value="0" aria-label="Dia de l'any">
  <button class="btn chip" id="stopBtn" type="button" title="Atura't a cada equinocci i solstici" aria-pressed="true">Aturades</button>
  <button class="btn chip" id="ghostBtn" type="button" aria-pressed="true">4 Terres</button>
  <button class="btn chip" id="hnBtn" type="button" title="Estació a l'hemisferi nord" aria-label="Estació a l'hemisferi nord" aria-pressed="true">HN</button>
  <button class="btn chip" id="hsBtn" type="button" title="Estació a l'hemisferi sud" aria-label="Estació a l'hemisferi sud" aria-pressed="true">HS</button>
  <button class="btn chip" id="distBtn" type="button" aria-pressed="true">Distàncies</button>
  <button class="btn chip" id="contBtn" type="button" aria-pressed="true">Continents</button>
  <button class="btn icon" id="muteBtn" type="button" aria-label="Silencia el so">🔊</button>
  <button class="btn icon" id="fsBtn" type="button" aria-label="Pantalla completa">⛶</button>
  <button class="credits-btn" id="credBtn" type="button" aria-label="Crèdits" aria-expanded="false" aria-controls="credBox">i</button>
</div>
<div class="credits" id="credBox" role="dialog" aria-label="Crèdits" hidden>
  <button class="credits-close" id="credClose" type="button" aria-label="Tanca">×</button>
  <div class="credits-school">Institut Júlia Minguell</div>
  <div class="credits-subject">Ciències de la Terra</div>
  <div class="credits-author">Ideat per J. Alcolea</div>
</div>

<script>
(function(){
"use strict";
/* ---------- Model ---------- */
const Y=365.2422, RAD=Math.PI/180, TAU=Math.PI*2, EPS=23.44*RAD, E=0.0167, DPERI=2.6, LPERI_SUN=282.94*RAD;
const mod=(a,m)=>((a%m)+m)%m;
function astro(d){
  const M=mod(TAU*(d-DPERI)/Y,TAU); let Ea=M;
  for(let i=0;i<8;i++) Ea-=(Ea-E*Math.sin(Ea)-M)/(1-E*Math.cos(Ea));
  const nu=2*Math.atan2(Math.sqrt(1+E)*Math.sin(Ea/2), Math.sqrt(1-E)*Math.cos(Ea/2));
  return {nu, r:1-E*Math.cos(Ea)};
}
// Vista obliqua des de sobre del pla de l'òrbita
const BETA=26*RAD, SB=Math.sin(BETA), CB=Math.cos(BETA);
const EV=0.06;                                  // excentricitat del dibuix (lleugerament exagerada)
const AX=[Math.sin(EPS),0,Math.cos(EPS)];       // eix terrestre, fix a l'espai
const E1=[Math.cos(EPS),0,-Math.sin(EPS)], E2=[0,1,0];
function worldPos(nu){                          // juny a l'esquerra, desembre a la dreta, març al fons, setembre davant
  const r=(1-EV*EV)/(1+EV*Math.cos(nu)); const th=nu+LPERI_SUN+Math.PI-Math.PI/2;
  return [r*Math.cos(th), r*Math.sin(th), 0];
}
const depthOf = P => -P[1]*CB + P[2]*SB;        // positiu = més a prop de qui mira

/* ---------- Dates ---------- */
const MLEN=[31,28,31,30,31,30,31,31,30,31,30,31];
const MNAME=["de gener","de febrer","de març","d'abril","de maig","de juny","de juliol","d'agost","de setembre","d'octubre","de novembre","de desembre"];
const MSTART=[]; {let c=0; for(const l of MLEN){MSTART.push(c); c+=l;}}
function dateLabel(d){ let n=Math.floor(mod(d,Y)); if(n>364) n=364; let m=0; while(m<11 && n>=MSTART[m+1]) m++; return (n-MSTART[m]+1)+" "+MNAME[m]; }

const MAIN=[
  {day:79.5,  date:"21 de març",      name:"Equinocci", full:"Equinocci de març",     hn:"HN primavera", hs:"HS tardor",    kind:"eq",  place:"top"},
  {day:171.5, date:"21 de juny",      name:"Solstici",  full:"Solstici de juny",      hn:"HN estiu",     hs:"HS hivern",    kind:"sol", place:"left"},
  {day:265.5, date:"23 de setembre",  name:"Equinocci", full:"Equinocci de setembre", hn:"HN tardor",    hs:"HS primavera", kind:"eq",  place:"bottom"},
  {day:354.5, date:"21 de desembre",  name:"Solstici",  full:"Solstici de desembre",  hn:"HN hivern",    hs:"HS estiu",     kind:"sol", place:"right"}
];
const MINOR=[{day:2.5, full:"Periheli", kind:"low"},{day:184.5, full:"Afeli", kind:"low"}];
const ALL=MAIN.concat(MINOR);

/* ---------- Estat ---------- */
let cur=MAIN[0].day, target=cur, playing=false, dragging=false, autoStop=true, showGhosts=true;
const SPEED=22; // dies per segon
const $=id=>document.getElementById(id);
const cv=$("cv"), stage=$("stage"), slider=$("slider"), playBtn=$("playBtn");

function setPlaying(p){ playing=p; playBtn.textContent=p?"⏸":"▶"; playBtn.setAttribute("aria-label", p?"Pausa":"Reprodueix"); }
function normalize(){ const off=Math.floor(cur/Y)*Y; cur-=off; target-=off; }
function goNext(){ let best=Infinity; for(const e of MAIN){ let t=e.day+Math.ceil((target+0.01-e.day)/Y)*Y; if(t<=target+0.01) t+=Y; best=Math.min(best,t);} setPlaying(false); target=best; }
function goPrev(){ let best=-Infinity; for(const e of MAIN){ let t=e.day+Math.floor((target-0.01-e.day)/Y)*Y; if(t>=target-0.01) t-=Y; best=Math.max(best,t);} setPlaying(false); target=best; }

playBtn.addEventListener("click", ()=>{ ensureAudio(); target=cur; setPlaying(!playing); });
$("nextBtn").addEventListener("click", ()=>{ ensureAudio(); goNext(); });
$("prevBtn").addEventListener("click", ()=>{ ensureAudio(); goPrev(); });
slider.addEventListener("pointerdown", ()=>{ dragging=true; setPlaying(false); normalize(); });
slider.addEventListener("input", ()=>{ if(!dragging){ normalize(); setPlaying(false); } target=parseFloat(slider.value); });
window.addEventListener("pointerup", ()=>{ dragging=false; });
$("stopBtn").addEventListener("click", e=>{ autoStop=!autoStop; e.currentTarget.setAttribute("aria-pressed", autoStop); });
let showDist=true, showCont=true, showHN=true, showHS=true;
$("hnBtn").addEventListener("click", e=>{ showHN=!showHN; e.currentTarget.setAttribute("aria-pressed", showHN); needDraw=true; });
$("hsBtn").addEventListener("click", e=>{ showHS=!showHS; e.currentTarget.setAttribute("aria-pressed", showHS); needDraw=true; });
function seasonAt(d){
  const x=mod(d,Y);
  if(x>=79.5 && x<171.5) return ["primavera","tardor"];
  if(x>=171.5 && x<265.5) return ["estiu","hivern"];
  if(x>=265.5 && x<354.5) return ["tardor","primavera"];
  return ["hivern","estiu"];
}
$("distBtn").addEventListener("click", e=>{ showDist=!showDist; e.currentTarget.setAttribute("aria-pressed", showDist); needDraw=true; });
$("contBtn").addEventListener("click", e=>{ showCont=!showCont; e.currentTarget.setAttribute("aria-pressed", showCont); needDraw=true; });
$("ghostBtn").addEventListener("click", e=>{ showGhosts=!showGhosts; e.currentTarget.setAttribute("aria-pressed", showGhosts); needDraw=true; });
const credBtn=$("credBtn"), credBox=$("credBox");
function setCredits(open){ credBox.hidden=!open; credBtn.setAttribute("aria-expanded", open); if(open) $("credClose").focus(); }
credBtn.addEventListener("click", e=>{ e.stopPropagation(); setCredits(credBox.hidden); });
$("credClose").addEventListener("click", ()=>{ setCredits(false); credBtn.focus(); });
document.addEventListener("click", e=>{ if(!credBox.hidden && !credBox.contains(e.target) && e.target!==credBtn) setCredits(false); });
document.addEventListener("keydown", e=>{
  if(!credBox.hidden){ if(e.key==="Escape"){ setCredits(false); credBtn.focus(); } return; }
  if(e.target===slider) return;
  if(e.code==="Space"){ e.preventDefault(); ensureAudio(); target=cur; setPlaying(!playing); }
  else if(e.key==="ArrowRight"){ ensureAudio(); goNext(); }
  else if(e.key==="ArrowLeft"){ ensureAudio(); goPrev(); }
});

/* ---------- So ---------- */
let actx=null, muted=false, lastSound=0;
function ensureAudio(){
  if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ try{ actx=new AC(); }catch(e){} } }
  if(actx && actx.state==="suspended") actx.resume();
}
document.addEventListener("pointerdown", ensureAudio);
function tone(f,dur,vol,type="sine",delay=0){
  if(muted||!actx||actx.state!=="running") return;
  const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
}
function tick(){ const now=performance.now(); if(now-lastSound<60) return; lastSound=now; tone(1700,0.035,0.03,"triangle"); tone(850,0.03,0.018); }
function chime(kind){
  lastSound=performance.now()+250;
  if(kind==="eq"){ tone(659.3,1.3,0.14); tone(987.8,1.5,0.09,"sine",0.13); }
  else if(kind==="sol"){ tone(784,1.3,0.12); tone(987.8,1.3,0.09,"sine",0.1); tone(1318.5,1.8,0.07,"sine",0.2); }
  else { tone(196,1.1,0.2); tone(146.8,1.4,0.16,"sine",0.18); }
}
$("muteBtn").addEventListener("click", e=>{ muted=!muted; e.currentTarget.textContent=muted?"🔇":"🔊"; e.currentTarget.setAttribute("aria-label", muted?"Activa el so":"Silencia el so"); });
function soundsBetween(a,b){
  if(a===b) return; const lo=Math.min(a,b), hi=Math.max(a,b); let c=false;
  for(const e of ALL){ const t=e.day+Math.ceil((lo-e.day)/Y)*Y; if(t>lo && t<=hi){ chime(e.kind); c=true; } }
  if(!c && Math.floor(a/7)!==Math.floor(b/7)) tick();
}

/* ---------- Pantalla completa ---------- */
const fsBtn=$("fsBtn"), root=document.documentElement;
if(!(root.requestFullscreen||root.webkitRequestFullscreen)) fsBtn.style.display="none";
fsBtn.addEventListener("click", ()=>{
  if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else { const p=(root.requestFullscreen||root.webkitRequestFullscreen).call(root); if(p&&p.catch) p.catch(()=>{}); }
});

/* ---------- Globus terrestre ---------- */
const DAY=[247,208,56], NIGHT=[61,116,196], MARGIN=1.4;
// [latitud, gruix, discontinu, color, nom curt]
const PARALLELS=[
  [66.56,2.6,[6,4],"#ffffff","C.P. àrtic"],
  [23.44,3,[],"#ffffff","T. Càncer"],
  [0,4,[],"#ff7a00","Equador"],
  [-23.44,3,[],"#ffffff","T. Capricorn"],
  [-66.56,2.6,[6,4],"#ffffff","C.P. antàrtic"]
];
function parallelPoint(lat,t){ const s=Math.sin(lat*RAD), c=Math.cos(lat*RAD), ct=Math.cos(t), st=Math.sin(t);
  return [AX[0]*s+c*(E1[0]*ct+E2[0]*st), AX[1]*s+c*(E1[1]*ct+E2[1]*st), AX[2]*s+c*(E1[2]*ct+E2[2]*st)]; }
// Continents elementals: el·lipses en latitud/longitud sobre una graella d'1°
const LAND=new Uint8Array(360*180);
(function(){
  const B=[ // [lat, lon, radi lat, radi lon]
    [52,-100,16,30],[36,-95,11,19],[22,-102,7,8],[63,-150,7,16],[70,-95,8,25],[72,-40,10,16],[14,-87,5,5],[48,-65,6,8],
    [-5,-62,14,16],[-22,-58,12,10],[-40,-67,11,6],[6,-70,6,8],
    [48,10,9,16],[62,18,8,12],[40,-4,4,5],[54,-2,4,3],[42,13,3,2],
    [14,10,11,26],[0,21,12,14],[-18,26,11,11],[-30,23,5,8],[-19,47,5,2.5],
    [56,95,14,48],[65,120,9,40],[36,82,11,30],[21,78,9,7],[14,102,8,6],[34,112,10,14],[23,46,8,9],[60,160,8,12],[36,138,5,3],
    [-2,114,3,13],[-4,138,4,8],
    [-25,134,10,17],[-42,172,4,3]
  ];
  for(let i=0;i<180;i++){ const lat=89.5-i;
    for(let j=0;j<360;j++){ const lon=-179.5+j; let land=lat<-70;
      for(const [a,b,ra,rb] of B){ let dl=lon-b; dl=((dl+540)%360)-180; const q=((lat-a)/ra)**2+(dl/rb)**2; if(q<1){land=true;break;} }
      LAND[i*360+j]=land?1:0; } }
})();
const LAND_DAY=[112,160,66], LAND_NIGHT=[24,52,104];
const SE=Math.sin(EPS), CE=Math.cos(EPS);
function renderGlobe(canvas, G, sdir, rot=0, contA=0){
  const dpr=window.devicePixelRatio||1, size=Math.ceil(2*MARGIN*G*dpr);
  if(canvas.width!==size){ canvas.width=size; canvas.height=size; }
  const ctx=canvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,size,size);
  const img=ctx.createImageData(size,size), px=img.data, Gp=G*dpr, c0=size/2;
  for(let j=0;j<size;j++){
    const v=-(j+0.5-c0)/Gp;
    for(let i=0;i<size;i++){
      const u=(i+0.5-c0)/Gp, rr=u*u+v*v; if(rr>1) continue;
      const w=Math.sqrt(1-rr);
      const nx=u, ny=v*SB-w*CB, nz=v*CB+w*SB;   // normal en coordenades del món
      const lit=nx*sdir[0]+ny*sdir[1];
      const t=Math.min(1,Math.max(0,(lit+0.02)/0.04));
      let dr=DAY[0], dg=DAY[1], db=DAY[2], nr=NIGHT[0], ng=NIGHT[1], nb=NIGHT[2];
      if(contA>0){
        const na=nx*SE+nz*CE;
        const lat=Math.asin(Math.max(-1,Math.min(1,na)))/RAD;
        const lon=(Math.atan2(ny, nx*CE-nz*SE)-rot)/RAD;
        const li=Math.min(179,Math.max(0,Math.floor(90-lat))), lj=Math.floor(((lon+180)%360+360)%360)%360;
        if(LAND[li*360+lj]){
          dr+=(LAND_DAY[0]-dr)*contA; dg+=(LAND_DAY[1]-dg)*contA; db+=(LAND_DAY[2]-db)*contA;
          nr+=(LAND_NIGHT[0]-nr)*contA; ng+=(LAND_NIGHT[1]-ng)*contA; nb+=(LAND_NIGHT[2]-nb)*contA;
        }
      }
      const shade=0.74+0.26*w, k=(j*size+i)*4;
      px[k]  =(nr+(dr-nr)*t)*shade;
      px[k+1]=(ng+(dg-ng)*t)*shade;
      px[k+2]=(nb+(db-nb)*t)*shade;
      px[k+3]=255*Math.min(1,(1-Math.sqrt(rr))*Gp);
    }
  }
  ctx.putImageData(img,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=MARGIN*G, cy=MARGIN*G;
  const scr=P=>[cx+G*P[0], cy-G*(P[1]*SB+P[2]*CB)];
  // paral·lels: nucli de color (blanc o taronja) amb vora negra, visibles sobre groc i sobre blau
  const f=Math.max(0.8,G/70);
  ctx.lineCap="butt"; ctx.lineJoin="round";
  for(const [lat,lw,dash,col] of PARALLELS){
    ctx.beginPath(); let pen=false;
    for(let i=0;i<=200;i++){
      const P=parallelPoint(lat,i/200*TAU);
      if(depthOf(P)>=0){ const q=scr(P); pen?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); pen=true; } else pen=false;
    }
    ctx.setLineDash([]); ctx.strokeStyle="#000"; ctx.lineWidth=(lw+3)*f; ctx.stroke();
    ctx.setLineDash(dash.map(x=>x*f)); ctx.strokeStyle=col; ctx.lineWidth=lw*f; ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,G,0,TAU); ctx.stroke();
  const n=scr([AX[0]*1.3,AX[1]*1.3,AX[2]*1.3]), sPt=scr([-AX[0]*1.3,-AX[1]*1.3,-AX[2]*1.3]);
  ctx.strokeStyle="#fff"; ctx.lineWidth=Math.max(3,G/16); ctx.beginPath(); ctx.moveTo(n[0],n[1]); ctx.lineTo(sPt[0],sPt[1]); ctx.stroke();
  ctx.strokeStyle="#000"; ctx.lineWidth=Math.max(1.4,G/34); ctx.beginPath(); ctx.moveTo(n[0],n[1]); ctx.lineTo(sPt[0],sPt[1]); ctx.stroke();
  return canvas;
}

/* ---------- Dibuix de l'escena ---------- */
let W=0,H=0,L=null, needDraw=true, lastDrawn=null;
const moving=document.createElement("canvas");
let ghostCache=[];
const STARS=[]; {let s=11; const r=()=>{s=(s*16807)%2147483647; return s/2147483647;}; for(let i=0;i<160;i++) STARS.push([r(),r(),r()]);}
function font(px,b){ return (b?"700 ":"400 ")+px+'px "Atkinson Hyperlegible", system-ui, sans-serif'; }

function layout(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const fs=Math.max(13, Math.min(22, w/58));
  const side=w>=700;
  const top=(side?fs*3.9:fs*2.7)+14;
  const hud=Math.min(90, h*0.12);
  const Rx1=(h/2 - top - 6)/(SB+0.28);
  const Rx2= side ? (w/2 - 9.2*fs - 12)/1.28 : (w/2 - 8)/1.28;
  const Rx=Math.max(60, Math.min(Rx1,Rx2));
  const G=Rx*0.23;
  return {w,h,fs,side,Rx,G,cx:w/2,cy:h/2};
}
const toScreen=P=>[L.cx+L.Rx*P[0], L.cy-L.Rx*(P[1]*SB+P[2]*CB)];
const sunDirFrom=P=>{ const m=Math.hypot(P[0],P[1]); return [-P[0]/m,-P[1]/m]; };

function drawGlobeAt(ctx, globeCanvas, sc, alpha){
  const s=MARGIN*L.G;
  ctx.save(); ctx.globalAlpha=alpha; ctx.drawImage(globeCanvas, sc[0]-s, sc[1]-s, 2*s, 2*s); ctx.restore();
}
function drawSun(ctx){
  const r=L.G*0.36, x=L.cx, y=L.cy;
  const g=ctx.createRadialGradient(x,y,0,x,y,r*3);
  g.addColorStop(0,"rgba(255,230,120,.9)"); g.addColorStop(0.4,"rgba(247,208,56,.35)"); g.addColorStop(1,"rgba(247,208,56,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*3,0,TAU); ctx.fill();
  ctx.strokeStyle="#f7d038"; ctx.lineWidth=Math.max(1.5,r/10);
  for(let i=0;i<24;i++){ const a=i/24*TAU; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r*1.25,y+Math.sin(a)*r*1.25); ctx.lineTo(x+Math.cos(a)*r*1.5,y+Math.sin(a)*r*1.5); ctx.stroke(); }
  ctx.fillStyle="#fff1b0"; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.strokeStyle="#f7d038"; ctx.lineWidth=Math.max(2,r/8); ctx.stroke();
}
// Feix de raigs paral·lels que arriben del Sol; el central marca on cau perpendicular
function drawRays(ctx, P, sc, alpha, front){
  if(alpha<=0) return;
  const s2=sunDirFrom(P), S=[s2[0],s2[1],0], G=L.G;
  const scr=Q=>[sc[0]+G*Q[0], sc[1]-G*(Q[1]*SB+Q[2]*CB)];
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineCap="round";
  for(const k of [-0.8,-0.55,-0.3,0,0.3,0.55,0.8]){
    const c=Math.sqrt(1-k*k);
    const Hh=[S[0]*c, S[1]*c, k];
    const isFront = depthOf(Hh) >= -0.02;
    if(isFront!==front) continue;
    const St=[Hh[0]+S[0]*1.25, Hh[1]+S[1]*1.25, Hh[2]];
    const a=scr(St), b=scr(Hh);
    ctx.strokeStyle= k===0 ? "#f7d038" : "rgba(247,208,56,.75)";
    ctx.lineWidth = k===0 ? Math.max(3.5,G*0.06) : Math.max(1.5,G*0.022);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    if(k===0 && front){
      ctx.fillStyle="#ff7a00"; ctx.strokeStyle="#000"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(b[0],b[1],Math.max(5,G*0.075),0,TAU); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawParallelNames(ctx, P, sc, alpha){
  if(alpha<=0) return;
  const G=L.G, sx=sunDirFrom(P)[0];
  const toLeft = sx > -0.3;              // si el Sol és a la dreta (o al davant/darrere), noms a l'esquerra
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.font=font(Math.max(10,L.fs*0.62),true); ctx.textBaseline="middle"; ctx.lineJoin="round";
  for(const [lat,,,col,name] of PARALLELS){
    let best=null;
    for(let i=0;i<200;i++){
      const Q=parallelPoint(lat,i/200*TAU); if(depthOf(Q)<0) continue;
      const x=Q[0]; if(!best || (toLeft ? x<best[0] : x>best[0])) best=Q;
    }
    if(!best) continue;
    const q=[sc[0]+G*best[0], sc[1]-G*(best[1]*SB+best[2]*CB)];
    const x = toLeft ? q[0]-6 : q[0]+6;
    ctx.textAlign = toLeft ? "right" : "left";
    ctx.strokeStyle="#000"; ctx.lineWidth=4; ctx.strokeText(name,x,q[1]);
    ctx.fillStyle=col; ctx.fillText(name,x,q[1]);
  }
  ctx.restore();
}
function drawLabel(ctx, e, sc, active){
  const fs=L.fs, G=L.G;
  const lines=[[e.date,font(fs*1.05,true),active?"#ff7a00":"#fff"],[e.name,font(fs*0.9,true),"#ff7a00"]];
  if(L.side){
    const parts=[]; if(showHN) parts.push(e.hn); if(showHS) parts.push(e.hs);
    if(e.place==="left"||e.place==="right"){ for(const t of parts) lines.push([t,font(fs*0.8),"#bdbdbd"]); }
    else if(parts.length) lines.push([parts.join(" · "),font(fs*0.8),"#bdbdbd"]);
  }
  const lh=fs*1.25, total=lines.length*lh;
  let x=sc[0], y, align="center";
  if(L.side && e.place==="left"){ x=sc[0]-G*1.2-10; align="right"; y=sc[1]-total/2; }
  else if(L.side && e.place==="right"){ x=sc[0]+G*1.2+10; align="left"; y=sc[1]-total/2; }
  else if(e.place==="top"){ y=sc[1]-G*1.22-8-total; }
  else { y=sc[1]+G*1.22+8; }
  ctx.textAlign=align; ctx.textBaseline="top";
  if(align==="center"){ ctx.font=lines[0][1]; let maxw=0; for(const l of lines){ ctx.font=l[1]; maxw=Math.max(maxw,ctx.measureText(l[0]).width); } x=Math.min(Math.max(x,maxw/2+6),L.w-maxw/2-6); }
  lines.forEach((l,i)=>{ ctx.font=l[1]; ctx.fillStyle=l[2]; ctx.fillText(l[0],x,y+i*lh); });
}

function draw(){
  const w=stage.clientWidth, h=stage.clientHeight, dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  if(!L || L.w!==w || L.h!==h){ L=layout(); ghostCache=[]; }
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h);
  for(const [x,y,s] of STARS){ ctx.fillStyle="rgba(255,255,255,"+(0.12+s*0.35)+")"; ctx.fillRect(x*w,y*h,s<0.85?1:2,s<0.85?1:2); }

  // òrbita discontínua
  ctx.setLineDash([L.Rx*0.05, L.Rx*0.035]); ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=Math.max(2,L.Rx*0.009);
  ctx.beginPath(); for(let i=0;i<=200;i++){ const q=toScreen(worldPos(i/200*TAU)); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); } ctx.stroke(); ctx.setLineDash([]);

  // periheli i afeli
  if(showDist) [[0,"3 gen · periheli","147 milions de km"],[Math.PI,"4 jul · afeli","152 milions de km"]].forEach(([nu,lab,dist])=>{
    const q=toScreen(worldPos(nu));
    ctx.setLineDash([3,5]); ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L.cx,L.cy); ctx.lineTo(q[0],q[1]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#d0d0d0"; ctx.beginPath(); ctx.arc(q[0],q[1],Math.max(3.5,L.G*0.07),0,TAU); ctx.fill();
    if(Math.abs(mod(mod(cur,Y)-(nu===0?2.5:184.5)+Y/2,Y)-Y/2)<30) return;
    const mx=L.cx+(q[0]-L.cx)*0.36, my=L.cy+(q[1]-L.cy)*0.36;
    ctx.font=font(L.fs*(L.side?0.72:0.62)); ctx.fillStyle="rgba(255,255,255,.7)"; ctx.textAlign="center";
    ctx.textBaseline = nu===0 ? "bottom" : "top";
    ctx.fillText(dist, mx, my + (nu===0?-4:4));
    ctx.textBaseline = nu===0 ? "top" : "bottom";
    ctx.fillText(lab, mx, my + (nu===0?4:-4));
  });

  // objectes ordenats per profunditat
  const objs=[{depth:0, draw:()=>drawSun(ctx)}];
  const dm=mod(cur,Y);
  if(showGhosts){
    MAIN.forEach((e,i)=>{
      const P=worldPos(astro(e.day).nu), sc=toScreen(P);
      const dist=Math.abs(mod(dm-e.day+Y/2,Y)-Y/2);
      if(dist<6) return;
      if(!ghostCache[i]) ghostCache[i]=renderGlobe(document.createElement("canvas"), L.G, sunDirFrom(P));
      objs.push({depth:depthOf(P), draw:()=>drawGlobeAt(ctx, ghostCache[i], sc, 0.42)});
    });
  }
  const P=worldPos(astro(cur).nu), sc=toScreen(P);
  const st=astro(cur);
  if(showDist){
    ctx.setLineDash([4,5]); ctx.strokeStyle="rgba(247,208,56,.55)"; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(L.cx,L.cy); ctx.lineTo(sc[0],sc[1]); ctx.stroke(); ctx.setLineDash([]);
  }
  renderGlobe(moving, L.G, sunDirFrom(P), rot, showCont?stopA:0);
  objs.push({depth:depthOf(P)+0.001, draw:()=>{ drawRays(ctx,P,sc,stopA,false); drawGlobeAt(ctx, moving, sc, 1); drawRays(ctx,P,sc,stopA,true); }});
  objs.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());
  if(showDist){
    const dx=sc[0]-L.cx, dy=sc[1]-L.cy, m=Math.hypot(dx,dy)||1;
    const k=Math.max(L.G*0.36*2.4, Math.min(m*0.5, m-L.G*2.5));
    let lx=L.cx+dx/m*k, ly=L.cy+dy/m*k;
    const txt=(149.6*st.r).toLocaleString("ca-ES",{minimumFractionDigits:1,maximumFractionDigits:1})+" milions de km";
    ctx.font=font(L.fs*(L.side?0.72:0.62),true); ctx.textAlign="center"; ctx.textBaseline="middle";
    const tw=ctx.measureText(txt).width;
    lx+= -dy/m*(L.fs*0.8); ly+= dx/m*(L.fs*0.8);
    ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillRect(lx-tw/2-4, ly-L.fs*0.5, tw+8, L.fs);
    ctx.fillStyle="#f7d038"; ctx.fillText(txt, lx, ly);
  }

  // etiquetes dels 4 moments
  MAIN.forEach(e=>{
    const sc2=toScreen(worldPos(astro(e.day).nu));
    const dist=Math.abs(mod(dm-e.day+Y/2,Y)-Y/2);
    drawLabel(ctx, e, sc2, dist<1);
  });

  // HUD
  $("hudDate").textContent=dateLabel(cur);
  let mom=""; for(const e of ALL){ if(Math.abs(mod(dm-e.day+Y/2,Y)-Y/2)<1){ mom=e.full; break; } }
  $("hudMoment").textContent=mom;
  const ss=seasonAt(cur);
  $("hudHN").innerHTML = showHN ? "Hemisferi nord: <b>"+ss[0]+"</b>" : "";
  $("hudHS").innerHTML = showHS ? "Hemisferi sud: <b>"+ss[1]+"</b>" : "";
  if(!dragging) slider.value=dm.toFixed(2);
}

/* ---------- Bucle ---------- */
let lastT=null, rot=0, stopA=0;
const ROT_SPEED=TAU/7; // una volta cada 7 s
function frame(t){
  const dt=lastT===null?0.016:Math.min(0.1,(t-lastT)/1000); lastT=t;
  if(playing){
    let nt=target+SPEED*dt;
    if(autoStop){
      let stopAt=Infinity;
      for(const e of MAIN){ let tt=e.day+Math.ceil((target-e.day)/Y)*Y; if(tt<=target) tt+=Y; if(tt<=nt) stopAt=Math.min(stopAt,tt); }
      if(stopAt<Infinity){ nt=stopAt; setPlaying(false); }
    }
    target=nt;
  }
  const prev=cur, diff=target-cur;
  if(Math.abs(diff)<0.001) cur=target; else cur+=diff*(1-Math.exp(-dt*(playing?25:7)));
  soundsBetween(prev,cur);
  const stopped=!playing && !dragging && Math.abs(target-cur)<0.02;
  const goal=stopped?1:0;
  const prevA=stopA;
  stopA+= (goal-stopA)*(1-Math.exp(-dt*(goal?3:10)));
  if(Math.abs(stopA-goal)<0.01) stopA=goal;
  if(stopA!==prevA) needDraw=true;
  if(stopA>0 && showCont){ rot+=ROT_SPEED*dt; needDraw=true; }
  if(needDraw||lastDrawn===null||Math.abs(cur-lastDrawn)>1e-4){ draw(); lastDrawn=cur; needDraw=false; }
  requestAnimationFrame(frame);
}
if("ResizeObserver" in window) new ResizeObserver(()=>{ needDraw=true; }).observe(stage);
window.addEventListener("resize", ()=>{ needDraw=true; });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ needDraw=true; });
requestAnimationFrame(frame);
})();
</script>
