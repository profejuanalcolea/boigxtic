  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.generateMipmap(gl.TEXTURE_2D);
  const an=gl.getExtension('EXT_texture_filter_anisotropic');if(an)gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,4);return t;}

/* ---------- procedural clouds (seamless on the sphere) ---------- */
function makeClouds(W,Hh){
  const P=new Uint8Array(512);{let s=1234;const p=[...Array(256).keys()];for(let i=255;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)P[i]=p[i&255];}
  const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+(b-a)*t;
  const grad=(h,x,y,z)=>{const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);};
  function noise(x,y,z){const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);const u=fade(x),v=fade(y),w=fade(z);
    const A=P[X]+Y,AA=P[A]+Z,AB=P[A+1]+Z,B=P[X+1]+Y,BA=P[B]+Z,BB=P[B+1]+Z;
    return lerp(lerp(lerp(grad(P[AA]&15,x,y,z),grad(P[BA]&15,x-1,y,z),u),lerp(grad(P[AB]&15,x,y-1,z),grad(P[BB]&15,x-1,y-1,z),u),v),lerp(lerp(grad(P[AA+1]&15,x,y,z-1),grad(P[BA+1]&15,x-1,y,z-1),u),lerp(grad(P[AB+1]&15,x,y-1,z-1),grad(P[BB+1]&15,x-1,y-1,z-1),u),v),w);}
  function fbm(x,y,z,o){let s=0,a=0.5,f=1;for(let i=0;i<o;i++){s+=a*noise(x*f,y*f,z*f);f*=2.03;a*=0.5;}return s;}
  const d=new Uint8Array(W*Hh);
  for(let j=0;j<Hh;j++){const lat=(0.5-(j+0.5)/Hh)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat),al=Math.abs(lat*180/Math.PI);
    // more cloud near the equator (ITCZ) and at mid-latitudes, less in the subtropics
    const band=0.55+0.35*Math.exp(-Math.pow(al/8,2))+0.45*Math.exp(-Math.pow((al-55)/14,2))-0.25*Math.exp(-Math.pow((al-25)/9,2));
    for(let i=0;i<W;i++){const lon=((i+0.5)/W-0.5)*2*Math.PI;const x=cl*Math.sin(lon)*3.4,y=sl*3.4,z=cl*Math.cos(lon)*3.4;
      const wx=fbm(x+3.1,y,z,4)*2.2,wy=fbm(x,y+7.3,z,4)*2.2;
      let n=fbm(x+wx,y*1.9+wy,z+wx*0.5,7);const fine=fbm(x*3.1+wy,y*5.0,z*3.1,4);n=n*1.3+fine*0.35+0.55*(band-0.55);
      let c=Math.max(0,Math.min(1,(n+0.02)*2.6));c=c*c*(3-2*c);
      d[j*W+i]=Math.round(c*220);}}
  return {w:W,h:Hh,data:d};}

let start=performance.now();
function resize(){const d=Math.min(window.devicePixelRatio||1,2);const s=sq.clientWidth;cv.width=Math.round(s*d);cv.height=Math.round(s*d);gl.viewport(0,0,cv.width,cv.height);drawStars();}
function init(){
  tex(0,document.getElementById('dayImg'),gl.RGB);tex(1,document.getElementById('maskImg'),gl.R8);
  gl.uniform1i(U('uDay'),0);gl.uniform1i(U('uMask'),1);gl.uniform1i(U('uCloud'),2);
  tex(2,{w:4,h:4,data:new Uint8Array(16)});
  gl.uniform3f(U('uSun'),0.42,-0.22,0.88);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  resize();window.addEventListener('resize',resize);
  setTimeout(()=>{tex(2,makeClouds(1024,512));},30);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now){const t=(now-start)/1000*(reduce?0.25:1);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U('uRot'),-LON0+t*2*Math.PI/PERIOD);gl.uniform1f(U('uCRot'),-LON0+t*2*Math.PI/PERIOD*1.035);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);}
const imgs=[document.getElementById('dayImg'),document.getElementById('maskImg')];
Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r;}))).then(init);
})();
</script>
