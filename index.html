<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boigxtic · Apps de classe</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/ammo-32.png">
<link rel="apple-touch-icon" href="img/ammo-192.png">
<style>
  :root { --taronja:#f26b1d; --negre:#111; --gris:#666; --linia:#e5e5e5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--negre); background:#fff; font-size:20px; }
  header { display:flex; align-items:center; gap:20px; padding:20px 40px; border-bottom:4px solid var(--taronja); flex-wrap:wrap; }
  #ammo { width:80px; height:80px; border-radius:50%; background:#FFE8D8; display:flex; align-items:center; justify-content:center; flex:0 0 auto; position:relative; cursor:pointer; }
  #ammo svg { margin-left:5px; overflow:visible; transform-origin:50% 55%; }

  /* Animacions de l'Ammo (les mateixes que a la Llibreta del Profe) */
  .amb .jump,.amb .bob,.amb .body,.amb .tent,.amb .eye,.amb .lid,.amb .spark{transform-box:fill-box}
  .amb .afx{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .amb.am-flota .bob{animation:amFlota 3.2s ease-in-out infinite;transform-origin:50% 50%}
  @keyframes amFlota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .amb.am-parpella .eye{animation:amUll 1.2s}.amb.am-parpella .lid{animation:amPar 1.2s}
  @keyframes amUll{0%,30%,48%,62%,80%,100%{opacity:1}32%,46%,64%,78%{opacity:0}}@keyframes amPar{0%,30%,48%,62%,80%,100%{opacity:0}32%,46%,64%,78%{opacity:1}}
  .amb.am-saluda .tent{animation:amTent .32s ease-in-out 4 alternate;transform-origin:0% 50%}.amb.am-saluda .tent:nth-of-type(2){animation-delay:.08s}.amb.am-saluda .tent:nth-of-type(3){animation-delay:.16s}
  @keyframes amTent{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
  .amb.am-salta .jump{animation:amSalta .9s cubic-bezier(.3,.7,.4,1);transform-origin:50% 100%}
  @keyframes amSalta{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-22px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
  .amb.am-gira svg{animation:amGira 1s ease-in-out}@keyframes amGira{to{transform:rotate(360deg)}}
  .amb.am-balanc svg{animation:amBal 1.8s ease-in-out;transform-origin:50% 60%}@keyframes amBal{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}70%{transform:rotate(18deg)}}
  .amb.am-mira .jump{animation:amMira 2.4s ease-in-out;transform-origin:50% 50%}@keyframes amMira{0%,100%{transform:scaleX(1)}12%,55%{transform:scaleX(-1)}}
  .amb.am-idea .spark{animation:amSpark 1.4s ease-out;transform-origin:50% 50%}.amb.am-idea .eye{animation:amObre 1.4s;transform-origin:50% 50%}
  @keyframes amSpark{0%{opacity:0;transform:scale(.2) rotate(0)}20%{opacity:1;transform:scale(1.3) rotate(40deg)}60%{opacity:1;transform:scale(1) rotate(90deg)}100%{opacity:0;transform:scale(.6) rotate(140deg)}}
  @keyframes amObre{0%,100%{transform:scale(1)}20%,60%{transform:scale(1.25)}}
  .amb.am-amaga .body{animation:amAmaga .7s ease-in forwards;transform-origin:0% 0%}
  @keyframes amAmaga{to{transform:translate(-3px,-5px) scale(.08);opacity:0}}
  .amb.am-surt .body{animation:amSurt .6s cubic-bezier(.3,1.5,.5,1);transform-origin:0% 0%}
  @keyframes amSurt{from{transform:translate(-3px,-5px) scale(.08);opacity:0}to{transform:none;opacity:1}}
  .amb .abub{position:absolute;border:2px solid #4a90c2;border-radius:50%;opacity:0;animation:amBub 1.7s ease-out forwards}
  @keyframes amBub{0%{opacity:0;transform:translateY(0) scale(.4)}15%{opacity:.9}100%{opacity:0;transform:translateY(-60px) scale(1)}}
  .amb .azz{position:absolute;font:800 14px system-ui,sans-serif;color:#7a5a3a;opacity:0;animation:amZz 2.6s ease-out forwards}
  @keyframes amZz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-44px) scale(1.25)}}
  @media(prefers-reduced-motion:reduce){.amb *,.amb{animation:none!important}}
  header h1 { margin:0; font-size:2.2rem; letter-spacing:-.5px; }
  header p { margin:2px 0 0; color:var(--gris); font-size:1rem; }
  .eines { margin-left:auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #cerca { font-size:1.1rem; padding:10px 16px; border:2px solid var(--negre); border-radius:10px; width:280px; }
  #cerca:focus { outline:none; border-color:var(--taronja); }
  nav { display:flex; gap:8px; padding:16px 40px 0; flex-wrap:wrap; }
  nav a { text-decoration:none; color:var(--negre); border:2px solid var(--negre); border-radius:999px; padding:6px 16px; font-size:1rem; font-weight:600; }
  nav a.actiu, nav a:hover { background:var(--negre); color:#fff; }
  main { padding:10px 40px 60px; }
  section h2 { font-size:1.6rem; margin:30px 0 14px; display:flex; align-items:center; gap:12px; }
  section h2::before { content:""; width:14px; height:28px; background:var(--taronja); border-radius:3px; }
  section h2 .n { color:var(--gris); font-weight:400; font-size:1rem; }
  .graella { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .targeta { border:2px solid var(--linia); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:8px; transition:border-color .15s; }
  .targeta:hover { border-color:var(--taronja); }
  .targeta h3 { margin:0; font-size:1.3rem; }
  .targeta h3 a { color:var(--negre); text-decoration:none; }
  .targeta h3 a:hover { color:var(--taronja); }
  .targeta .desc { margin:0; color:var(--gris); font-size:1rem; flex:1; }
  .etiquetes { display:flex; gap:6px; flex-wrap:wrap; }
  .etiqueta { font-size:.8rem; font-weight:700; padding:2px 10px; border-radius:999px; background:#f3f3f3; }
  .etiqueta.ext { background:#fff1e8; color:var(--taronja); }
  .botons { display:flex; gap:8px; margin-top:4px; }
  .botons a, .botons button { font:inherit; font-size:.95rem; font-weight:600; padding:8px 14px; border-radius:10px; cursor:pointer; text-decoration:none; }
  .obrir { background:var(--taronja); color:#fff; border:2px solid var(--taronja); }
  .copiar { background:#fff; color:var(--negre); border:2px solid var(--negre); }
  .copiar.fet { background:var(--negre); color:#fff; }
  .pendent { opacity:.45; }
  .pendent .botons { display:none; }
  .buit { color:var(--gris); font-style:italic; }
  footer { text-align:center; color:var(--gris); font-size:.9rem; padding:20px; border-top:1px solid var(--linia); }
</style>
</head>

<nav id="menu"></nav>
<main id="contingut"></main>
<footer>J Alcolea · Ins Júlia Minguell</footer>

<script src="apps.js"></script>
<script>
  const menu = document.getElementById("menu");
  const contingut = document.getElementById("contingut");
  const cerca = document.getElementById("cerca");

  const urlAbsoluta = u => new URL(u, location.href).href;
  const esExterna = u => /^https?:\/\//.test(u) && new URL(u).host !== location.host;
  const net = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  function pinta() {
    const filtre = location.hash.slice(1);
    const q = net(cerca.value);

    menu.innerHTML = `<a href="#" class="${filtre ? "" : "actiu"}">Totes</a>` +
      MATERIES.map(m => `<a href="#${m.id}" class="${filtre === m.id ? "actiu" : ""}">${m.nom}</a>`).join("");

    contingut.innerHTML = "";
    MATERIES.filter(m => !filtre || m.id === filtre).forEach(m => {
      const apps = APPS.filter(a => a.materia === m.id &&
        (!q || net(a.titol + " " + a.desc + " " + a.nivell).includes(q)));
      if (q && !apps.length) return;

      const s = document.createElement("section");
      s.innerHTML = `<h2>${m.nom} <span class="n">${apps.length}</span></h2><div class="graella"></div>`;
      const g = s.querySelector(".graella");
      if (!apps.length) g.innerHTML = `<p class="buit">Encara no hi ha apps.</p>`;

      apps.forEach(a => {
        const t = document.createElement("div");
        t.className = "targeta" + (a.url ? "" : " pendent");
        const ext = a.url && esExterna(a.url);
        t.innerHTML = `
          <h3>${a.url ? `<a href="${a.url}">${a.titol}</a>` : a.titol}</h3>
          <div class="etiquetes">
            ${a.nivell ? `<span class="etiqueta">${a.nivell}</span>` : ""}
            ${ext ? `<span class="etiqueta ext">🔗 externa</span>` : ""}
            ${a.url ? "" : `<span class="etiqueta">pendent</span>`}
          </div>
          <p class="desc">${a.desc || ""}</p>
          <div class="botons">
            <a class="obrir" href="${a.url}">Obrir</a>
            <button class="copiar">📋 Copiar enllaç</button>
          </div>`;
        const b = t.querySelector(".copiar");
        b.onclick = () => {
          navigator.clipboard.writeText(urlAbsoluta(a.url)).then(() => {
            b.textContent = "✓ Copiat"; b.classList.add("fet");
            setTimeout(() => { b.textContent = "📋 Copiar enllaç"; b.classList.remove("fet"); }, 1500);
          });
        };
        g.appendChild(t);
      });
      contingut.appendChild(s);
    });

    if (!contingut.children.length) contingut.innerHTML = `<p class="buit" style="margin-top:30px">Cap app coincideix amb «${cerca.value}».</p>`;
  }

  cerca.addEventListener("input", pinta);
  window.addEventListener("hashchange", pinta);
  pinta();

  /* ---- Ammo: flota, cada 6-10 s fa alguna cosa; si fa 1 min que no toques res, dorm; clica'l i fa una cosa nova ---- */
  const AM_ACC=['parpella','saluda','salta','gira','balanc','mira','idea','bombolles'],
        AM_DUR={parpella:1300,saluda:1500,salta:1000,gira:1100,balanc:1900,mira:2500,idea:1500,bombolles:1900};
  const amReduit=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ammo=document.getElementById('ammo');
  const AM={ult:'',quiet:Date.now(),dorm:false,zt:null};
  function amFx(k){let f=ammo.querySelector('.afx');if(!f){f=document.createElement('div');f.className='afx';ammo.appendChild(f)}f.innerHTML='';
    if(k==='bombolles')[0,1,2].forEach(i=>{const b=document.createElement('i');b.className='abub';const z=6+i*3;b.style.cssText=`width:${z}px;height:${z}px;left:${60+i*5}%;top:56%;animation-delay:${i*.35}s`;f.appendChild(b)});
    if(k==='zz')[0,1,2].forEach(i=>{const z=document.createElement('span');z.className='azz';z.textContent='z';z.style.cssText=`left:55%;top:30%;font-size:${11+i*4}px;animation-delay:${i*.7}s`;f.appendChild(z)})}
  function amFes(k,base='flota'){if(amReduit())return;ammo.className='amb'+(base?' am-'+base:'');void ammo.offsetWidth;ammo.classList.add('am-'+k);amFx(k);
    clearTimeout(ammo._t);if(k!=='amaga')ammo._t=setTimeout(()=>ammo.classList.remove('am-'+k),AM_DUR[k]||1500)}
  function amTria(){let k;do k=AM_ACC[Math.floor(Math.random()*AM_ACC.length)];while(k===AM.ult);AM.ult=k;return k}
  function amTic(){
    if(!AM.dorm&&Date.now()-AM.quiet>60000){AM.dorm=true;amFes('amaga',null);const zz=()=>{if(AM.dorm){amFx('zz');AM.zt=setTimeout(zz,3200)}};AM.zt=setTimeout(zz,800)}
    else if(!AM.dorm&&!document.hidden)amFes(amTria());
    setTimeout(amTic,6000+Math.random()*4000)}
  function amDesperta(){AM.quiet=Date.now();if(AM.dorm){AM.dorm=false;clearTimeout(AM.zt);amFes('surt');setTimeout(()=>amFes('parpella'),700)}}
  ['pointermove','keydown','pointerdown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,amDesperta,{passive:true}));
  ammo.addEventListener('click',()=>{if(!AM.dorm)amFes(amTria())});
  if(!amReduit()){ammo.className='amb am-flota';setTimeout(()=>amFes('saluda'),500);setTimeout(amTic,6000+Math.random()*3000)}
</script>
