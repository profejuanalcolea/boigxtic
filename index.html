<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boigxtic · Apps de classe</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/ammo-32.png">
<link rel="apple-touch-icon" href="img/ammo-192.png">
<style>
  :root { --taronja:#f26b1d; --negre:#111; --gris:#666; --linia:#e5e5e5; --fons:#fff; --suau:#f3f3f3; --granat:#8c1d2c; }
  body.fosc { --negre:#eee; --gris:#a8a8a8; --linia:#333; --fons:#141414; --suau:#262626; }
  body.fosc #ammo { background:#3a2a20; }
  body.fosc .etiqueta.ext { background:#3a2414; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--negre); background:var(--fons); font-size:20px; transition:background .2s,color .2s; }
  header { display:flex; align-items:center; gap:20px; padding:20px 40px; border-bottom:4px solid var(--taronja); flex-wrap:wrap; }
  #ammo { width:80px; height:80px; border-radius:50%; background:#FFE8D8; display:flex; align-items:center; justify-content:center; flex:0 0 auto; position:relative; cursor:pointer; }
  #ammo svg { margin-left:5px; overflow:visible; transform-origin:50% 55%; }

  /* Animacions de l'Ammo (les mateixes que a la Llibreta del Profe) */
  .amb .jump,.amb .bob,.amb .body,.amb .tent,.amb .eye,.amb .lid,.amb .spark{transform-box:fill-box}
  .amb .afx{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .amb.am-flota .bob{animation:amFlota 3.2s ease-in-out infinite;transform-origin:50% 50%}
  @keyframes amFlota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .amb.am-parpella .eye{animation:amUll 1.2s}.amb.am-parpella .lid{animation:amPar 1.2s}
  @keyframes amUll{0%,30%,48%,62%,80%,100%{opacity:1}32%,46%,64%,78%{opacity:0}}@keyframes amPar{0%,30%,48%,62%,80%,100%{opacity:0}32%,46%,64%,78%{opacity:1}}
  .amb.am-saluda .tent{animation:amTent .32s ease-in-out 4 alternate;transform-origin:0% 50%}.amb.am-saluda .tent:nth-of-type(2){animation-delay:.08s}.amb.am-saluda .tent:nth-of-type(3){animation-delay:.16s}
  @keyframes amTent{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
  .amb.am-salta .jump{animation:amSalta .9s cubic-bezier(.3,.7,.4,1);transform-origin:50% 100%}
  @keyframes amSalta{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-22px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
  .amb.am-gira svg{animation:amGira 1s ease-in-out}@keyframes amGira{to{transform:rotate(360deg)}}
  .amb.am-balanc svg{animation:amBal 1.8s ease-in-out;transform-origin:50% 60%}@keyframes amBal{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}70%{transform:rotate(18deg)}}
  .amb.am-mira .jump{animation:amMira 2.4s ease-in-out;transform-origin:50% 50%}@keyframes amMira{0%,100%{transform:scaleX(1)}12%,55%{transform:scaleX(-1)}}
  .amb.am-idea .spark{animation:amSpark 1.4s ease-out;transform-origin:50% 50%}.amb.am-idea .eye{animation:amObre 1.4s;transform-origin:50% 50%}
  @keyframes amSpark{0%{opacity:0;transform:scale(.2) rotate(0)}20%{opacity:1;transform:scale(1.3) rotate(40deg)}60%{opacity:1;transform:scale(1) rotate(90deg)}100%{opacity:0;transform:scale(.6) rotate(140deg)}}
  @keyframes amObre{0%,100%{transform:scale(1)}20%,60%{transform:scale(1.25)}}
  .amb.am-amaga .body{animation:amAmaga .7s ease-in forwards;transform-origin:0% 0%}
  @keyframes amAmaga{to{transform:translate(-3px,-5px) scale(.08);opacity:0}}
  .amb.am-surt .body{animation:amSurt .6s cubic-bezier(.3,1.5,.5,1);transform-origin:0% 0%}
  @keyframes amSurt{from{transform:translate(-3px,-5px) scale(.08);opacity:0}to{transform:none;opacity:1}}
  .amb .abub{position:absolute;border:2px solid #4a90c2;border-radius:50%;opacity:0;animation:amBub 1.7s ease-out forwards}
  @keyframes amBub{0%{opacity:0;transform:translateY(0) scale(.4)}15%{opacity:.9}100%{opacity:0;transform:translateY(-60px) scale(1)}}
  .amb .azz{position:absolute;font:800 14px system-ui,sans-serif;color:#7a5a3a;opacity:0;animation:amZz 2.6s ease-out forwards}
  @keyframes amZz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-44px) scale(1.25)}}
  @media(prefers-reduced-motion:reduce){.amb *,.amb{animation:none!important}}
  header h1 { margin:0; font-size:2.2rem; letter-spacing:-.5px; }
  header p { margin:2px 0 0; color:var(--gris); font-size:1rem; }
  .eines { margin-left:auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #cerca { font-size:1.1rem; padding:10px 16px; border:2px solid var(--negre); border-radius:10px; width:280px; background:var(--fons); color:var(--negre); }
  #cerca:focus { outline:none; border-color:var(--taronja); }
  nav { display:flex; gap:8px; padding:16px 40px 0; flex-wrap:wrap; }
  nav a { text-decoration:none; color:var(--negre); border:2px solid var(--negre); border-radius:999px; padding:6px 16px; font-size:1rem; font-weight:600; }
  nav a.actiu, nav a:hover { background:var(--negre); color:var(--fons); }
  main { padding:10px 40px 60px; }
  section h2 { font-size:1.6rem; margin:30px 0 14px; display:flex; align-items:center; gap:12px; }
  section h2::before { content:""; width:14px; height:28px; background:var(--taronja); border-radius:3px; }
  section h2 .n { color:var(--gris); font-weight:400; font-size:1rem; }
  section h2 { cursor:pointer; user-select:none; }
  section h2:hover { color:var(--taronja); }
  section h2 .fl { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; color:var(--gris); }
  section.plegat h2 .fl { transform:rotate(-90deg); }
  section.plegat .graella { display:none; }
  section.plegat h2 { margin-bottom:0; }
  #plegaTot { font:inherit; font-size:.95rem; font-weight:600; background:none; border:0; color:var(--gris); cursor:pointer; margin-left:auto; padding:6px 4px; }
  #plegaTot:hover { color:var(--taronja); }
  .graella { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .targeta { border:2px solid var(--linia); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:8px; transition:border-color .15s; }
  .targeta:hover { border-color:var(--taronja); }
  .targeta h3 { margin:0; font-size:1.3rem; }
  .targeta h3 a { color:var(--negre); text-decoration:none; }
  .targeta h3 a:hover { color:var(--taronja); }
  .targeta .desc { margin:0; color:var(--gris); font-size:1rem; flex:1; }
  .etiquetes { display:flex; gap:6px; flex-wrap:wrap; }
  .etiqueta { font-size:.8rem; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--suau); }
  .etiqueta.beta { background:transparent; border:1.5px dashed var(--taronja); color:var(--taronja); }
  .versions { font-size:.9rem; color:var(--gris); }
  .versions a { color:var(--negre); font-weight:600; }
  .versions a:hover { color:var(--taronja); }
  .etiqueta.ext { background:#fff1e8; color:var(--taronja); }
  .botons { display:flex; gap:8px; margin-top:4px; }
  .botons a, .botons button { font:inherit; font-size:.95rem; font-weight:600; padding:8px 14px; border-radius:10px; cursor:pointer; text-decoration:none; }
  .obrir { background:var(--taronja); color:#fff; border:2px solid var(--taronja); }
  .copiar { background:var(--fons); color:var(--negre); border:2px solid var(--negre); }
  .copiar.fet { background:var(--negre); color:var(--fons); }
  .pendent { opacity:.45; }
  .pendent .botons { display:none; }
  .buit { color:var(--gris); font-style:italic; }
  /* Barra d'eines */
  .barra { display:flex; gap:6px; align-items:center; }
  .barra button { width:46px; height:46px; border:2px solid var(--negre); background:var(--fons); color:var(--negre); border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .barra button:hover, .barra button.on { background:var(--negre); color:var(--fons); }
  .barra svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #tpill { display:none; font:700 1rem system-ui,sans-serif; background:var(--taronja); color:#fff; border:0; border-radius:999px; padding:10px 16px; cursor:pointer; font-variant-numeric:tabular-nums; }

  /* Calculadora (com la de la Llibreta del Profe) */
  #calc{position:fixed;right:24px;top:120px;width:290px;background:var(--fons);border:1px solid #999;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:350;display:none;color:var(--negre)}
  #calc .ch{background:var(--granat);color:#fff;padding:6px 10px;border-radius:11px 11px 0 0;cursor:move;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px;user-select:none;touch-action:none}
  #calc .ch button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
  #calc .cdw{position:relative}
  #calc #calcCp{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:#888;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #calc #calcCp:hover{background:var(--suau);color:var(--negre)}#calc #calcCp.ok{color:#1a8f3c;font-weight:800}
  #calc input{width:calc(100% - 16px);margin:8px;font-size:24px;text-align:right;padding:6px 8px 6px 40px;border:1px solid #bbb;border-radius:6px;background:var(--fons);color:var(--negre)}
  #calc .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 8px 8px}
  #calc .kp button{font-size:20px;padding:11px 0;border:1px solid var(--linia);background:var(--suau);color:var(--negre);border-radius:6px;cursor:pointer}
  #calc .kp button:hover{background:#ffd9bf;color:#111}
  #calc .kp button.op{font-weight:700;filter:brightness(.95)}
  #calc .kp button.eq{grid-column:1/-1;background:var(--taronja);color:#fff;border-color:var(--taronja)}
  #calc .hist{font-size:13px;color:var(--gris);text-align:right;padding:4px 12px 0;min-height:18px}
  #calcAm{width:38px;height:36px;margin:-6px 10px -6px auto;flex:0 0 auto;pointer-events:none;overflow:hidden;display:block}
  #calcAm *{transform-box:fill-box}#calcAm .mir{transform-box:view-box}#calcAm .mig,#calcAm .lid{opacity:0}#calcAm .pu{transition:transform .15s}
  #calcAm .tent{transform-origin:0% 50%}#calcAm .body{transform-origin:0% 0%}#calcAm .eye{transform-origin:50% 50%}#calcAm .spark{transform-origin:50% 50%}
  #calcAm.ca-surt .body{animation:amSurt .6s cubic-bezier(.3,1.5,.5,1)}
  #calcAm.ca-par .eye{animation:caUll .35s}#calcAm.ca-par .lid{animation:caLid .35s}
  @keyframes caUll{0%,100%{opacity:1}25%,70%{opacity:0}}@keyframes caLid{0%,100%{opacity:0}25%,70%{opacity:1}}
  #calcAm.ca-onada .tent{animation:amTent .25s ease-in-out 2 alternate}#calcAm.ca-onada .tent:nth-of-type(2){animation-delay:.05s}#calcAm.ca-onada .tent:nth-of-type(3){animation-delay:.1s}
  #calcAm.ca-error .tent{animation:caCau 1.1s ease-in-out}#calcAm.ca-error .mig{animation:caMig 1.1s}
  @keyframes caCau{0%,100%{transform:none}20%,80%{transform:rotate(30deg) translateY(1.5px)}}@keyframes caMig{0%,100%{opacity:0}12%,88%{opacity:1}}
  #calcAm.ca-sorpres .eye{animation:caGran .9s}@keyframes caGran{0%,100%{transform:none}15%,75%{transform:scale(1.4)}}
  #calcAm.ca-escombra .tent{animation:caEsc .45s ease-in-out}@keyframes caEsc{0%,100%{transform:none}35%{transform:rotate(-24deg)}70%{transform:rotate(20deg)}}
  #calcAm.ca-espurna .spark{animation:amSpark .75s ease-out}
  @media(prefers-reduced-motion:reduce){#calcAm *{animation:none!important;transition:none!important}}

  /* Temporitzador a pantalla completa */
  #ov{position:fixed;inset:0;background:rgba(10,10,10,.96);color:#fff;z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:20px}
  #ov .tanca{position:absolute;top:20px;right:24px;background:none;border:2px solid #fff;color:#fff;font:600 16px system-ui,sans-serif;border-radius:10px;padding:8px 14px;cursor:pointer}
  #ov .sub{font-size:24px;color:#bbb}
  #ov .gran{font:800 min(30vw,260px)/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-4px}
  #ov .rapids{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #ov .btn{font:700 20px system-ui,sans-serif;background:#fff;color:#111;border:0;border-radius:12px;padding:14px 22px;cursor:pointer}
  #ov .btn:hover{background:var(--taronja);color:#fff}
  #ov .btn.sec{background:transparent;color:#fff;border:2px solid #fff}
  #ov input{font:700 22px system-ui,sans-serif;width:90px;padding:8px;border-radius:10px;border:0;text-align:center}
  #ov .fila{display:flex;gap:10px;align-items:center;justify-content:center;font-size:20px;flex-wrap:wrap}
  #ov .barrat{width:min(80vw,900px);height:14px;background:#333;border-radius:7px;overflow:hidden}
  #ov .barrat div{height:100%;background:var(--taronja);transition:width .25s linear}
  #ov.alarma{animation:alarma 1s steps(2) infinite}@keyframes alarma{50%{background:var(--taronja)}}

  footer { text-align:center; color:var(--gris); font-size:.9rem; padding:20px; border-top:1px solid var(--linia); }
</style>
</head>

<script>document.write('<script src="apps.js?v='+Date.now()+'"><\/script>')</script>
<script>
  const menu = document.getElementById("menu");
  const contingut = document.getElementById("contingut");
  const cerca = document.getElementById("cerca");

  const urlAbsoluta = u => new URL(u, location.href).href;
  const esExterna = u => /^https?:\/\//.test(u) && new URL(u).host !== location.host;
  const net = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  let PLEGATS = new Set(); try { PLEGATS = new Set(JSON.parse(localStorage.getItem("boigxtic-plegats") || "[]")); } catch (e) {}
  const desaPlegats = () => { try { localStorage.setItem("boigxtic-plegats", JSON.stringify([...PLEGATS])); } catch (e) {} };
  function pinta() {
    const filtre = location.hash.slice(1);
    const q = net(cerca.value);

    menu.innerHTML = `<a href="#" class="${filtre ? "" : "actiu"}">Totes</a>` +
      MATERIES.map(m => `<a href="#${m.id}" class="${filtre === m.id ? "actiu" : ""}">${m.nom}</a>`).join("") +
      (!filtre && !q ? `<button id="plegaTot">${PLEGATS.size === MATERIES.length ? "Desplega-ho tot" : "Plega-ho tot"}</button>` : "");
    const pt = document.getElementById("plegaTot");
    if (pt) pt.onclick = () => { PLEGATS = PLEGATS.size === MATERIES.length ? new Set() : new Set(MATERIES.map(m => m.id)); desaPlegats(); pinta(); };

    contingut.innerHTML = "";
    MATERIES.filter(m => !filtre || m.id === filtre).forEach(m => {
      const apps = APPS.filter(a => a.materia === m.id &&
        (!q || net(a.titol + " " + a.desc + " " + a.nivell).includes(q)));
      if (q && !apps.length) return;

      const s = document.createElement("section");
      const plegat = !q && !filtre && PLEGATS.has(m.id);
      s.className = plegat ? "plegat" : "";
      s.innerHTML = `<h2 title="Clica per plegar o desplegar"><svg class="fl" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>${m.nom} <span class="n">${apps.length}</span></h2><div class="graella"></div>`;
      s.querySelector("h2").onclick = () => { if (q || filtre) return; PLEGATS.has(m.id) ? PLEGATS.delete(m.id) : PLEGATS.add(m.id); desaPlegats(); pinta(); };
      const g = s.querySelector(".graella");
      if (!apps.length) g.innerHTML = `<p class="buit">Encara no hi ha apps.</p>`;

      apps.forEach(a => {
        const t = document.createElement("div");
        t.className = "targeta" + (a.url ? "" : " pendent");
        const ext = a.url && esExterna(a.url);
        t.innerHTML = `
          <h3>${a.url ? `<a href="${a.url}">${a.titol}</a>` : a.titol}</h3>
          <div class="etiquetes">
            ${a.nivell ? `<span class="etiqueta">${a.nivell}</span>` : ""}
            ${ext ? `<span class="etiqueta ext">🔗 externa</span>` : ""}
            ${a.url ? "" : `<span class="etiqueta">pendent</span>`}
            ${a.estat === "beta" ? `<span class="etiqueta beta" title="Versió beta: encara s'hi està treballant, pot tenir errors o canviar">🧪 beta</span>` : ""}
          </div>
          <p class="desc">${a.desc || ""}</p>
          <div class="botons">
            <a class="obrir" href="${a.url}">Obrir</a>
            <button class="copiar">📋 Copiar enllaç</button>
          </div>
          ${(a.versions||[]).length ? `<div class="versions">Altres versions: ${a.versions.map(v => `<a href="${v.url}">${v.nom}</a>`).join(" · ")}</div>` : ""}`;
        const b = t.querySelector(".copiar");
        b.onclick = () => {
          navigator.clipboard.writeText(urlAbsoluta(a.url)).then(() => {
            b.textContent = "✓ Copiat"; b.classList.add("fet");
            setTimeout(() => { b.textContent = "📋 Copiar enllaç"; b.classList.remove("fet"); }, 1500);
          });
        };
        g.appendChild(t);
      });
      contingut.appendChild(s);
    });

    if (!contingut.children.length) contingut.innerHTML = `<p class="buit" style="margin-top:30px">Cap app coincideix amb «${cerca.value}».</p>`;
  }

  cerca.addEventListener("input", pinta);
  window.addEventListener("hashchange", pinta);
  pinta();

  /* ---- Mode fosc (es recorda en aquest navegador) ---- */
  const $=q=>document.querySelector(q),$$=q=>document.querySelectorAll(q);
  const desa=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, llegeix=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  function posaFosc(f){document.body.classList.toggle('fosc',f);$('#bFosc').classList.toggle('on',f)}
  posaFosc(llegeix('boigxtic-fosc')===null?matchMedia('(prefers-color-scheme: dark)').matches:llegeix('boigxtic-fosc')==='1');
  $('#bFosc').onclick=()=>{const f=!document.body.classList.contains('fosc');posaFosc(f);desa('boigxtic-fosc',f?'1':'0')};

  /* ---- Pantalla completa ---- */
  $('#bPC').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
  document.addEventListener('fullscreenchange',()=>$('#bPC').classList.toggle('on',!!document.fullscreenElement));

  /* ---- Calculadora amb l'Ammo (com a la Llibreta del Profe) ---- */
  const calc=$('#calc'),cin=$('#calcIn');
  $('#calcKp').innerHTML=['C','(',')','←','7','8','9','÷','4','5','6','×','1','2','3','−','0',',','%','+','='].map(k=>`<button class="${'÷×−+()←C%'.includes(k)?'op':k==='='?'eq':''}">${k}</button>`).join('');
  function calcObre(){const vis=calc.style.display==='block';calc.style.display=vis?'none':'block';$('#bCalc').classList.toggle('on',!vis);if(!vis){cin.focus();caPrepara();caFes('ca-surt',650);caDorm()}}
  function calcTanca(){calc.style.display='none';$('#bCalc').classList.remove('on')}
  function caPrepara(){if($('#calcAm'))return;const s=$('#ammo svg');if(!s)return;const t=document.createElement('div');t.innerHTML=s.outerHTML;const v=t.firstElementChild;
    v.id='calcAm';v.setAttribute('viewBox','32 54 44 41');v.removeAttribute('width');v.removeAttribute('height');v.removeAttribute('aria-label');v.setAttribute('aria-hidden','true');
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform','translate(110 0) scale(-1 1)');g.setAttribute('class','mir');while(v.firstChild)g.appendChild(v.firstChild);v.appendChild(g);
    v.querySelectorAll('[class]').forEach(e=>{if(e.getAttribute('style'))e.removeAttribute('style')});
    const ey=v.querySelector('.eye');if(ey){ey.querySelectorAll('circle')[1]?.classList.add('pu');const m=document.createElementNS('http://www.w3.org/2000/svg','path');m.setAttribute('class','mig');m.setAttribute('d','M51.2 74.2 a4.8 4.8 0 0 1 9.6 0z');m.setAttribute('fill','#111');m.setAttribute('stroke','#fff');m.setAttribute('stroke-width','1.2');ey.after(m)}
    $('#calcX').before(v)}
  const caQuiet=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  function caFes(k,ms){const v=$('#calcAm');if(!v||caQuiet())return;v.classList.remove(k);void v.getBoundingClientRect();v.classList.add(k);clearTimeout(v['_'+k]);v['_'+k]=setTimeout(()=>v.classList.remove(k),ms);caDorm()}
  function caMira(el){const v=$('#calcAm'),pu=v?.querySelector('.pu'),ey=v?.querySelector('.eye');if(!pu||!el||caQuiet())return;
    const a=ey.getBoundingClientRect(),b=el.getBoundingClientRect(),dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),l=Math.hypot(dx,dy)||1;
    pu.style.transform=`translate(${(-dx/l*1.3).toFixed(2)}px,${(dy/l*1.3).toFixed(2)}px)`;clearTimeout(pu._t);pu._t=setTimeout(()=>pu.style.transform='',1100)}
  function caDorm(){clearTimeout(caDorm.t);caDorm.t=setTimeout(()=>{if(calc.style.display==='block')caFes('ca-par',400);else return;caDorm()},20000+Math.random()*20000)}
  /* Càlcul propi: números, + − × ÷, % i parèntesis (no executa el text com a codi). 200+10% = 220 · 50×20% = 10 */
  function calcula(txt){
    const t=[];let i=0;const x=String(txt).replace(/\s/g,'');
    while(i<x.length){const c=x[i];
      if(/[0-9.,]/.test(c)){let j=i;while(j<x.length&&/[0-9.,]/.test(x[j]))j++;const n=x.slice(i,j).replace(',','.');
        if((x.slice(i,j).match(/[.,]/g)||[]).length>1||n==='.')throw new Error('Número mal escrit: '+x.slice(i,j));t.push({k:'n',v:parseFloat(n)});i=j;continue}
      const op={'+':'+','-':'-','−':'-','*':'*','×':'*','x':'*','X':'*','/':'/','÷':'/',':':'/','(':'(',')':')','%':'%'}[c];
      if(!op)throw new Error('Caràcter no vàlid: «'+c+'»');t.push({k:op});i++}
    if(!t.length)throw new Error('Escriu una operació');
    let p=0;const mira=()=>t[p]?.k,pren=()=>t[p++];
    function factor(){const k=mira();
      if(k==='-'){pren();return -factor()}if(k==='+'){pren();return factor()}
      if(k==='n')return pren().v;
      if(k==='('){pren();const v=expr();if(mira()!==')')throw new Error('Falta tancar un parèntesi');pren();return v}
      if(k===')')throw new Error('Sobra un parèntesi o falta un número');
      throw new Error(k===undefined?'Falta un número al final':'Falta un número abans de «'+({'*':'×','/':'÷'}[k]||k)+'»')}
    function postfix(){let v=factor(),pc=false;while(mira()==='%'){pren();v/=100;pc=true}
      while(mira()==='n'||mira()==='('){v*=factor();pc=false;while(mira()==='%'){pren();v/=100;pc=true}}
      return {v,pc}}
    function terme(){let r=postfix(),v=r.v,pc=r.pc;
      while(mira()==='*'||mira()==='/'){const o=pren().k,d=postfix().v;pc=false;
        if(o==='/'){if(d===0)throw new Error('No es pot dividir per zero');v/=d}else v*=d}
      return {v,pc}}
    function expr(){let v=terme().v;
      while(mira()==='+'||mira()==='-'){const o=pren().k,r=terme();const d=r.pc?v*r.v:r.v;v=o==='+'?v+d:v-d}
      return v}
    const v=expr();if(p<t.length)throw new Error(mira()===')'?'Sobra un parèntesi':'Expressió incompleta');
    if(!isFinite(v))throw new Error('Resultat massa gran');return Math.round(v*1e10)/1e10}
  function calcAvalua(){const e=cin.value.trim();if(!e)return;
    try{const r=calcula(e);$('#calcHist').textContent=cin.value+' =';cin.value=String(r).replace('.',',');caFes('ca-par',400);caFes('ca-onada',600)}
    catch(err){$('#calcHist').textContent=err.message;/zero/.test(err.message)?caFes('ca-sorpres',1000):caFes('ca-error',1200)}}
  $('#calcKp').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.textContent;caMira(b);
    if(k==='C'){cin.value='';$('#calcHist').textContent='';caFes('ca-escombra',500)}else if(k==='←')cin.value=cin.value.slice(0,-1);else if(k==='=')calcAvalua();else cin.value+=k;cin.focus()};
  async function calcCopia(){const v=cin.value.trim();if(!v)return;let ok=true;
    try{await navigator.clipboard.writeText(v)}catch(e){try{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove()}catch(e2){ok=false}}
    const b=$('#calcCp');if(ok){caFes('ca-espurna',800);b.textContent='✓';b.classList.add('ok');clearTimeout(b._t);b._t=setTimeout(()=>{b.textContent='⧉';b.classList.remove('ok')},1200)}cin.focus()}
  $('#calcCp').onclick=calcCopia;
  cin.addEventListener('input',()=>caMira(cin));
  cin.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='c'&&cin.selectionStart===cin.selectionEnd){e.preventDefault();calcCopia();return}
    if(e.key==='Enter'){e.preventDefault();calcAvalua()}if(e.key==='Escape')calcTanca()};
  $('#bCalc').onclick=calcObre;$('#calcX').onclick=calcTanca;
  (()=>{let dx=0,dy=0,drag=false;const h=$('#calcH');
    h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;h.setPointerCapture(e.pointerId);const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;e.preventDefault()});
    h.addEventListener('pointermove',e=>{if(!drag)return;calc.style.left=Math.max(0,Math.min(innerWidth-calc.offsetWidth,e.clientX-dx))+'px';calc.style.top=Math.max(0,Math.min(innerHeight-60,e.clientY-dy))+'px';calc.style.right='auto'});
    h.addEventListener('pointerup',()=>drag=false)})();

  /* ---- Temporitzador ---- */
  const ov=$('#ov'),p2=n=>String(n).padStart(2,'0');
  const T={fi:0,dur:0,resta:0,pausa:false,int:null,sona:false,beep:null,ac:null};
  const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${p2(Math.floor(s/60))}:${p2(s%60)}`};
  function obreOv(html,onKey){ov.innerHTML=`<button class="tanca" id="ovX">✕ Tanca (Esc)</button>`+html;ov.style.display='flex';ov._key=onKey;$('#ovX').onclick=tancaOv}
  function tancaOv(){ov.style.display='none';ov.innerHTML='';ov._key=null;ov.classList.remove('alarma');if(T.sona)aturaAlarma()}
  document.addEventListener('keydown',e=>{if(ov.style.display!=='flex')return;if(e.key==='Escape'){e.preventDefault();tancaOv();return}ov._key&&ov._key(e)});
  function obreTemp(){if(T.int||T.sona)return vistaTemp();
    obreOv(`<div class="sub">Temporitzador</div>
      <div class="rapids">${[1,2,3,5,10,15,20,30].map(m=>`<button class="btn" data-tm="${m}">${m} min</button>`).join('')}</div>
      <div class="fila">o bé <input type="number" id="tMin" min="0" max="180" value="5"> min <input type="number" id="tSeg" min="0" max="59" value="0"> s <button class="btn" id="tGo">Comença</button></div>`,
      e=>{if(e.key==='Enter')$('#tGo')?.click()});
    $$('[data-tm]').forEach(b=>b.onclick=()=>iniciaTemp(+b.dataset.tm*60000));
    $('#tGo').onclick=()=>{const ms=((+$('#tMin').value||0)*60+(+$('#tSeg').value||0))*1000;if(ms>0)iniciaTemp(ms)}}
  function iniciaTemp(ms){try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();T.ac.resume()}catch(e){}
    T.dur=ms;T.fi=Date.now()+ms;T.pausa=false;clearInterval(T.int);T.int=setInterval(tic,250);vistaTemp();tic()}
  function vistaTemp(){
    obreOv(`<div class="sub">Temporitzador</div><div class="gran" id="tGran">--:--</div><div class="barrat"><div id="tBar"></div></div>
      <div class="rapids"><button class="btn sec" id="tPau">Pausa</button><button class="btn sec" id="tMes">+1 min</button><button class="btn sec" id="tReset">Reinicia</button><button class="btn sec" id="tStop">Atura</button></div>
      <div class="sub" style="font-size:16px">Pots tancar aquesta finestra: el compte continua i sonarà igualment.</div>`,
      e=>{if(e.key===' '&&!T.sona){e.preventDefault();$('#tPau')?.click()}});
    $('#tPau').onclick=()=>{if(T.pausa){T.fi=Date.now()+T.resta;T.pausa=false}else{T.resta=T.fi-Date.now();T.pausa=true}tic()};
    $('#tMes').onclick=()=>{if(T.sona){aturaAlarma();T.fi=Date.now()+60000;T.dur=60000;T.int=setInterval(tic,250);vistaTemp();return}if(T.pausa)T.resta+=60000;else T.fi+=60000;T.dur+=60000;tic()};
    $('#tReset').onclick=()=>{aturaAlarma();iniciaTemp(T.dur)};
    $('#tStop').onclick=()=>{aturaAlarma();clearInterval(T.int);T.int=null;$('#tpill').style.display='none';$('#bTemp').classList.remove('on');tancaOv()};
    if(T.sona)mostraAlarma();else tic()}
  function tic(){const r=T.pausa?T.resta:T.fi-Date.now();const pill=$('#tpill');
    pill.style.display=T.int?'inline-block':'none';pill.textContent='⏱ '+mmss(r)+(T.pausa?' ⏸':'');$('#bTemp').classList.toggle('on',!!T.int);
    if($('#tGran')){$('#tGran').textContent=mmss(r);$('#tBar').style.width=Math.max(0,100*r/T.dur)+'%';$('#tPau').textContent=T.pausa?'Continua':'Pausa'}
    if(!T.pausa&&r<=0){clearInterval(T.int);T.int=null;pill.style.display='none';$('#bTemp').classList.remove('on');sonaAlarma()}}
  function bip(){const ac=T.ac;if(!ac)return;const t0=ac.currentTime;[0,.22,.44].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.25,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.18);o.connect(g).connect(ac.destination);o.start(t0+d);o.stop(t0+d+.2)})}
  function sonaAlarma(){T.sona=true;bip();T.beep=setInterval(bip,1200);vistaTemp()}
  function mostraAlarma(){ov.classList.add('alarma');$('#tGran').textContent='00:00';$('#tBar').style.width='0';$('#tPau').style.display='none';
    setTimeout(()=>{if(T.sona){aturaAlarma();if(ov.style.display==='flex')tancaOv()}},30000)}
  function aturaAlarma(){T.sona=false;clearInterval(T.beep);T.beep=null;ov.classList.remove('alarma')}
  $('#bTemp').onclick=obreTemp;$('#tpill').onclick=obreTemp;

  /* ---- Ammo: flota, cada 6-10 s fa alguna cosa; si fa 1 min que no toques res, dorm; clica'l i fa una cosa nova ---- */
  const AM_ACC=['parpella','saluda','salta','gira','balanc','mira','idea','bombolles'],
        AM_DUR={parpella:1300,saluda:1500,salta:1000,gira:1100,balanc:1900,mira:2500,idea:1500,bombolles:1900};
  const amReduit=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ammo=document.getElementById('ammo');
  const AM={ult:'',quiet:Date.now(),dorm:false,zt:null};
  function amFx(k){let f=ammo.querySelector('.afx');if(!f){f=document.createElement('div');f.className='afx';ammo.appendChild(f)}f.innerHTML='';
    if(k==='bombolles')[0,1,2].forEach(i=>{const b=document.createElement('i');b.className='abub';const z=6+i*3;b.style.cssText=`width:${z}px;height:${z}px;left:${60+i*5}%;top:56%;animation-delay:${i*.35}s`;f.appendChild(b)});
    if(k==='zz')[0,1,2].forEach(i=>{const z=document.createElement('span');z.className='azz';z.textContent='z';z.style.cssText=`left:55%;top:30%;font-size:${11+i*4}px;animation-delay:${i*.7}s`;f.appendChild(z)})}
  function amFes(k,base='flota'){if(amReduit())return;ammo.className='amb'+(base?' am-'+base:'');void ammo.offsetWidth;ammo.classList.add('am-'+k);amFx(k);
    clearTimeout(ammo._t);if(k!=='amaga')ammo._t=setTimeout(()=>ammo.classList.remove('am-'+k),AM_DUR[k]||1500)}
  function amTria(){let k;do k=AM_ACC[Math.floor(Math.random()*AM_ACC.length)];while(k===AM.ult);AM.ult=k;return k}
  function amTic(){
    if(!AM.dorm&&Date.now()-AM.quiet>60000){AM.dorm=true;amFes('amaga',null);const zz=()=>{if(AM.dorm){amFx('zz');AM.zt=setTimeout(zz,3200)}};AM.zt=setTimeout(zz,800)}
    else if(!AM.dorm&&!document.hidden)amFes(amTria());
    setTimeout(amTic,6000+Math.random()*4000)}
  function amDesperta(){AM.quiet=Date.now();if(AM.dorm){AM.dorm=false;clearTimeout(AM.zt);amFes('surt');setTimeout(()=>amFes('parpella'),700)}}
  ['pointermove','keydown','pointerdown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,amDesperta,{passive:true}));
  ammo.addEventListener('click',()=>{if(!AM.dorm)amFes(amTria())});
  if(!amReduit()){ammo.className='amb am-flota';setTimeout(()=>amFes('saluda'),500);setTimeout(amTic,6000+Math.random()*3000)}
</script>
</body>
</html>
